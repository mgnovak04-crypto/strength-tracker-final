<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Strength">
    <meta name="theme-color" content="#1a1a2e">
    <title>12-Month Strength Tracker</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>💪</text></svg>">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #4361ee; --primary-dark: #3a56d4; --secondary: #7209b7;
            --accent: #f72585; --success: #4cc9f0; --warning: #ffd60a;
            --bg-dark: #1a1a2e; --bg-card: #16213e; --bg-card-light: #1f3460;
            --text-primary: #ffffff; --text-secondary: #a0a0b0; --border: #2a2a4a;
            --strava: #fc4c02;
        }
        .light-mode {
            --bg-dark: #f5f5f7; --bg-card: #ffffff; --bg-card-light: #f0f0f5;
            --text-primary: #1a1a2e; --text-secondary: #666680; --border: #e0e0e5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0; background: var(--bg-dark); color: var(--text-primary);
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.3s, color 0.3s;
        }
        #root { min-height: 100vh; }
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed; width: 10px; height: 10px; top: 0;
            animation: confetti-fall 3s ease-out forwards; z-index: 9999; pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse { animation: pulse 0.5s ease-in-out 3; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .haptic { transition: transform 0.1s; }
        .haptic:active { transform: scale(0.97); }
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ============ DATA CONFIGURATION ============
        const phases = [
            { id: 1, name: 'Foundation', months: '1-3', reps: '3×12-15', color: '#4cc9f0', sets: 3 },
            { id: 2, name: 'Strength', months: '4-6', reps: '4×6-8', color: '#4361ee', sets: 4 },
            { id: 3, name: 'Power', months: '7-9', reps: '5×3-5', color: '#7209b7', sets: 5 },
            { id: 4, name: 'Peak', months: '10-12', reps: '3×5-8', color: '#f72585', sets: 3 },
        ];

        const workoutDays = [
            { id: 1, name: 'Lower Power', icon: 'fa-solid fa-dumbbell', muscles: 'Quads, Glutes, Hamstrings' },
            { id: 2, name: 'Upper + Core', icon: 'fa-solid fa-child-reaching', muscles: 'Chest, Back, Shoulders, Core' },
            { id: 3, name: 'Single Leg', icon: 'fa-solid fa-person-running', muscles: 'Unilateral, Stability, Calves' },
        ];

        const exercisesByPhaseAndDay = {
            1: {
                1: [
                    { name: 'Goblet Squat', reps: '12-15', muscle: 'Quads' },
                    { name: 'Romanian Deadlift', reps: '12-15', muscle: 'Hamstrings' },
                    { name: 'Hip Thrust', reps: '12-15', muscle: 'Glutes' },
                    { name: 'Box Step-ups', reps: '12-15/leg', muscle: 'Quads' },
                    { name: 'Jump Squats', reps: '10-12', muscle: 'Power' },
                    { name: 'Standing Calf Raises', reps: '15-20', muscle: 'Calves' },
                ],
                2: [
                    { name: 'Push-ups', reps: '12-15', muscle: 'Chest' },
                    { name: 'Bent-Over Rows', reps: '12-15', muscle: 'Back' },
                    { name: 'DB Shoulder Press', reps: '12-15', muscle: 'Shoulders' },
                    { name: 'Face Pulls', reps: '15-20', muscle: 'Rear Delts' },
                    { name: 'Pallof Press', reps: '12-15/side', muscle: 'Core' },
                    { name: 'Farmers Carry', reps: '40m', muscle: 'Core/Grip' },
                ],
                3: [
                    { name: 'Bulgarian Split Squat', reps: '12-15/leg', muscle: 'Quads' },
                    { name: 'Single-Leg RDL', reps: '12-15/leg', muscle: 'Hamstrings' },
                    { name: 'Step-ups', reps: '12-15/leg', muscle: 'Quads' },
                    { name: 'TKE', reps: '15-20/leg', muscle: 'VMO' },
                    { name: 'Eccentric Calf Raises', reps: '12-15/leg', muscle: 'Calves' },
                    { name: 'Dead Bugs', reps: '10-12/side', muscle: 'Core' },
                ],
            },
            2: {
                1: [
                    { name: 'Back Squat', reps: '6-8', muscle: 'Quads' },
                    { name: 'Trap Bar Deadlift', reps: '6-8', muscle: 'Posterior Chain' },
                    { name: 'Barbell Hip Thrust', reps: '6-8', muscle: 'Glutes' },
                    { name: 'Walking Lunges', reps: '8-10/leg', muscle: 'Quads' },
                    { name: 'Squat Jumps', reps: '6-8', muscle: 'Power' },
                    { name: 'Seated Calf Raises', reps: '10-12', muscle: 'Calves' },
                ],
                2: [
                    { name: 'DB Bench Press', reps: '6-8', muscle: 'Chest' },
                    { name: 'Barbell Rows', reps: '6-8', muscle: 'Back' },
                    { name: 'Overhead Press', reps: '6-8', muscle: 'Shoulders' },
                    { name: 'Cable Rows', reps: '8-10', muscle: 'Back' },
                    { name: 'Woodchops', reps: '10-12/side', muscle: 'Core' },
                    { name: 'Suitcase Carry', reps: '40m/side', muscle: 'Core' },
                ],
                3: [
                    { name: 'RFESS', reps: '6-8/leg', muscle: 'Quads' },
                    { name: 'Weighted SL RDL', reps: '6-8/leg', muscle: 'Hamstrings' },
                    { name: 'Lateral Step-ups', reps: '8-10/leg', muscle: 'Glutes' },
                    { name: 'Spanish Squats', reps: '10-12', muscle: 'VMO' },
                    { name: 'Single-Leg Calf Raises', reps: '10-12/leg', muscle: 'Calves' },
                    { name: 'Bird Dogs', reps: '10-12/side', muscle: 'Core' },
                ],
            },
            3: {
                1: [
                    { name: 'Front Squat', reps: '3-5', muscle: 'Quads' },
                    { name: 'Power Clean', reps: '3-5', muscle: 'Full Body' },
                    { name: 'Pause Hip Thrust', reps: '3-5', muscle: 'Glutes' },
                    { name: 'Jump Lunges', reps: '5-6/leg', muscle: 'Power' },
                    { name: 'Depth Jumps', reps: '3-5', muscle: 'Power' },
                    { name: 'Explosive Calf Raises', reps: '8-10', muscle: 'Calves' },
                ],
                2: [
                    { name: 'Incline DB Press', reps: '3-5', muscle: 'Chest' },
                    { name: 'Weighted Pull-ups', reps: '3-5', muscle: 'Back' },
                    { name: 'Push Press', reps: '3-5', muscle: 'Shoulders' },
                    { name: 'Chest Supported Rows', reps: '5-6', muscle: 'Back' },
                    { name: 'Landmine Rotation', reps: '6-8/side', muscle: 'Core' },
                    { name: 'Overhead Carry', reps: '30m', muscle: 'Core' },
                ],
                3: [
                    { name: 'Pistol Squat Prog.', reps: '3-5/leg', muscle: 'Quads' },
                    { name: 'SL Hip Thrust', reps: '5-6/leg', muscle: 'Glutes' },
                    { name: 'Skater Hops', reps: '6-8/side', muscle: 'Power' },
                    { name: 'Nordic Curls', reps: '3-5', muscle: 'Hamstrings' },
                    { name: 'Deficit Calf Raises', reps: '8-10/leg', muscle: 'Calves' },
                    { name: 'Copenhagen Plank', reps: '20-30s/side', muscle: 'Adductors' },
                ],
            },
            4: {
                1: [
                    { name: 'Goblet Squat', reps: '5-8', muscle: 'Quads' },
                    { name: 'Romanian Deadlift', reps: '5-8', muscle: 'Hamstrings' },
                    { name: 'Hip Thrust', reps: '5-8', muscle: 'Glutes' },
                    { name: 'Reverse Lunges', reps: '6-8/leg', muscle: 'Quads' },
                    { name: 'Box Jumps', reps: '5-6', muscle: 'Power' },
                    { name: 'Calf Complex', reps: '10-12', muscle: 'Calves' },
                ],
                2: [
                    { name: 'DB Bench Press', reps: '5-8', muscle: 'Chest' },
                    { name: 'Single-Arm Rows', reps: '6-8/arm', muscle: 'Back' },
                    { name: 'Arnold Press', reps: '6-8', muscle: 'Shoulders' },
                    { name: 'Band Pull-aparts', reps: '15-20', muscle: 'Rear Delts' },
                    { name: 'Anti-Rotation Press', reps: '10-12/side', muscle: 'Core' },
                    { name: 'Mixed Carry', reps: '40m', muscle: 'Core' },
                ],
                3: [
                    { name: 'Bulgarian Split Squat', reps: '6-8/leg', muscle: 'Quads' },
                    { name: 'Single-Leg RDL', reps: '6-8/leg', muscle: 'Hamstrings' },
                    { name: 'Step-up to Rev Lunge', reps: '5-6/leg', muscle: 'Quads' },
                    { name: 'Wall Sits', reps: '45-60s', muscle: 'Quads' },
                    { name: 'Eccentric SL Calf', reps: '10-12/leg', muscle: 'Calves' },
                    { name: 'Plank Variations', reps: '30-45s', muscle: 'Core' },
                ],
            },
        };

        const keyExercises = [
            { name: 'Split Squat', icon: '🦵' },
            { name: 'Hip Thrust', icon: '🍑' },
            { name: 'Calf Raises', icon: '🦶' },
            { name: 'Bench/Push', icon: '💪' },
            { name: 'Rows', icon: '🔙' },
            { name: 'Squat', icon: '⬇️' },
        ];

        // ============ STORAGE HELPERS ============
        const saveData = (key, data) => localStorage.setItem(key, JSON.stringify(data));
        const loadData = (key, defaultValue) => {
            try { const stored = localStorage.getItem(key); return stored ? JSON.parse(stored) : defaultValue; }
            catch { return defaultValue; }
        };

        // ============ CONFETTI ============
        const triggerConfetti = () => {
            const colors = ['#4361ee', '#f72585', '#4cc9f0', '#ffd60a', '#7209b7'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        };

        // ============ COMPONENTS ============
        const Header = ({ title, onBack, rightAction, subtitle }) => (
            <div style={{
                background: 'linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-light) 100%)',
                padding: '16px 20px', paddingTop: `calc(16px + env(safe-area-inset-top))`,
                display: 'flex', flexDirection: 'column', position: 'sticky', top: 0, zIndex: 100,
                borderBottom: '1px solid var(--border)',
            }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    {onBack ? (
                        <button onClick={onBack} className="haptic" style={{
                            background: 'none', border: 'none', color: 'var(--primary)',
                            fontSize: '18px', cursor: 'pointer', padding: '8px', borderRadius: '8px',
                        }}><i className="fa-solid fa-chevron-left"></i></button>
                    ) : <div style={{ width: 40 }} />}
                    <h1 style={{ margin: 0, fontSize: '18px', fontWeight: '600' }}>{title}</h1>
                    {rightAction || <div style={{ width: 40 }} />}
                </div>
                {subtitle && <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px' }}>{subtitle}</div>}
            </div>
        );

        const TabBar = ({ activeTab, setActiveTab }) => (
            <div style={{
                position: 'fixed', bottom: 0, left: 0, right: 0, background: 'var(--bg-card)',
                borderTop: '1px solid var(--border)', display: 'flex',
                paddingBottom: 'env(safe-area-inset-bottom)', zIndex: 100,
            }}>
                {[
                    { id: 'workout', icon: 'fa-solid fa-dumbbell', label: 'Workout' },
                    { id: 'running', icon: 'fa-solid fa-person-running', label: 'Running' },
                    { id: 'progress', icon: 'fa-solid fa-chart-line', label: 'Progress' },
                    { id: 'settings', icon: 'fa-solid fa-gear', label: 'Settings' },
                ].map(tab => (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className="haptic"
                        style={{
                            flex: 1, padding: '10px 0 8px', border: 'none', background: 'none',
                            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px',
                            color: activeTab === tab.id ? 'var(--primary)' : 'var(--text-secondary)',
                            fontSize: '10px', fontWeight: activeTab === tab.id ? '600' : '400', cursor: 'pointer',
                        }}>
                        <i className={tab.icon} style={{ fontSize: '20px' }}></i>{tab.label}
                    </button>
                ))}
            </div>
        );

        const Card = ({ children, style, onClick, className }) => (
            <div onClick={onClick} className={`haptic ${className || ''}`}
                style={{
                    background: 'var(--bg-card)', borderRadius: '16px', padding: '16px', marginBottom: '12px',
                    border: '1px solid var(--border)', cursor: onClick ? 'pointer' : 'default',
                    transition: 'transform 0.2s, box-shadow 0.2s', ...style,
                }}>{children}</div>
        );

        const ProgressRing = ({ progress, size = 60, strokeWidth = 6, color }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;
            return (
                <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
                    <circle stroke="var(--border)" fill="transparent" strokeWidth={strokeWidth} r={radius} cx={size/2} cy={size/2} />
                    <circle stroke={color || 'var(--primary)'} fill="transparent" strokeWidth={strokeWidth} strokeLinecap="round"
                        r={radius} cx={size/2} cy={size/2}
                        style={{ strokeDasharray: circumference, strokeDashoffset: offset, transition: 'stroke-dashoffset 0.5s ease' }} />
                </svg>
            );
        };

        // ============ REST TIMER ============
        const RestTimer = ({ isOpen, onClose, defaultTime = 90 }) => {
            const [timeLeft, setTimeLeft] = useState(defaultTime);
            const [isRunning, setIsRunning] = useState(false);
            const [selectedTime, setSelectedTime] = useState(defaultTime);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (isRunning && timeLeft > 0) {
                    intervalRef.current = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0) {
                    setIsRunning(false);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
                return () => clearInterval(intervalRef.current);
            }, [isRunning, timeLeft]);

            const resetTimer = (time) => { setSelectedTime(time); setTimeLeft(time); setIsRunning(false); };
            if (!isOpen) return null;
            const progress = (timeLeft / selectedTime) * 100;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            return (
                <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
                    <Card style={{ width: '100%', maxWidth: '320px', textAlign: 'center' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '20px' }}>
                            <h3 style={{ margin: 0 }}>Rest Timer</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--text-secondary)', fontSize: '20px', cursor: 'pointer' }}><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div style={{ position: 'relative', display: 'inline-block', marginBottom: '20px' }}>
                            <ProgressRing progress={progress} size={180} strokeWidth={12} color={timeLeft === 0 ? 'var(--success)' : 'var(--primary)'} />
                            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '48px', fontWeight: '700', fontVariantNumeric: 'tabular-nums' }}>
                                {minutes}:{seconds.toString().padStart(2, '0')}
                            </div>
                        </div>
                        <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', justifyContent: 'center' }}>
                            {[60, 90, 120, 180].map(time => (
                                <button key={time} onClick={() => resetTimer(time)} className="haptic"
                                    style={{ padding: '8px 12px', border: 'none', borderRadius: '8px',
                                        background: selectedTime === time ? 'var(--primary)' : 'var(--bg-card-light)',
                                        color: selectedTime === time ? 'white' : 'var(--text-primary)', cursor: 'pointer', fontSize: '14px' }}>
                                    {time}s
                                </button>
                            ))}
                        </div>
                        <div style={{ display: 'flex', gap: '12px' }}>
                            <button onClick={() => setIsRunning(!isRunning)} className="haptic"
                                style={{ flex: 1, padding: '14px', border: 'none', borderRadius: '12px',
                                    background: isRunning ? 'var(--accent)' : 'var(--primary)', color: 'white', fontSize: '16px', fontWeight: '600', cursor: 'pointer' }}>
                                <i className={`fa-solid ${isRunning ? 'fa-pause' : 'fa-play'}`}></i> {isRunning ? 'Pause' : 'Start'}
                            </button>
                            <button onClick={() => resetTimer(selectedTime)} className="haptic"
                                style={{ padding: '14px 20px', border: 'none', borderRadius: '12px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '16px', cursor: 'pointer' }}>
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </Card>
                </div>
            );
        };

        // ============ SET TRACKER COMPONENT ============
        const SetTracker = ({ exercise, phase, sets, onSave, initialData, onClose }) => {
            const [setWeights, setSetWeights] = useState(initialData?.sets || Array(sets).fill(''));
            const [showTimer, setShowTimer] = useState(false);

            const handleSetChange = (index, value) => {
                const newWeights = [...setWeights];
                newWeights[index] = value;
                setSetWeights(newWeights);
            };

            const getAverage = () => {
                const validWeights = setWeights.filter(w => w && parseFloat(w) > 0).map(w => parseFloat(w));
                if (validWeights.length === 0) return 0;
                return (validWeights.reduce((a, b) => a + b, 0) / validWeights.length).toFixed(1);
            };

            const getMax = () => {
                const validWeights = setWeights.filter(w => w && parseFloat(w) > 0).map(w => parseFloat(w));
                return validWeights.length > 0 ? Math.max(...validWeights) : 0;
            };

            const handleSave = () => {
                onSave({
                    sets: setWeights,
                    average: parseFloat(getAverage()),
                    max: getMax(),
                    completedSets: setWeights.filter(w => w && parseFloat(w) > 0).length,
                });
                onClose();
            };

            return (
                <div className="slide-in">
                    <Header 
                        title={exercise.name}
                        subtitle={`${exercise.muscle} • ${sets}×${exercise.reps}`}
                        onBack={onClose}
                        rightAction={
                            <button onClick={() => setShowTimer(true)} className="haptic" style={{
                                background: 'var(--primary)', border: 'none', color: 'white',
                                padding: '8px 12px', borderRadius: '8px', cursor: 'pointer',
                            }}><i className="fa-solid fa-clock"></i></button>
                        }
                    />
                    <div style={{ padding: '20px', paddingBottom: '100px' }}>
                        <Card style={{ background: `linear-gradient(135deg, ${phase.color}22 0%, var(--bg-card) 100%)` }}>
                            <div style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '14px', color: 'var(--text-secondary)', marginBottom: '8px' }}>Target</div>
                                <div style={{ fontSize: '28px', fontWeight: '700', color: phase.color }}>{sets} × {exercise.reps}</div>
                            </div>
                        </Card>

                        <h3 style={{ margin: '20px 0 12px', fontSize: '14px', textTransform: 'uppercase', letterSpacing: '1px', color: 'var(--text-secondary)' }}>
                            Log Each Set
                        </h3>

                        {Array.from({ length: sets }).map((_, idx) => (
                            <Card key={idx} style={{ padding: '12px 16px' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                    <div style={{
                                        width: '36px', height: '36px', borderRadius: '50%',
                                        background: setWeights[idx] ? phase.color : 'var(--bg-card-light)',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        color: setWeights[idx] ? 'white' : 'var(--text-secondary)', fontWeight: '700',
                                    }}>{idx + 1}</div>
                                    <div style={{ flex: 1 }}>
                                        <input
                                            type="number"
                                            inputMode="decimal"
                                            value={setWeights[idx]}
                                            onChange={(e) => handleSetChange(idx, e.target.value)}
                                            placeholder={`Set ${idx + 1} weight (kg)`}
                                            style={{
                                                width: '100%', padding: '12px', fontSize: '18px', fontWeight: '600',
                                                border: '1px solid var(--border)', borderRadius: '10px',
                                                background: 'var(--bg-card-light)', color: 'var(--text-primary)', textAlign: 'center',
                                            }}
                                        />
                                    </div>
                                    {setWeights[idx] && (
                                        <i className="fa-solid fa-check-circle" style={{ color: 'var(--success)', fontSize: '20px' }}></i>
                                    )}
                                </div>
                            </Card>
                        ))}

                        <Card style={{ background: 'var(--bg-card-light)', marginTop: '20px' }}>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', textAlign: 'center' }}>
                                <div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '4px' }}>Average</div>
                                    <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--primary)' }}>{getAverage()} kg</div>
                                </div>
                                <div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '4px' }}>Max</div>
                                    <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--warning)' }}>{getMax()} kg</div>
                                </div>
                            </div>
                        </Card>

                        <button onClick={handleSave} className="haptic"
                            style={{

        // ============ WORKOUT TAB ============
        const WorkoutTab = ({ currentPhase, currentWeek, workoutData, setWorkoutData, workoutHistory, setWorkoutHistory }) => {
            const [selectedDay, setSelectedDay] = useState(null);
            const [selectedExercise, setSelectedExercise] = useState(null);
            const [notes, setNotes] = useState('');

            const phase = phases[currentPhase - 1];
            const exercises = exercisesByPhaseAndDay[currentPhase];

            const getWorkoutKey = (day, exerciseName) => `p${currentPhase}_w${currentWeek}_d${day}_${exerciseName}`;

            const handleSaveExercise = (day, exerciseName, data) => {
                const key = getWorkoutKey(day, exerciseName);
                const prevBest = getPreviousBestAvg(exerciseName);
                
                if (data.average && prevBest && data.average > prevBest) {
                    triggerConfetti();
                }

                const newData = { ...workoutData, [key]: data };
                setWorkoutData(newData);
                saveData('workoutData', newData);
            };

            const getPreviousBestAvg = (exerciseName) => {
                let best = 0;
                Object.keys(workoutData).forEach(key => {
                    if (key.includes(exerciseName)) {
                        const val = workoutData[key]?.average || 0;
                        if (val > best) best = val;
                    }
                });
                return best;
            };

            const completeWorkout = (day) => {
                const timestamp = new Date().toISOString();
                const dayExercises = exercises[day];
                const workoutLog = {
                    date: timestamp,
                    phase: currentPhase,
                    week: currentWeek,
                    day: day,
                    exercises: dayExercises.map(ex => ({
                        name: ex.name,
                        data: workoutData[getWorkoutKey(day, ex.name)] || null,
                    })),
                    notes: notes,
                };
                const newHistory = [workoutLog, ...workoutHistory].slice(0, 100);
                setWorkoutHistory(newHistory);
                saveData('workoutHistory', newHistory);
                setSelectedDay(null);
                setNotes('');
            };

            if (selectedExercise !== null && selectedDay !== null) {
                const exercise = exercises[selectedDay][selectedExercise];
                const key = getWorkoutKey(selectedDay, exercise.name);
                return (
                    <SetTracker
                        exercise={exercise}
                        phase={phase}
                        sets={phase.sets}
                        initialData={workoutData[key]}
                        onSave={(data) => handleSaveExercise(selectedDay, exercise.name, data)}
                        onClose={() => setSelectedExercise(null)}
                    />
                );
            }

            if (selectedDay !== null) {
                const dayExercises = exercises[selectedDay];
                const completedCount = dayExercises.filter(ex => workoutData[getWorkoutKey(selectedDay, ex.name)]?.completedSets > 0).length;
                const progress = (completedCount / dayExercises.length) * 100;

                return (
                    <div className="slide-in">
                        <Header 
                            title={`Day ${selectedDay}: ${workoutDays[selectedDay - 1].name}`}
                            subtitle={workoutDays[selectedDay - 1].muscles}
                            onBack={() => setSelectedDay(null)}
                        />
                        <div style={{ padding: '16px', paddingBottom: '100px' }}>
                            <Card style={{ background: `linear-gradient(135deg, ${phase.color}33 0%, var(--bg-card) 100%)` }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                                    <ProgressRing progress={progress} size={60} color={phase.color} />
                                    <div style={{ flex: 1 }}>
                                        <div style={{ fontWeight: '600', marginBottom: '4px' }}>Phase {currentPhase}: {phase.name}</div>
                                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Week {currentWeek} • {phase.sets} sets × {phase.reps.split('×')[1]}</div>
                                    </div>
                                    <div style={{ fontSize: '24px', fontWeight: '700', color: phase.color }}>{completedCount}/{dayExercises.length}</div>
                                </div>
                            </Card>

                            {dayExercises.map((exercise, idx) => {
                                const key = getWorkoutKey(selectedDay, exercise.name);
                                const data = workoutData[key];
                                const prevBest = getPreviousBestAvg(exercise.name);
                                const isPR = data?.average && prevBest && data.average > prevBest;

                                return (
                                    <Card key={idx} onClick={() => setSelectedExercise(idx)}
                                        className={isPR ? 'pulse' : ''}

                                                </div>

                                                    {phase.sets}×{exercise.reps} • {exercise.muscle}

                                                    <div style={{ fontSize: '12px', color: 'var(--primary)', marginTop: '4px' }}>

                                    style={{
                                        width: '100%', padding: '16px',
                                        background: 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)',
                                        color: 'white', border: 'none', borderRadius: '12px',
                                        fontSize: '16px', fontWeight: '600', cursor: 'pointer',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
                                    }}>
                                    <i className="fa-solid fa-flag-checkered"></i> Complete Workout
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <Header title="Today's Workout" />
                    <div style={{ padding: '16px', paddingBottom: '100px' }}>
                        <Card style={{ background: `linear-gradient(135deg, ${phase.color}44 0%, var(--bg-card) 100%)`, borderColor: phase.color }}>
                            <div style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '4px' }}>Current Program</div>
                                <div style={{ fontSize: '28px', fontWeight: '700', color: phase.color }}>Phase {currentPhase}: {phase.name}</div>
                                <div style={{ display: 'inline-block', marginTop: '12px', padding: '8px 16px', background: 'var(--bg-card-light)', borderRadius: '20px', fontSize: '14px' }}>
                                    Week {currentWeek} of 12 • {phase.reps}
                                </div>
                            </div>

                            const dayExercises = exercises[day.id];

                                            width: '50px', height: '50px', borderRadius: '12px',
                                            background: `linear-gradient(135deg, ${phase.color}33 0%, ${phase.color}11 100%)`,

                                            fontSize: '20px', color: phase.color,

                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontWeight: '600', marginBottom: '4px' }}>Day {day.id}: {day.name}</div>

                                        </div>
                                        <ProgressRing progress={progress} size={44} strokeWidth={4} color={completed === total ? 'var(--success)' : phase.color} />
                                    </div>
                                </Card>
                            );

                    </div>
                </div>
            );

        // ============ STRAVA CONFIG ============
        const STRAVA_CLIENT_ID = '195581';
        const STRAVA_CLIENT_SECRET = '01ad2bae61ce7562fdea62cfa1c640fc0943da40';
        const STRAVA_REFRESH_TOKEN = '78537251e4430520f37f5fa6b89783d288e33d55';

        // ============ RUNNING TAB ============
        const RunningTab = ({ runningData, setRunningData, stravaToken, setStravaToken }) => {
            const [showAddRun, setShowAddRun] = useState(false);
            const [newRun, setNewRun] = useState({ date: new Date().toISOString().split('T')[0], distance: '', elevation: '', duration: '', type: 'easy', notes: '' });
            const [isLoading, setIsLoading] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');
            const [isConnected, setIsConnected] = useState(true); // Pre-connected with your tokens

            // Refresh access token using refresh token
            const refreshAccessToken = async () => {
                try {
                    const response = await fetch('https://www.strava.com/oauth/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            client_id: STRAVA_CLIENT_ID,
                            client_secret: STRAVA_CLIENT_SECRET,
                            refresh_token: STRAVA_REFRESH_TOKEN,
                            grant_type: 'refresh_token'
                        })
                    });
                    
                    if (!response.ok) throw new Error('Token refresh failed');
                    
                    const data = await response.json();
                    setStravaToken(data.access_token);
                    saveData('stravaToken', data.access_token);
                    saveData('stravaTokenExpiry', data.expires_at);
                    return data.access_token;
                } catch (error) {
                    console.error('Token refresh error:', error);
                    setSyncStatus('Error refreshing token');
                    return null;
                }
            };

            // Get valid access token (refresh if needed)
            const getValidToken = async () => {
                const expiry = loadData('stravaTokenExpiry', 0);
                const now = Math.floor(Date.now() / 1000);
                
                // If token is expired or will expire in next 5 minutes, refresh it
                if (!stravaToken || expiry < now + 300) {
                    return await refreshAccessToken();
                }
                return stravaToken;
            };

            const fetchStravaActivities = async () => {
                setIsLoading(true);
                setSyncStatus('Refreshing token...');
                
                try {
                    const token = await getValidToken();
                    if (!token) {
                        setSyncStatus('Could not get valid token');
                        setIsLoading(false);
                        return;
                    }

                    setSyncStatus('Fetching activities...');
                    
                    // Get activities from last 90 days
                    const after = Math.floor((Date.now() - 90 * 24 * 60 * 60 * 1000) / 1000);
                    const response = await fetch(
                        `https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100`,
                        { headers: { 'Authorization': `Bearer ${token}` } }
                    );
                    
                    if (!response.ok) {
                        if (response.status === 401) {
                            // Try refreshing token once more
                            const newToken = await refreshAccessToken();
                            if (newToken) {
                                // Retry with new token
                                const retryResponse = await fetch(
                                    `https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100`,
                                    { headers: { 'Authorization': `Bearer ${newToken}` } }
                                );
                                if (!retryResponse.ok) throw new Error('Failed after retry');
                                const activities = await retryResponse.json();
                                processActivities(activities);
                                return;
                            }
                            setSyncStatus('Authentication failed. Token may need renewal.');
                            return;
                        }
                        throw new Error('Failed to fetch');
                    }

                    const activities = await response.json();
                    processActivities(activities);
                    
                } catch (error) {
                    console.error('Strava fetch error:', error);
                    setSyncStatus('Error fetching activities');
                } finally {
                    setIsLoading(false);
                }
            };

            const processActivities = (activities) => {
                // Filter for runs and convert to our format
                const runs = activities
                    .filter(a => a.type === 'Run' || a.type === 'TrailRun' || a.type === 'VirtualRun')
                    .map(a => ({
                        id: `strava_${a.id}`,
                        date: a.start_date_local.split('T')[0],
                        distance: parseFloat((a.distance / 1000).toFixed(2)),
                        elevation: Math.round(a.total_elevation_gain),
                        duration: formatDuration(a.moving_time),
                        type: a.type === 'TrailRun' ? 'trail' : 'easy',
                        notes: a.name,
                        source: 'strava',
                        stravaId: a.id,
                        avgPace: formatPace(a.moving_time, a.distance),
                        avgHr: a.average_heartrate || null,
                    }));

                // Merge with existing data (avoid duplicates)
                const existingIds = new Set(runningData.map(r => r.id));
                const newRuns = runs.filter(r => !existingIds.has(r.id));
                
                if (newRuns.length > 0) {
                    const merged = [...newRuns, ...runningData].sort((a, b) => new Date(b.date) - new Date(a.date));
                    setRunningData(merged);
                    saveData('runningData', merged);
                    setSyncStatus(`✓ Synced ${newRuns.length} new activities!`);
                } else {
                    setSyncStatus('✓ All activities already synced');
                }
            };

            const formatDuration = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const formatPace = (seconds, meters) => {
                if (!meters || meters === 0) return '--:--';
                const paceSecondsPerKm = seconds / (meters / 1000);
                const paceMin = Math.floor(paceSecondsPerKm / 60);
                const paceSec = Math.floor(paceSecondsPerKm % 60);
                return `${paceMin}:${paceSec.toString().padStart(2, '0')}/km`;
            };

            const handleAddRun = () => {
                if (!newRun.distance) return;
                const run = {
                    ...newRun,
                    id: Date.now(),
                    distance: parseFloat(newRun.distance),
                    elevation: parseFloat(newRun.elevation) || 0,
                    duration: newRun.duration,
                };
                const newData = [run, ...runningData].slice(0, 200);
                setRunningData(newData);
                saveData('runningData', newData);
                setShowAddRun(false);
                setNewRun({ date: new Date().toISOString().split('T')[0], distance: '', elevation: '', duration: '', type: 'easy', notes: '' });
            };

            const getWeeklyStats = () => {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                const weekRuns = runningData.filter(r => new Date(r.date) > weekAgo);
                return {
                    runs: weekRuns.length,
                    distance: weekRuns.reduce((a, b) => a + b.distance, 0).toFixed(1),
                    elevation: weekRuns.reduce((a, b) => a + b.elevation, 0),
                };
            };

            const getMonthlyStats = () => {
                const monthAgo = new Date();
                monthAgo.setDate(monthAgo.getDate() - 30);
                const monthRuns = runningData.filter(r => new Date(r.date) > monthAgo);
                return {
                    runs: monthRuns.length,
                    distance: monthRuns.reduce((a, b) => a + b.distance, 0).toFixed(1),
                    elevation: monthRuns.reduce((a, b) => a + b.elevation, 0),
                };
            };

            const weekStats = getWeeklyStats();
            const monthStats = getMonthlyStats();

            const runTypes = [
                { id: 'easy', name: 'Easy', color: '#4cc9f0' },
                { id: 'tempo', name: 'Tempo', color: '#ffd60a' },
                { id: 'interval', name: 'Interval', color: '#f72585' },
                { id: 'long', name: 'Long Run', color: '#4361ee' },
                { id: 'trail', name: 'Trail', color: '#7209b7' },
                { id: 'race', name: 'Race', color: '#ff6b6b' },
            ];

            if (showAddRun) {
                return (
                    <div className="slide-in">
                        <Header title="Add Run" onBack={() => setShowAddRun(false)} />
                        <div style={{ padding: '16px', paddingBottom: '100px' }}>
                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Date</label>
                                <input type="date" value={newRun.date} onChange={(e) => setNewRun({...newRun, date: e.target.value})}
                                    style={{ width: '100%', padding: '12px', border: '1px solid var(--border)', borderRadius: '8px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '16px' }} />
                            </Card>

                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Run Type</label>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px' }}>
                                    {runTypes.map(type => (
                                        <button key={type.id} onClick={() => setNewRun({...newRun, type: type.id})} className="haptic"
                                            style={{
                                                padding: '10px', border: 'none', borderRadius: '8px',
                                                background: newRun.type === type.id ? type.color : 'var(--bg-card-light)',
                                                color: newRun.type === type.id ? 'white' : 'var(--text-primary)',
                                                fontWeight: '500', fontSize: '13px', cursor: 'pointer',
                                            }}>{type.name}</button>
                                    ))}
                                </div>
                            </Card>

                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Distance (km)</label>
                                <input type="number" inputMode="decimal" value={newRun.distance} onChange={(e) => setNewRun({...newRun, distance: e.target.value})}
                                    placeholder="e.g. 10.5"
                                    style={{ width: '100%', padding: '14px', border: '1px solid var(--border)', borderRadius: '8px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '20px', textAlign: 'center' }} />
                            </Card>

                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Elevation Gain (m)</label>
                                <input type="number" inputMode="numeric" value={newRun.elevation} onChange={(e) => setNewRun({...newRun, elevation: e.target.value})}
                                    placeholder="e.g. 500"
                                    style={{ width: '100%', padding: '14px', border: '1px solid var(--border)', borderRadius: '8px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '20px', textAlign: 'center' }} />
                            </Card>

                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Duration (hh:mm:ss)</label>
                                <input type="text" value={newRun.duration} onChange={(e) => setNewRun({...newRun, duration: e.target.value})}
                                    placeholder="e.g. 1:30:00"
                                    style={{ width: '100%', padding: '14px', border: '1px solid var(--border)', borderRadius: '8px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '20px', textAlign: 'center' }} />
                            </Card>

                            <Card>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600' }}>Notes</label>
                                <textarea value={newRun.notes} onChange={(e) => setNewRun({...newRun, notes: e.target.value})}
                                    placeholder="How did it feel?"
                                    style={{ width: '100%', padding: '12px', border: '1px solid var(--border)', borderRadius: '8px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', fontSize: '14px', minHeight: '80px', resize: 'vertical' }} />
                            </Card>

                            <button onClick={handleAddRun} className="haptic"
                                style={{
                                    width: '100%', padding: '16px',
                                    background: 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)',
                                    color: 'white', border: 'none', borderRadius: '12px',
                                    fontSize: '16px', fontWeight: '600', cursor: 'pointer', opacity: newRun.distance ? 1 : 0.5,
                                }}>
                                <i className="fa-solid fa-plus"></i> Add Run
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <Header title="Running" subtitle="Track your trail runs" />
                    <div style={{ padding: '16px', paddingBottom: '100px' }}>
                        <button onClick={() => setShowAddRun(true)} className="haptic"
                            style={{
                                width: '100%', padding: '16px', marginBottom: '12px',
                                background: 'var(--bg-card-light)',
                                color: 'var(--text-primary)', border: '1px solid var(--border)', borderRadius: '12px',
                                fontSize: '16px', fontWeight: '600', cursor: 'pointer',

                            }}>
                            <i className="fa-solid fa-plus"></i> Add Run Manually
                        </button>

                        <Card style={{ background: 'linear-gradient(135deg, var(--strava)22 0%, var(--bg-card) 100%)', borderColor: 'var(--strava)' }}>

                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: '600' }}>Strava Connected ✓</div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                                        Syncs your runs from AlbonApp via Strava
                                    </div>
                                </div>
                            </div>
                            
                            <button onClick={fetchStravaActivities} className="haptic" disabled={isLoading}
                                style={{
                                    width: '100%', padding: '14px',
                                    background: 'var(--strava)', color: 'white',
                                    border: 'none', borderRadius: '10px',
                                    fontSize: '15px', fontWeight: '600', cursor: 'pointer',
                                    opacity: isLoading ? 0.7 : 1,
                                    display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
                                }}>
                                <i className={`fa-solid ${isLoading ? 'fa-spinner fa-spin' : 'fa-rotate'}`}></i> 
                                {isLoading ? 'Syncing...' : 'Sync Strava Activities'}
                            </button>
                            
                            {syncStatus && (
                                <div style={{ fontSize: '13px', color: syncStatus.includes('✓') ? 'var(--success)' : 'var(--text-secondary)', textAlign: 'center', marginTop: '10px' }}>
                                    {syncStatus}
                                </div>
                            )}
                        </Card>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '16px' }}>
                            <Card style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '4px' }}>This Week</div>
                                <div style={{ fontSize: '28px', fontWeight: '700', color: 'var(--primary)' }}>{weekStats.distance}<span style={{ fontSize: '14px' }}> km</span></div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>{weekStats.elevation}m ↑ • {weekStats.runs} runs</div>
                            </Card>
                            <Card style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '4px' }}>This Month</div>
                                <div style={{ fontSize: '28px', fontWeight: '700', color: 'var(--secondary)' }}>{monthStats.distance}<span style={{ fontSize: '14px' }}> km</span></div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>{monthStats.elevation}m ↑ • {monthStats.runs} runs</div>
                            </Card>
                        </div>

                        <h3 style={{ margin: '20px 0 12px', fontSize: '14px', textTransform: 'uppercase', letterSpacing: '1px', color: 'var(--text-secondary)' }}>Recent Runs</h3>
                        
                        {runningData.length === 0 ? (
                            <Card style={{ textAlign: 'center', padding: '40px 20px' }}>
                                <i className="fa-solid fa-person-running" style={{ fontSize: '48px', color: 'var(--text-secondary)', marginBottom: '16px' }}></i>
                                <div style={{ color: 'var(--text-secondary)' }}>No runs logged yet. Add your first run!</div>
                            </Card>
                        ) : (
                            runningData.slice(0, 10).map((run, idx) => {
                                const typeInfo = runTypes.find(t => t.id === run.type) || runTypes[0];
                                return (
                                    <Card key={run.id || idx}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                            <div style={{
                                                width: '44px', height: '44px', borderRadius: '10px',
                                                background: `${typeInfo.color}33`, display: 'flex',
                                                alignItems: 'center', justifyContent: 'center', color: typeInfo.color,
                                            }}><i className="fa-solid fa-person-running"></i></div>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ fontWeight: '600', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                    {run.distance} km
                                                    {run.source === 'strava' && <i className="fa-brands fa-strava" style={{ fontSize: '12px', color: 'var(--strava)' }}></i>}
                                                </div>
                                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                                                    {run.elevation}m ↑ • {run.duration || '—'} • {typeInfo.name}
                                                </div>
                                                {run.notes && <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '2px', fontStyle: 'italic' }}>{run.notes.substring(0, 40)}{run.notes.length > 40 ? '...' : ''}</div>}
                                            </div>
                                            <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                                                {new Date(run.date).toLocaleDateString()}
                                            </div>
                                        </div>
                                    </Card>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        // ============ PROGRESS TAB ============
        const ProgressTab = ({ workoutData, workoutHistory, runningData }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');

                    // Get average weights per phase/month
                    const getPhaseAverages = (exerciseKeyword) => {
                        return [1, 2, 3, 4].map(phase => {
                            const phaseData = Object.keys(workoutData)
                                .filter(k => k.startsWith(`p${phase}_`) && k.includes(exerciseKeyword))
                                .map(k => workoutData[k]?.average || 0)
                                .filter(v => v > 0);
                            return phaseData.length > 0 ? (phaseData.reduce((a, b) => a + b, 0) / phaseData.length).toFixed(1) : null;
                        });
                    };

                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Phase 1', 'Phase 2', 'Phase 3', 'Phase 4'],
                            datasets: [
                                { label: 'Split Squat', data: getPhaseAverages('Split'), backgroundColor: '#4361ee' },
                                { label: 'Hip Thrust', data: getPhaseAverages('Hip'), backgroundColor: '#f72585' },
                                { label: 'Rows', data: getPhaseAverages('Row'), backgroundColor: '#4cc9f0' },
                            ],
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15, color: 'var(--text-primary)' } } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'var(--border)' }, ticks: { color: 'var(--text-secondary)' } },
                                x: { grid: { display: false }, ticks: { color: 'var(--text-secondary)' } }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [workoutData]);

            const getPR = (exerciseKeyword) => {
                let best = 0;
                Object.keys(workoutData).forEach(key => {
                    if (key.toLowerCase().includes(exerciseKeyword.toLowerCase())) {
                        const val = workoutData[key]?.max || 0;
                        if (val > best) best = val;
                    }
                });
                return best;
            };

            const totalWorkouts = workoutHistory.length;
            const totalRuns = runningData.length;
            const totalDistance = runningData.reduce((a, b) => a + b.distance, 0).toFixed(1);
            const totalElevation = runningData.reduce((a, b) => a + b.elevation, 0);

            return (
                <div>
                    <Header title="Progress" subtitle="Strength & Running combined" />
                    <div style={{ padding: '16px', paddingBottom: '100px' }}>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px', marginBottom: '16px' }}>
                            <Card style={{ textAlign: 'center', background: 'linear-gradient(135deg, var(--primary)22 0%, var(--bg-card) 100%)' }}>
                                <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--primary)' }}>{totalWorkouts}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Strength Sessions</div>
                            </Card>
                            <Card style={{ textAlign: 'center', background: 'linear-gradient(135deg, var(--strava)22 0%, var(--bg-card) 100%)' }}>
                                <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--strava)' }}>{totalRuns}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Runs Logged</div>
                            </Card>
                            <Card style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--success)' }}>{totalDistance}<span style={{ fontSize: '12px' }}> km</span></div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Total Distance</div>
                            </Card>
                            <Card style={{ textAlign: 'center' }}>
                                <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--secondary)' }}>{totalElevation}<span style={{ fontSize: '12px' }}> m</span></div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Total Elevation</div>
                            </Card>
                        </div>

                        <Card>
                            <h3 style={{ margin: '0 0 16px', fontSize: '16px' }}>
                                <i className="fa-solid fa-chart-column" style={{ marginRight: '8px', color: 'var(--primary)' }}></i>
                                Average Weight by Phase
                            </h3>
                            <div style={{ height: '220px' }}><canvas ref={chartRef}></canvas></div>
                        </Card>

                        <h3 style={{ margin: '20px 0 12px', fontSize: '14px', textTransform: 'uppercase', letterSpacing: '1px', color: 'var(--text-secondary)' }}>
                            <i className="fa-solid fa-trophy" style={{ marginRight: '8px' }}></i>Personal Records (Max Weight)
                        </h3>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                            {keyExercises.map((exercise, idx) => {
                                const pr = getPR(exercise.name.split('/')[0]);
                                return (
                                    <Card key={idx} style={{ textAlign: 'center', padding: '14px' }}>
                                        <div style={{ fontSize: '20px', marginBottom: '4px' }}>{exercise.icon}</div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginBottom: '4px' }}>{exercise.name}</div>
                                        <div style={{ fontSize: '20px', fontWeight: '700', color: pr ? 'var(--warning)' : 'var(--text-secondary)' }}>
                                            {pr || '—'}<span style={{ fontSize: '12px', fontWeight: '400' }}> kg</span>
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // ============ SETTINGS TAB ============
        const SettingsTab = ({ currentPhase, setCurrentPhase, currentWeek, setCurrentWeek, darkMode, setDarkMode }) => {
            const handleExport = () => {
                const data = {
                    workoutData: loadData('workoutData', {}),
                    workoutHistory: loadData('workoutHistory', []),
                    runningData: loadData('runningData', []),
                    currentPhase, currentWeek,
                    exportDate: new Date().toISOString(),
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `strength-tracker-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.workoutData) saveData('workoutData', data.workoutData);
                            if (data.workoutHistory) saveData('workoutHistory', data.workoutHistory);
                            if (data.runningData) saveData('runningData', data.runningData);
                            if (data.currentPhase) saveData('currentPhase', data.currentPhase);
                            if (data.currentWeek) saveData('currentWeek', data.currentWeek);
                            alert('Data imported! Refreshing...');
                            window.location.reload();
                        } catch { alert('Error importing data.'); }
                    };
                    reader.readAsText(file);
                }
            };

            return (
                <div>
                    <Header title="Settings" />
                    <div style={{ padding: '16px', paddingBottom: '100px' }}>
                        <Card>
                            <h3 style={{ margin: '0 0 16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <i className="fa-solid fa-calendar" style={{ color: 'var(--primary)' }}></i>Current Program
                            </h3>
                            <div style={{ marginBottom: '16px' }}>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '500', fontSize: '14px' }}>Phase</label>
                                <select value={currentPhase} onChange={(e) => { const val = parseInt(e.target.value); setCurrentPhase(val); saveData('currentPhase', val); }}
                                    style={{ width: '100%', padding: '12px', fontSize: '16px', borderRadius: '10px', border: '1px solid var(--border)', background: 'var(--bg-card-light)', color: 'var(--text-primary)' }}>
                                    {phases.map(p => <option key={p.id} value={p.id}>Phase {p.id}: {p.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '500', fontSize: '14px' }}>Week (1-12)</label>
                                <input type="number" min="1" max="12" value={currentWeek}
                                    onChange={(e) => { const val = Math.min(12, Math.max(1, parseInt(e.target.value) || 1)); setCurrentWeek(val); saveData('currentWeek', val); }}
                                    style={{ width: '100%', padding: '12px', fontSize: '16px', borderRadius: '10px', border: '1px solid var(--border)', background: 'var(--bg-card-light)', color: 'var(--text-primary)' }} />
                            </div>
                        </Card>

                        <Card>
                            <div onClick={() => { const newMode = !darkMode; setDarkMode(newMode); saveData('darkMode', newMode); document.body.classList.toggle('light-mode', !newMode); }} className="haptic"
                                style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}>
                                <span><i className="fa-solid fa-moon" style={{ marginRight: '8px' }}></i>Dark Mode</span>
                                <div style={{ width: '50px', height: '28px', background: darkMode ? 'var(--primary)' : 'var(--border)', borderRadius: '14px', position: 'relative', transition: 'background 0.3s' }}>
                                    <div style={{ width: '24px', height: '24px', background: 'white', borderRadius: '50%', position: 'absolute', top: '2px', left: darkMode ? '24px' : '2px', transition: 'left 0.3s' }} />
                                </div>
                            </div>
                        </Card>

                        <Card>
                            <h3 style={{ margin: '0 0 16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <i className="fa-solid fa-database" style={{ color: 'var(--success)' }}></i>Data
                            </h3>
                            <button onClick={handleExport} className="haptic"
                                style={{ width: '100%', padding: '14px', background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', marginBottom: '10px', cursor: 'pointer' }}>
                                <i className="fa-solid fa-download"></i> Export Backup
                            </button>
                            <label className="haptic"
                                style={{ display: 'flex', width: '100%', padding: '14px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', marginBottom: '10px', cursor: 'pointer', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                                <i className="fa-solid fa-upload"></i> Import Backup
                                <input type="file" accept=".json" onChange={handleImport} style={{ display: 'none' }} />
                            </label>
                            <button onClick={() => { if (confirm('Delete ALL data?')) { localStorage.clear(); window.location.reload(); }}} className="haptic"
                                style={{ width: '100%', padding: '14px', background: 'var(--accent)', color: 'white', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', cursor: 'pointer' }}>
                                <i className="fa-solid fa-trash"></i> Clear All Data
                            </button>
                        </Card>

                        <Card>
                            <h3 style={{ margin: '0 0 12px' }}><i className="fa-solid fa-mobile-screen" style={{ marginRight: '8px', color: 'var(--warning)' }}></i>Install App</h3>
                            <p style={{ margin: 0, color: 'var(--text-secondary)', fontSize: '14px', lineHeight: '1.6' }}>
                                <strong>iPhone:</strong> Tap Share (□↑) → "Add to Home Screen" → "Add"
                            </p>
                        </Card>

                        <div style={{ textAlign: 'center', marginTop: '20px', color: 'var(--text-secondary)', fontSize: '12px' }}>
                            Strength Tracker v3.0 • Per-Set Tracking Edition 🏔️
                        </div>
                    </div>
                </div>
            );
        };

        // ============ MAIN APP ============
        const App = () => {
            const [activeTab, setActiveTab] = useState('workout');
            const [currentPhase, setCurrentPhase] = useState(() => loadData('currentPhase', 1));
            const [currentWeek, setCurrentWeek] = useState(() => loadData('currentWeek', 1));
            const [workoutData, setWorkoutData] = useState(() => loadData('workoutData', {}));
            const [workoutHistory, setWorkoutHistory] = useState(() => loadData('workoutHistory', []));
            const [runningData, setRunningData] = useState(() => loadData('runningData', []));
            const [stravaToken, setStravaToken] = useState(() => loadData('stravaToken', null));
            const [darkMode, setDarkMode] = useState(() => loadData('darkMode', true));

            useEffect(() => { document.body.classList.toggle('light-mode', !darkMode); }, []);

            return (
                <div style={{ paddingBottom: '80px' }}>
                    {activeTab === 'workout' && <WorkoutTab currentPhase={currentPhase} currentWeek={currentWeek} workoutData={workoutData} setWorkoutData={setWorkoutData} workoutHistory={workoutHistory} setWorkoutHistory={setWorkoutHistory} />}
                    {activeTab === 'running' && <RunningTab runningData={runningData} setRunningData={setRunningData} stravaToken={stravaToken} setStravaToken={setStravaToken} />}
                    {activeTab === 'progress' && <ProgressTab workoutData={workoutData} workoutHistory={workoutHistory} runningData={runningData} />}
                    {activeTab === 'settings' && <SettingsTab currentPhase={currentPhase} setCurrentPhase={setCurrentPhase} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} darkMode={darkMode} setDarkMode={setDarkMode} />}
                    <TabBar activeTab={activeTab} setActiveTab={setActiveTab} />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
