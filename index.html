.tab.on{color:var(--grn)}

.tab-bdg{position:absolute;top:0;right:16px;width:8px;height:8px;background:var(--org);border-radius:50%}
.sec{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.5px;padding:20px 16px 8px}
.crd{background:var(--c1);border-radius:12px;margin:0 16px 10px;overflow:hidden}

.crd-r:last-child{border-bottom:none}
.crd-r:active{background:var(--c2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
.chip.g{background:var(--grn-d);color:var(--grn)}
.chip.o{background:var(--org-d);color:var(--org)}
.chip.b{background:var(--c2);color:var(--t2)}

.btn-p{background:var(--grn);color:#000}
.btn-s{background:var(--c2);color:var(--t1)}
.btn-d{background:rgba(255,69,58,0.15);color:var(--red)}

const Toast=({msg,onClose})=>{
  useEffect(()=>{const t=setTimeout(onClose,2500);return()=>clearTimeout(t)},[onClose]);
  return <div className="toast"><span style={{fontSize:20}}>🎉</span><span style={{fontWeight:600}}>{msg}</span></div>;
};

const Confetti=({show})=>{
  const canvasRef=useRef(null);
  useEffect(()=>{
    if(!show)return;
    const canvas=canvasRef.current;const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    const colors=['#30d158','#ff9f0a','#0a84ff','#ff453a','#bf5af2','#64d2ff'];
    const particles=Array.from({length:100},()=>({
      x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,
      vx:(Math.random()-0.5)*8,vy:Math.random()*4+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:Math.random()*8+4,rotation:Math.random()*360,rotationSpeed:(Math.random()-0.5)*10
    }));
    let frame;const animate=()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;p.rotation+=p.rotationSpeed;p.vy+=0.1;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);
        ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        ctx.restore();
      });
      if(particles.some(p=>p.y<canvas.height+50))frame=requestAnimationFrame(animate);
    };
    animate();return()=>cancelAnimationFrame(frame);
  },[show]);
  return show?<canvas ref={canvasRef} className="confetti"/>:null;
};

// === REST TIMER SHEET ===
const RestTimer=({onClose})=>{
  const[time,setTime]=useState(90);
  const[running,setRunning]=useState(false);
  const[left,setLeft]=useState(90);
  const presets=[60,90,120,180];
  
  useEffect(()=>{
    if(!running)return;
    const i=setInterval(()=>{
      setLeft(l=>{if(l<=1){setRunning(false);vb();return time}return l-1});
    },1000);
    return()=>clearInterval(i);
  },[running,time]);
  
  const fmt=s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  
  return <div className="sht">
    <div className="sht-bg" onClick={onClose}/>
    <div className="sht-c" style={{padding:'0 0 20px'}}>
      <div className="sht-bar"/>
      <div style={{padding:'20px',textAlign:'center'}}>
        <div style={{fontSize:64,fontWeight:700,fontVariantNumeric:'tabular-nums',color:running?'var(--grn)':'var(--t1)'}}>{fmt(left)}</div>
        <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:16}}>
          {presets.map(p=><button key={p} onClick={()=>{setTime(p);setLeft(p);vb()}} className="chip" style={{background:time===p?'var(--grn)':'var(--c2)',color:time===p?'#000':'var(--t1)',border:'none',cursor:'pointer'}}>{p}s</button>)}
        </div>
        <div style={{display:'flex',gap:12,marginTop:24,justifyContent:'center'}}>
          <button className="btn btn-s" style={{width:'auto',padding:'12px 32px'}} onClick={()=>{setRunning(!running);vb()}}>{running?'⏸ Pause':'▶ Start'}</button>
          <button className="btn btn-s" style={{width:'auto',padding:'12px 32px'}} onClick={()=>{setLeft(time);setRunning(false);vb()}}>↺ Reset</button>
        </div>
      </div>
    </div>
  </div>;
};

        </div>

          <div style={{flex:1}}>
            <div style={{fontWeight:500}}>{e.k&&<span style={{color:'var(--grn)'}}>⭐ </span>}{e.n}</div>

// === EXERCISE LOGGER ===
const ExLogger=({day,exIdx,dayEx,onSave,onBack,draft,setDraft})=>{
  const exDef=dayEx[exIdx];
  const ex=getEx(exDef.eid);
  const key=`${day.id}-${exIdx}`;
  const[sets,setSets]=useState(()=>draft[key]||Array.from({length:exDef.s},()=>({w:'',r:'',rpe:'',tag:''})));
  const[notes,setNotes]=useState(draft[key+'_notes']||'');
  const[showTimer,setShowTimer]=useState(false);
  const[showSwap,setShowSwap]=useState(false);
  const[toast,setToast]=useState(null);
  const[confetti,setConfetti]=useState(false);
  
  // Auto-save draft
  useEffect(()=>{
    setDraft(d=>({...d,[key]:sets,[key+'_notes']:notes}));
  },[sets,notes,key,setDraft]);
  
  const updateSet=(i,field,val)=>{
    const newSets=[...sets];
    newSets[i]={...newSets[i],[field]:val};
    setSets(newSets);
    vb();
  };
  
  const addSet=()=>{setSets([...sets,{w:'',r:'',rpe:'',tag:''}]);vb()};
  const removeSet=()=>{if(sets.length>1)setSets(sets.slice(0,-1));vb()};
  
  const handleSwap=(newEid)=>{
    // This would update the day exercises - passed up to parent
    onSave({...exDef,eid:newEid,swapped:true},sets,notes,true);
  };
  
  const handleSave=()=>{
    // Check for PR
    const maxW=Math.max(...sets.filter(s=>s.w).map(s=>parseFloat(s.w)||0));
    const prevMax=ld(`pr_${exDef.eid}`,0);
    if(maxW>prevMax&&maxW>0){
      sv(`pr_${exDef.eid}`,maxW);
      setToast(`New PR: ${maxW}kg on ${ex.n}!`);
      setConfetti(true);
      setTimeout(()=>setConfetti(false),3000);
    }
    onSave(exDef,sets,notes,false);
    vb();
  };
  
  // Calculate stats
  const filledSets=sets.filter(s=>(s.w||ex.t!=='w')&&s.r);
  const avgW=filledSets.length?Math.round(filledSets.reduce((a,s)=>a+(parseFloat(s.w)||0),0)/filledSets.length*10)/10:0;
  const maxW=Math.max(...sets.map(s=>parseFloat(s.w)||0));
  const totalR=sets.reduce((a,s)=>a+(parseInt(s.r)||0),0);
  const vol=sets.reduce((a,s)=>a+(parseFloat(s.w)||0)*(parseInt(s.r)||0),0);
  
  // Estimated 1RM (Brzycki formula)
  const est1RM=maxW&&totalR?Math.round(maxW*(36/(37-Math.min(totalR/sets.length,36)))):0;
  const prevPR=ld(`pr_${exDef.eid}`,0);
  
  // Previous session hint
  const prevData=ld('workoutData',{});
  const prevKey=Object.keys(prevData).find(k=>k.includes(`-${exDef.eid}`));
  const prevSets=prevKey?prevData[prevKey]?.sets:null;
  
  const typeLabel={w:'Weight (kg)',r:'Reps',d:'Duration',c:'Time'}[ex.t];
  
  return <div className="pg">
    <div className="nav" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button onClick={onBack} style={{background:'none',border:'none',color:'var(--blu)',fontSize:15,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
        <span style={{fontSize:20}}>‹</span> Back
      </button>
      <button onClick={()=>setShowTimer(true)} style={{background:'var(--c2)',border:'none',borderRadius:8,padding:'8px 12px',color:'var(--t1)',fontSize:14,cursor:'pointer'}}>⏱ Rest</button>
    </div>
    
    <div className="sc" style={{padding:16}}>
      <div style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:28}}>{day.icon}</div>
        <div style={{fontSize:20,fontWeight:700,marginTop:8}} onClick={()=>setShowSwap(true)} style={{cursor:'pointer'}}>
          {ex.k&&<span style={{color:'var(--grn)'}}>⭐ </span>}{ex.n}
          <span style={{fontSize:14,color:'var(--blu)',marginLeft:8}}>↻</span>
        </div>
        <div style={{color:'var(--t2)',fontSize:14,marginTop:4}}>{ex.m} · {exDef.s}×{exDef.r}</div>
        {exDef.star&&<span className="chip g" style={{marginTop:8}}>Knee Rehab Priority</span>}
      </div>
      
      {prevSets&&<div style={{background:'var(--c2)',borderRadius:10,padding:12,marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--t2)',marginBottom:6}}>💡 Previous Session</div>
        <div style={{fontSize:13,color:'var(--t1)'}}>{prevSets.filter(s=>s.w||s.r).map((s,i)=>`${s.w||'-'}kg × ${s.r||'-'}`).join(' | ')}</div>
      </div>}
      
      {/* Set Headers */}
      <div style={{display:'grid',gridTemplateColumns:'40px 1fr 80px 60px 60px',gap:8,marginBottom:8,padding:'0 4px'}}>
        <div style={{fontSize:11,color:'var(--t3)',textAlign:'center'}}>SET</div>
        <div style={{fontSize:11,color:'var(--t3)'}}>TAG</div>
        <div style={{fontSize:11,color:'var(--t3)',textAlign:'center'}}>{ex.t==='w'?'KG':ex.t==='d'?'SEC':'—'}</div>
        <div style={{fontSize:11,color:'var(--t3)',textAlign:'center'}}>REPS</div>
        <div style={{fontSize:11,color:'var(--t3)',textAlign:'center'}}>RPE</div>
      </div>
      
      {/* Sets */}
      {sets.map((s,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'40px 1fr 80px 60px 60px',gap:8,marginBottom:10,alignItems:'center'}}>
        <div style={{width:32,height:32,borderRadius:8,background:s.w||s.r?'var(--grn)':'var(--c2)',color:s.w||s.r?'#000':'var(--t2)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:600,fontSize:14}}>{i+1}</div>
        <select value={s.tag} onChange={e=>updateSet(i,'tag',e.target.value)} style={{padding:'10px 8px',background:'var(--c2)',border:'none',borderRadius:8,color:'var(--t1)',fontSize:13}}>
          <option value="">—</option>
          <option value="W">🟠 Warm</option>
          <option value="F">🔴 Fail</option>
          <option value="D">🟣 Drop</option>
        </select>
        {ex.t==='w'?<input type="number" className={`inp ${s.w?'has':''}`} placeholder="0" value={s.w} onChange={e=>updateSet(i,'w',e.target.value)} style={{textAlign:'center',padding:'10px 8px'}}/>:
         ex.t==='d'?<input type="number" className={`inp ${s.w?'has':''}`} placeholder="sec" value={s.w} onChange={e=>updateSet(i,'w',e.target.value)} style={{textAlign:'center',padding:'10px 8px'}}/>:
         <div style={{textAlign:'center',color:'var(--t3)'}}>—</div>}
        <input type="number" className={`inp ${s.r?'has':''}`} placeholder="0" value={s.r} onChange={e=>updateSet(i,'r',e.target.value)} style={{textAlign:'center',padding:'10px 8px'}}/>
        <select value={s.rpe} onChange={e=>updateSet(i,'rpe',e.target.value)} style={{padding:'10px 4px',background:'var(--c2)',border:'none',borderRadius:8,color:'var(--t1)',fontSize:13,textAlign:'center'}}>
          <option value="">—</option>
          {[6,6.5,7,7.5,8,8.5,9,9.5,10].map(r=><option key={r} value={r}>{r}</option>)}
        </select>
      </div>)}
      
      {/* Add/Remove Set */}
      <div style={{display:'flex',gap:8,marginTop:8,marginBottom:20}}>
        <button className="btn btn-s" style={{flex:1}} onClick={addSet}>+ Add Set</button>
        <button className="btn btn-s" style={{flex:1}} onClick={removeSet}>− Remove Set</button>
      </div>
      
      {/* Stats Grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:20}}>
        <div style={{background:'var(--c1)',borderRadius:10,padding:12,textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>AVG</div>
          <div style={{fontSize:18,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{avgW}<span style={{fontSize:11,color:'var(--t2)'}}>kg</span></div>
        </div>
        <div style={{background:'var(--c1)',borderRadius:10,padding:12,textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>MAX</div>
          <div style={{fontSize:18,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{maxW}<span style={{fontSize:11,color:'var(--t2)'}}>kg</span></div>
        </div>
        <div style={{background:'var(--c1)',borderRadius:10,padding:12,textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>REPS</div>
          <div style={{fontSize:18,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{totalR}</div>
        </div>
        <div style={{background:'var(--c1)',borderRadius:10,padding:12,textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>VOL</div>
          <div style={{fontSize:18,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{vol>1000?`${(vol/1000).toFixed(1)}k`:vol}</div>
        </div>
      </div>
      
      {/* Estimated 1RM */}
      {ex.t==='w'&&est1RM>0&&<div style={{background:'var(--c1)',borderRadius:10,padding:14,marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:12,color:'var(--t2)'}}>Estimated 1RM</div>
            <div style={{fontSize:24,fontWeight:700}}>{est1RM}<span style={{fontSize:14,color:'var(--t2)'}}>kg</span></div>
          </div>
          {prevPR>0&&<div style={{textAlign:'right'}}>
            <div style={{fontSize:12,color:'var(--t2)'}}>PR</div>
            <div style={{fontSize:18,fontWeight:600,color:maxW>prevPR?'var(--grn)':'var(--t1)'}}>{prevPR}kg {maxW>prevPR&&'🎉'}</div>
          </div>}
        </div>
      </div>}
      
      {/* Notes */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>📝 Notes</div>
        <textarea className="inp" placeholder="How did it feel? Any tweaks?" value={notes} onChange={e=>setNotes(e.target.value)} rows={3} style={{resize:'none'}}/>
      </div>
      
      <button className="btn btn-p" onClick={handleSave}>✓ Save Exercise</button>
    </div>
    
    {showTimer&&<RestTimer onClose={()=>setShowTimer(false)}/>}
    {showSwap&&<SwapSheet ex={ex} muscle={ex.m} onSwap={handleSwap} onClose={()=>setShowSwap(false)}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    <Confetti show={confetti}/>
  </div>;
};

// === DAY WORKOUT VIEW ===
const DayWorkout=({day,ph,dt,sD,draft,setDraft,onBack,hist,sHist,strk,sStrk})=>{
  const[exIdx,setExIdx]=useState(null);
  const[dayEx,setDayEx]=useState(()=>{
    const saved=ld(`dayEx_${ph.id}_${day.id}`,null);
    return saved||[...day.ex];
  });
  const[showAdd,setShowAdd]=useState(false);
  const[toast,setToast]=useState(null);
  const[confetti,setConfetti]=useState(false);
  const[wkTimer,setWkTimer]=useState(0);
  
  // Workout timer
  useEffect(()=>{
    const i=setInterval(()=>setWkTimer(t=>t+1),1000);
    return()=>clearInterval(i);
  },[]);
  
  // Save day exercises when changed
  useEffect(()=>{
    sv(`dayEx_${ph.id}_${day.id}`,dayEx);
  },[dayEx,ph.id,day.id]);
  
  const handleSaveEx=(exDef,sets,notes,isSwap)=>{
    if(isSwap){
      // Update the exercise in dayEx
      const newDayEx=[...dayEx];
      newDayEx[exIdx]={...newDayEx[exIdx],eid:exDef.eid};
      setDayEx(newDayEx);
      setExIdx(null);
      return;
    }
    
    const key=`${ph.id}_${day.id}_${exDef.eid}_${Date.now()}`;
    const newDt={...dt,[key]:{sets,notes,date:new Date().toISOString()}};
    sD(newDt);
    sv('workoutData',newDt);
    
    // Clear draft for this exercise
    const draftKey=`${day.id}-${exIdx}`;
    setDraft(d=>{const n={...d};delete n[draftKey];delete n[draftKey+'_notes'];return n});
    sv('drafts',draft);
    
    setExIdx(null);
  };
  
  const completeWorkout=()=>{
    const today=new Date().toDateString();
    const lastWorkout=ld('lastWorkout','');
    const yesterday=new Date(Date.now()-86400000).toDateString();
    
    // Update streak
    let newStrk=strk;
    if(lastWorkout===yesterday)newStrk=strk+1;
    else if(lastWorkout!==today)newStrk=1;
    sStrk(newStrk);
    sv('streak',newStrk);
    sv('lastWorkout',today);
    
    // Save to history
    const histEntry={date:new Date().toISOString(),day:day.n,phase:ph.n,duration:wkTimer};
    const newHist=[histEntry,...hist].slice(0,50);
    sHist(newHist);
    sv('workoutHistory',newHist);
    
    // Clear all drafts for this day
    const newDraft={};
    Object.keys(draft).forEach(k=>{if(!k.startsWith(`${day.id}-`))newDraft[k]=draft[k]});
    setDraft(newDraft);
    sv('drafts',newDraft);
    
    setToast('Workout Complete!');
    setConfetti(true);
    setTimeout(()=>{setConfetti(false);onBack()},2000);
    vb();
  };
  
  const moveEx=(idx,dir)=>{
    const newEx=[...dayEx];
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=newEx.length)return;
    [newEx[idx],newEx[newIdx]]=[newEx[newIdx],newEx[idx]];
    setDayEx(newEx);
    vb();
  };
  
  const removeEx=(idx)=>{
    if(dayEx.length<=1)return;
    setDayEx(dayEx.filter((_,i)=>i!==idx));
    vb();
  };
  
  const addEx=(eid)=>{
    const ex=getEx(eid);
    setDayEx([...dayEx,{eid,s:3,r:'10-12'}]);
    setShowAdd(false);
    vb();
  };
  
  const completedCount=dayEx.filter((_,i)=>{
    const key=`${day.id}-${i}`;
    return !draft[key]&&Object.keys(dt).some(k=>k.includes(`_${day.id}_`)&&k.includes(dayEx[i].eid));
  }).length;
  
  const fmt=s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  
  if(exIdx!==null){
    return <ExLogger day={day} exIdx={exIdx} dayEx={dayEx} onSave={handleSaveEx} onBack={()=>setExIdx(null)} draft={draft} setDraft={setDraft}/>;
  }
  
  return <div className="pg">
    <div className="nav" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button onClick={onBack} style={{background:'none',border:'none',color:'var(--blu)',fontSize:15,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
        <span style={{fontSize:20}}>‹</span> Back
      </button>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:13,color:'var(--t2)',fontVariantNumeric:'tabular-nums'}}>⏱ {fmt(wkTimer)}</span>
        {strk>0&&<span className="chip o" style={{padding:'4px 8px'}}>🔥 {strk}</span>}
      </div>
    </div>
    
    <div className="sc">
      <div style={{padding:'16px 16px 8px',textAlign:'center'}}>
        <div style={{fontSize:36}}>{day.icon}</div>
        <div style={{fontSize:22,fontWeight:700,marginTop:8}}>Day {day.id}: {day.n}</div>
        <div style={{color:'var(--t2)',marginTop:4}}>{day.m}</div>
      </div>
      
      {/* Progress */}
      <div style={{padding:'0 16px 16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--t2)',marginBottom:6}}>
          <span>Progress</span>
          <span>{completedCount}/{dayEx.length} exercises</span>
        </div>
        <div className="prg"><div className="prg-f" style={{width:`${(completedCount/dayEx.length)*100}%`}}/></div>
      </div>
      
      {/* Exercises */}
      <div className="crd" style={{margin:'0 16px 16px'}}>
        {dayEx.map((exDef,i)=>{
          const ex=getEx(exDef.eid);
          const draftKey=`${day.id}-${i}`;
          const hasDraft=!!draft[draftKey];
          const isComplete=Object.keys(dt).some(k=>k.includes(`_${exDef.eid}`));
          
          return <div key={i} className="crd-r" style={{borderLeft:hasDraft?'3px solid var(--org)':isComplete?'3px solid var(--grn)':'3px solid transparent'}}>
            <div style={{flex:1}} onClick={()=>{setExIdx(i);vb()}}>
              <div style={{fontWeight:500,display:'flex',alignItems:'center',gap:6}}>
                {ex.k&&<span style={{color:'var(--grn)'}}>⭐</span>}
                {ex.n}
                {hasDraft&&<span style={{fontSize:10,color:'var(--org)'}}>●</span>}
                {isComplete&&!hasDraft&&<span style={{fontSize:10,color:'var(--grn)'}}>✓</span>}
              </div>
              <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{ex.m} · {exDef.s}×{exDef.r}</div>
            </div>
            <div style={{display:'flex',gap:4}}>
              <button onClick={(e)=>{e.stopPropagation();moveEx(i,-1)}} style={{width:28,height:28,background:'var(--c2)',border:'none',borderRadius:6,color:'var(--t2)',cursor:'pointer'}}>↑</button>
              <button onClick={(e)=>{e.stopPropagation();moveEx(i,1)}} style={{width:28,height:28,background:'var(--c2)',border:'none',borderRadius:6,color:'var(--t2)',cursor:'pointer'}}>↓</button>
              <button onClick={(e)=>{e.stopPropagation();removeEx(i)}} style={{width:28,height:28,background:'rgba(255,69,58,0.15)',border:'none',borderRadius:6,color:'var(--red)',cursor:'pointer'}}>×</button>
            </div>
          </div>;
        })}
      </div>
      
      <div style={{padding:'0 16px 16px'}}>
        <button className="btn btn-s" onClick={()=>setShowAdd(true)} style={{marginBottom:10}}>+ Add Exercise</button>
        <button className="btn btn-p" onClick={completeWorkout}>✓ Complete Workout</button>
      </div>
    </div>
    
    {showAdd&&<SwapSheet onSwap={addEx} onClose={()=>setShowAdd(false)}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    <Confetti show={confetti}/>
  </div>;
};

  const prs=Object.keys(localStorage).filter(k=>k.startsWith('pr_')).length;

  return <div className="pg">
    <div className="nav-lg">
      <div style={{fontSize:28,fontWeight:700}}>Progress</div>
    </div>
    <div className="sc">
      {/* Stats Grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,padding:'16px'}}>
        <div className="crd" style={{margin:0}}><div className="crd-p" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>WORKOUTS</div>
          <div style={{fontSize:28,fontWeight:700,color:'var(--grn)'}}>{totalWorkouts}</div>
        </div></div>
        <div className="crd" style={{margin:0}}><div className="crd-p" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>TOTAL VOL</div>
          <div style={{fontSize:28,fontWeight:700,color:'var(--blu)'}}>{totalVol>1000?`${(totalVol/1000).toFixed(1)}k`:totalVol}</div>
        </div></div>
        <div className="crd" style={{margin:0}}><div className="crd-p" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>PRs SET</div>
          <div style={{fontSize:28,fontWeight:700,color:'var(--org)'}}>{prs}</div>
        </div></div>
        <div className="crd" style={{margin:0}}><div className="crd-p" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>AVG TIME</div>
          <div style={{fontSize:28,fontWeight:700,color:'var(--pur)'}}>{Math.floor(avgDur/60)}m</div>
        </div></div>
      </div>
      
      {/* Calendar */}
      <div className="sec">This Month</div>
      <div className="crd">
        <div className="crd-p">
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,textAlign:'center'}}>
            {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} style={{fontSize:11,color:'var(--t3)',padding:4}}>{d}</div>)}
            {Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth(),1).getDay()},(_,i)=><div key={`e${i}`}/>)}
            {Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()},(_, i)=>{
              const date=new Date(new Date().getFullYear(),new Date().getMonth(),i+1);
              const hasWorkout=hist.some(h=>new Date(h.date).toDateString()===date.toDateString());
              const isToday=date.toDateString()===new Date().toDateString();
              return <div key={i} style={{padding:6,borderRadius:8,fontSize:13,fontWeight:isToday?700:400,background:hasWorkout?'var(--grn)':isToday?'var(--c2)':'transparent',color:hasWorkout?'#000':isToday?'var(--t1)':'var(--t2)'}}>{i+1}</div>;
            })}
          </div>
        </div>
      </div>
      
      {/* Recent Workouts */}
      <div className="sec">Recent Workouts</div>
      <div className="crd">
        {hist.slice(0,10).map((h,i)=><div key={i} className="crd-r" style={{cursor:'default'}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:500}}>{h.day}</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>
              {new Date(h.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · {h.phase}
            </div>
          </div>
          <span style={{fontSize:13,color:'var(--t2)'}}>⏱ {Math.floor(h.duration/60)}m</span>
        </div>)}
        {hist.length===0&&<div style={{padding:30,textAlign:'center',color:'var(--t3)'}}>No workouts yet</div>}
      </div>
    </div>
  </div>;
};

// === LIBRARY TAB ===
const LibraryTab=()=>{
  const[search,setSearch]=useState('');
  const[filterM,setFilterM]=useState('');
  const[filterEq,setFilterEq]=useState('');
  const[filterK,setFilterK]=useState(false);
  
  const filtered=EXDB.filter(e=>{
    if(search&&!e.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(filterM&&e.m!==filterM)return false;
    if(filterEq&&e.eq!==filterEq)return false;
    if(filterK&&!e.k)return false;
    return true;
  });
  
  const grouped=MUSCLES.reduce((acc,m)=>{
    const exs=filtered.filter(e=>e.m===m);
    if(exs.length)acc[m]=exs;
    return acc;
  },{});
  
  const typeLabel={w:'Weight',r:'Reps Only',d:'Duration',c:'Cardio'};
  
  return <div className="pg">
    <div className="nav-lg">
      <div style={{fontSize:28,fontWeight:700}}>Exercise Library</div>
      <div style={{fontSize:13,color:'var(--t2)}}>{EXDB.length} exercises</div>
    </div>
    <div className="sc">
      <div style={{padding:'12px 16px',position:'sticky',top:0,background:'var(--bg)',zIndex:10}}>
        <input className="inp" placeholder="Search exercises..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          <select value={filterM} onChange={e=>setFilterM(e.target.value)} style={{padding:'8px 12px',background:'var(--c2)',border:'none',borderRadius:8,color:'var(--t1)',fontSize:13}}>
            <option value="">All Muscles</option>
            {MUSCLES.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
          <select value={filterEq} onChange={e=>setFilterEq(e.target.value)} style={{padding:'8px 12px',background:'var(--c2)',border:'none',borderRadius:8,color:'var(--t1)',fontSize:13}}>
            <option value="">All Equipment</option>
            {EQUIP.map(eq=><option key={eq} value={eq}>{eq}</option>)}
          </select>
          <button onClick={()=>setFilterK(!filterK)} className="chip" style={{background:filterK?'var(--grn)':'var(--c2)',color:filterK?'#000':'var(--t1)',border:'none',cursor:'pointer'}}>⭐ Knee-Safe</button>
        </div>
      </div>
      
      {Object.entries(grouped).map(([muscle,exs])=><div key={muscle}>
        <div className="sec">{muscle} ({exs.length})</div>
        <div className="crd">
          {exs.map(e=><div key={e.id} className="crd-r" style={{cursor:'default'}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:500}}>{e.k&&<span style={{color:'var(--grn)'}}>⭐ </span>}{e.n}</div>
              <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{e.eq} · {typeLabel[e.t]}</div>
            </div>
          </div>)}
        </div>
      </div>)}
      
      {Object.keys(grouped).length===0&&<div style={{padding:40,textAlign:'center',color:'var(--t3)'}}>No exercises found</div>}
    </div>
  </div>;
};

// === SETTINGS TAB ===
const SettingsTab=({ph,sPh,wk,sWk,draft,setDraft})=>{
  const[bodyWt,setBodyWt]=useState(()=>ld('bodyWeight',''));
  
  const hEx=()=>{
    const data={workoutData:ld('workoutData',{}),workoutHistory:ld('workoutHistory',[]),streak:ld('streak',0),prs:{}};
    Object.keys(localStorage).filter(k=>k.startsWith('pr_')).forEach(k=>data.prs[k]=localStorage.getItem(k));
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`ironclad-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    vb();
  };
  
  const hIm=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.workoutData)sv('workoutData',data.workoutData);
        if(data.workoutHistory)sv('workoutHistory',data.workoutHistory);
        if(data.streak)sv('streak',data.streak);
        if(data.prs)Object.entries(data.prs).forEach(([k,v])=>localStorage.setItem(k,v));
        alert('Import successful! Refreshing...');
        location.reload();
      }catch{alert('Invalid backup file')}
    };
    reader.readAsText(file);
  };
  
  return <div className="pg">
    <div className="nav-lg">
      <div style={{fontSize:28,fontWeight:700}}>Settings</div>
    </div>
    <div className="sc">
      <div className="sec">Program</div>
      <div className="crd">
        <div className="crd-p">
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>Current Phase</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {PHASES.map(p=><button key={p.id} onClick={()=>{sPh(p);sv('phase',p.id);vb()}} className="chip" style={{background:ph.id===p.id?'var(--grn)':'var(--c2)',color:ph.id===p.id?'#000':'var(--t1)',border:'none',cursor:'pointer'}}>{p.n}</button>)}
          </div>
          <div style={{fontSize:12,color:'var(--t3)',marginTop:8}}>{ph.desc}</div>
        </div>
        <div style={{borderTop:'0.5px solid var(--sep)'}}/>
        <div className="crd-p">
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>Current Week</div>
          <div style={{display:'flex',gap:8}}>
            {[1,2,3,4].map(w=><button key={w} onClick={()=>{sWk(w);sv('week',w);vb()}} className="chip" style={{background:wk===w?'var(--grn)':'var(--c2)',color:wk===w?'#000':'var(--t1)',border:'none',cursor:'pointer'}}>Week {w}</button>)}
          </div>
        </div>
      </div>
      
      <div className="sec">Body Stats</div>
      <div className="crd"><div className="crd-p">
        <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>Body Weight (kg)</div>
        <input className="inp" type="number" placeholder="Enter weight" value={bodyWt} onChange={e=>{setBodyWt(e.target.value);sv('bodyWeight',e.target.value)}}/>
      </div></div>
      
      {Object.keys(draft).length>0&&<>
        <div className="sec">Unsaved Data</div>
        <div className="crd"><div className="crd-p">
          <button className="btn btn-d" onClick={()=>{if(confirm('Discard all unsaved workout data?')){sv('drafts',{});setDraft({})}}}>Discard All Drafts ({Object.keys(draft).length})</button>
        </div></div>
      </>}
      
      <div className="sec">Data Management</div>
      <div className="crd"><div className="crd-p" style={{display:'flex',flexDirection:'column',gap:10}}>
        <button className="btn btn-p" onClick={hEx}>📤 Export Backup</button>
        <label className="btn btn-s" style={{cursor:'pointer',textAlign:'center'}}>📥 Import Backup<input type="file" accept=".json" onChange={hIm} style={{display:'none'}}/></label>
        <button className="btn btn-d" onClick={()=>{if(confirm('Delete ALL data? This cannot be undone.')){localStorage.clear();location.reload()}}}>🗑️ Clear All Data</button>
      </div></div>
      
      <div className="crd" style={{marginTop:16}}><div className="crd-p">
        <div style={{fontSize:13,color:'var(--t2)',marginBottom:6}}>Exercise Library</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {MUSCLES.map(m=><span key={m} className="chip b" style={{fontSize:10}}>{m}: {EXDB.filter(e=>e.m===m).length}</span>)}
        </div>
        <div style={{fontSize:12,color:'var(--t3)',marginTop:8}}>{EXDB.length} total exercises · {EXDB.filter(e=>e.k).length} knee-safe</div>
      </div></div>
      
      <div style={{textAlign:'center',padding:'24px 16px 40px',color:'var(--t3)'}}>
        <div style={{fontSize:15,fontWeight:600}}>☘️ IronClad Pro v10.1 🇮🇪</div>
        <div style={{fontSize:12,marginTop:4}}>Built for your knee recovery</div>
        <div style={{fontSize:11,marginTop:12,color:'var(--t3)'}}>Tap ⬆ Share → Add to Home Screen</div>
      </div>
    </div>
  </div>;
};

// === MAIN APP ===
const App=()=>{
  const[tab,sTab]=useState('workout');
  const[ph,sPh]=useState(()=>PHASES.find(p=>p.id===ld('phase',1))||PHASES[0]);
  const[wk,sWk]=useState(()=>ld('week',1));
  const[dt,sD]=useState(()=>ld('workoutData',{}));
  const[strk,sStrk]=useState(()=>ld('streak',0));
  const[hist,sHist]=useState(()=>ld('workoutHistory',[]));
  const[draft,setDraft]=useState(()=>ld('drafts',{}));
  
  const hasDrafts=Object.keys(draft).length>0;
  
  return <>
    {tab==='workout'&&<WorkoutTab ph={ph} dt={dt} sD={sD} strk={strk} sStrk={sStrk} hist={hist} sHist={sHist} draft={draft} setDraft={setDraft}/>}
    {tab==='progress'&&<ProgressTab dt={dt} hist={hist}/>}
    {tab==='library'&&<LibraryTab/>}
    {tab==='settings'&&<SettingsTab ph={ph} sPh={sPh} wk={wk} sWk={sWk} draft={draft} setDraft={setDraft}/>}
    
    <div className="tabs">
      {[
        {id:'workout',l:'Workout',ic:<svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>},
        {id:'progress',l:'Progress',ic:<svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>},
        {id:'library',l:'Library',ic:<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>},
        {id:'settings',l:'Settings',ic:<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>}
      ].map(t=>
        <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>{sTab(t.id);vb()}}>
          {t.id==='workout'&&hasDrafts&&<div className="tab-bdg"/>}
          {t.ic}
          <span>{t.l}</span>
        </button>
      )}
    </div>
  </>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
