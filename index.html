<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronClad">
<meta name="theme-color" content="#000">
<meta name="version" content="14.0.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IronClad Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js?v=13"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js?v=13"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js?v=13"></script>
<style>
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--sep:rgba(84,84,88,0.65);--t1:#fff;--t2:rgba(235,235,245,0.6);--t3:rgba(235,235,245,0.3);--grn:#30d158;--grn-d:rgba(48,209,88,0.15);--org:#ff9f0a;--org-d:rgba(255,159,10,0.15);--red:#ff453a;--blu:#0a84ff;--pur:#bf5af2;--cyn:#64d2ff;--yel:#ffd60a;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,system-ui,'SF Pro Display',sans-serif;-webkit-font-smoothing:antialiased}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(90px + var(--safe-b)) 16px}
.hdr{padding:max(12px,var(--safe-t)) 16px 12px;background:rgba(0,0,0,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.hdr p{font-size:13px;color:var(--t2);margin-top:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(30,30,30,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--sep);padding:6px 0 calc(6px + var(--safe-b));display:flex;z-index:200}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:none;border:none;color:var(--t3);font-size:10px;font-family:inherit;cursor:pointer;transition:color .2s}
.tab.on{color:var(--grn)}
.tab svg{width:22px;height:22px}
.card{background:var(--c1);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.card-h h3{font-size:17px;font-weight:600}
.card-h .sub{font-size:13px;color:var(--t2);margin-top:2px}
.card-h .icon{font-size:24px;margin-right:12px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-g{background:var(--grn-d);color:var(--grn)}
.badge-o{background:var(--org-d);color:var(--org)}
.badge-b{background:rgba(10,132,255,0.15);color:var(--blu)}
.badge-p{background:rgba(191,90,242,0.15);color:var(--pur)}
.ss{border-top:0.5px solid var(--sep);padding:12px 16px}
.ss-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ss-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ss-type{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600}
.ex-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid rgba(84,84,88,0.3)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-size:15px;font-weight:500;flex:1}
.ex-info{font-size:13px;color:var(--t2)}
.ex-tag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.tag-k{background:var(--grn-d);color:var(--grn)}
.tag-e{background:rgba(100,210,255,0.15);color:var(--cyn)}
.tag-p{background:rgba(255,69,58,0.15);color:var(--red)}
.tag-b{background:rgba(255,214,10,0.15);color:var(--yel)}
.tag-t{background:rgba(191,90,242,0.15);color:var(--pur)}
.log-area{padding:12px 16px;border-top:0.5px solid var(--sep)}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.set-num{width:28px;height:28px;border-radius:8px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--t2);flex-shrink:0}
.inp{flex:1;height:40px;background:var(--c2);border:1.5px solid var(--c3);border-radius:10px;padding:0 12px;color:var(--t1);font-size:16px;font-family:inherit;outline:none;text-align:center;transition:border .2s}
.inp:focus{border-color:var(--grn)}
.inp.done{border-color:var(--grn);background:var(--grn-d)}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-g{background:var(--grn);color:#000}
.btn-g:active{opacity:0.7}
.btn-s{background:var(--c2);color:var(--t1)}
.btn-s:active{background:var(--c3)}
.btn-d{background:rgba(255,69,58,0.15);color:var(--red)}
.prg{height:6px;background:var(--c2);border-radius:3px;overflow:hidden;margin-top:8px}
.prg-f{height:100%;background:var(--grn);border-radius:3px;transition:width .5s}
.sht{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;justify-content:flex-end}
.sht-bg{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px)}
.sht-c{background:#1c1c1e;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b);position:relative;z-index:1;animation:sheetUp .3s ease-out}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sht-bar{width:36px;height:5px;background:var(--c3);border-radius:3px;margin:8px auto}
.sht-h{padding:12px 16px;border-bottom:0.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between}
.sht-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;top:max(60px,calc(var(--safe-t) + 50px));left:50%;transform:translateX(-50%);background:var(--c1);border:1px solid var(--sep);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:10px;z-index:3000;animation:toastIn .3s ease-out;font-size:14px;font-weight:500}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--c1);border-radius:12px;padding:14px}
.stat-card .val{font-size:24px;font-weight:700}
.stat-card .lbl{font-size:12px;color:var(--t2);margin-top:2px}
.hist-item{background:var(--c1);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.phase-sel{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:2px 0}
.phase-btn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--c3);background:none;color:var(--t2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.phase-btn.on{border-color:var(--grn);background:var(--grn-d);color:var(--grn)}
.section-t{font-size:20px;font-weight:700;margin:20px 0 12px;letter-spacing:-0.3px}
.focus-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// === UTILITIES ===
const ld=(k,d)=>{try{const v=localStorage.getItem('ic13_'+k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>localStorage.setItem('ic13_'+k,JSON.stringify(v));
const vb=()=>{try{navigator.vibrate?.(10)}catch{}};
const fmtDate=(d)=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

// === EXERCISE DATABASE ===
// t: w=weight, r=reps, d=duration, c=cardio, m=mobility
// tags: k=knee-safe, e=eccentric, p=power/explosive, b=balance, t=trainer-prescribed
const EXDB=[
  // TRAINER PRESCRIBED - LEG DAY
  {id:'trapbar',n:'Trapbar Deadlift',m:'Legs',t:'w',eq:'Barbell',tags:['k','t'],note:'Hip hinge focus, keep back neutral'},
  {id:'foamquad',n:'Foam Rolling Quads',m:'Recovery',t:'d',eq:'Foam Roller',tags:['k','t'],note:'90s per quad, focus on tight spots'},
  {id:'johnsoncalf',n:'BB Johnson Calf Raise',m:'Calves',t:'w',eq:'Barbell',tags:['k','t'],note:'Full ROM, 2s pause at top'},
  {id:'copenadduct',n:'Copenhagen Adductor',m:'Adductors',t:'d',eq:'Bench',tags:['k','t'],note:'Side plank position, top leg on bench'},
  {id:'starplank',n:'Star Plank',m:'Core',t:'d',eq:'Bodyweight',tags:['k','t'],note:'Extend opposite arm & leg from plank'},
  {id:'staggerpallof',n:'Stagger Stance Pallof Pulses',m:'Core',t:'r',eq:'Cable',tags:['k','b','t'],note:'Split stance, pulse arms out'},
  {id:'anklejump',n:'Ankle Jumps + Alt Skipping',m:'Legs',t:'r',eq:'Bodyweight',tags:['k','p','t'],note:'Quick reactive jumps, minimal knee bend'},

  // ECCENTRIC KNEE REHAB
  {id:'eccstepdown',n:'Eccentric Step-Down',m:'Quads',t:'r',eq:'Step',tags:['k','e'],note:'4s lowering, single leg, 15cm step'},
  {id:'bulgsplit',n:'Bulgarian Split Squat',m:'Quads',t:'w',eq:'Dumbbell',tags:['k','e','b','t'],note:'Rear foot elevated, 4s eccentric lowering, shallow depth initially'},
  {id:'slraise',n:'Straight Leg Raise',m:'Quads',t:'r',eq:'Bodyweight',tags:['k','e'],note:'Lock knee, lift to 45°, 3s hold'},

  // LOWER BODY
  {id:'hipthrust',n:'Barbell Hip Thrust',m:'Glutes',t:'w',eq:'Barbell',tags:['k'],note:'Drive through heels, squeeze at top'},
  {id:'rdl',n:'Romanian Deadlift',m:'Hamstrings',t:'w',eq:'Barbell',tags:['k'],note:'Hinge at hips, soft knee bend'},
  {id:'slrdl',n:'Single-Leg RDL',m:'Hamstrings',t:'w',eq:'Dumbbell',tags:['k','b'],note:'Balance challenge + hamstring'},
  {id:'legcurl',n:'Lying Leg Curl',m:'Hamstrings',t:'w',eq:'Machine',tags:['k'],note:'Control the eccentric'},
  {id:'cablekick',n:'Cable Kickback',m:'Glutes',t:'w',eq:'Cable',tags:['k'],note:'Squeeze glute at top'},
  {id:'glutebridge',n:'Glute Bridge',m:'Glutes',t:'r',eq:'Bodyweight',tags:['k'],note:'Pause 2s at top'},
  {id:'clamshell',n:'Clamshell',m:'Glutes',t:'r',eq:'Band',tags:['k'],note:'Band above knees, control motion'},
  {id:'tke',n:'Terminal Knee Extension',m:'VMO',t:'r',eq:'Band',tags:['k','e'],note:'Band behind knee, squeeze to full extension'},
  {id:'calfstand',n:'Standing Calf Raise',m:'Calves',t:'w',eq:'Machine',tags:['k'],note:'Full ROM, slow eccentric'},
  {id:'eccheeldrop',n:'Eccentric Heel Drop',m:'Calves',t:'r',eq:'Step',tags:['k','e'],note:'Stand on step edge, rise on both feet, lower slowly on one — 4s eccentric. Key for achilles health'},
  {id:'seatedcalf',n:'Seated Calf Raise',m:'Calves',t:'w',eq:'Machine',tags:['k'],note:'Targets soleus — the deep calf muscle that loads the achilles most during running'},
  {id:'kbswing',n:'Kettlebell Swing',m:'Glutes',t:'w',eq:'Kettlebell',tags:['k','p'],note:'Power from hips, not arms'},

  // UPPER PUSH
  {id:'dbbench',n:'Dumbbell Bench Press',m:'Chest',t:'w',eq:'Dumbbell',tags:['k'],note:''},
  {id:'dbincbench',n:'Incline DB Press',m:'Chest',t:'w',eq:'Dumbbell',tags:['k'],note:'30° incline'},
  {id:'cablefly',n:'Cable Fly',m:'Chest',t:'w',eq:'Cable',tags:['k'],note:'Squeeze at center'},
  {id:'pushup',n:'Push-ups',m:'Chest',t:'r',eq:'Bodyweight',tags:['k'],note:''},
  {id:'dbohp',n:'DB Shoulder Press',m:'Shoulders',t:'w',eq:'Dumbbell',tags:['k'],note:''},
  {id:'latraise',n:'Lateral Raise',m:'Shoulders',t:'w',eq:'Dumbbell',tags:['k'],note:''},
  {id:'ropepush',n:'Rope Pushdown',m:'Triceps',t:'w',eq:'Cable',tags:['k'],note:''},
  {id:'chestpress',n:'Machine Chest Press',m:'Chest',t:'w',eq:'Machine',tags:['k'],note:''},
  {id:'dip',n:'Dips',m:'Chest',t:'r',eq:'Bodyweight',tags:['k'],note:''},

  // UPPER PULL
  {id:'pullup',n:'Pull-ups',m:'Back',t:'r',eq:'Bodyweight',tags:['k'],note:''},
  {id:'latpd',n:'Lat Pulldown',m:'Back',t:'w',eq:'Cable',tags:['k'],note:''},
  {id:'cablerow',n:'Seated Cable Row',m:'Back',t:'w',eq:'Cable',tags:['k'],note:''},
  {id:'dbrow',n:'Dumbbell Row',m:'Back',t:'w',eq:'Dumbbell',tags:['k'],note:''},
  {id:'facepull',n:'Face Pull',m:'Back',t:'w',eq:'Cable',tags:['k'],note:'External rotation at top'},
  {id:'invrow',n:'Inverted Row',m:'Back',t:'r',eq:'Bodyweight',tags:['k'],note:''},
  {id:'dbcurl',n:'Dumbbell Curl',m:'Biceps',t:'w',eq:'Dumbbell',tags:['k'],note:''},
  {id:'hammercurl',n:'Hammer Curl',m:'Biceps',t:'w',eq:'Dumbbell',tags:['k'],note:''},

  // CORE
  {id:'deadbug',n:'Dead Bug',m:'Core',t:'r',eq:'Bodyweight',tags:['k'],note:'Opposite arm/leg, press low back down'},
  {id:'pallof',n:'Pallof Press',m:'Core',t:'r',eq:'Cable',tags:['k','b'],note:'Anti-rotation hold'},
  {id:'plank',n:'Plank',m:'Core',t:'d',eq:'Bodyweight',tags:['k'],note:''},
  {id:'sideplank',n:'Side Plank',m:'Core',t:'d',eq:'Bodyweight',tags:['k','b'],note:'Stack feet or stagger'},
  {id:'birddog',n:'Bird Dog',m:'Core',t:'r',eq:'Bodyweight',tags:['k','b'],note:'Opposite arm/leg, hold 3s'},
  {id:'hangknee',n:'Hanging Knee Raise',m:'Core',t:'r',eq:'Bar',tags:['k'],note:'Control the swing'},
  {id:'bearcrwl',n:'Bear Crawl',m:'Core',t:'d',eq:'Bodyweight',tags:['k','b'],note:'Knees 1 inch off ground'},
  {id:'mtclimb',n:'Mountain Climbers',m:'Core',t:'d',eq:'Bodyweight',tags:['k','p'],note:'Quick but controlled'},

  // BALANCE / POWER
  {id:'bosusquat',n:'BOSU Balance Squat',m:'Legs',t:'r',eq:'BOSU',tags:['k','b'],note:'Shallow squat, focus on stability'},
  {id:'slstand',n:'Single-Leg Balance Hold',m:'Balance',t:'d',eq:'Bodyweight',tags:['k','b'],note:'30-60s, eyes closed to progress'},
  {id:'boxstep',n:'Low Box Step-Up',m:'Quads',t:'r',eq:'Step',tags:['k','b'],note:'Low step, controlled, no push-off'},

  // CARDIO
  {id:'rowing',n:'Rowing Machine',m:'Cardio',t:'c',eq:'Machine',tags:['k'],note:'500m intervals or steady state'},
  {id:'assault',n:'Assault Bike',m:'Cardio',t:'c',eq:'Machine',tags:['k'],note:'30s on / 30s off'},
  {id:'battlerope',n:'Battle Ropes',m:'Cardio',t:'d',eq:'Equipment',tags:['k','p'],note:'Alternate arms, 30s bursts'},

  // PHASE 2+ PROGRESSIONS
  {id:'bbench',n:'Barbell Bench Press',m:'Chest',t:'w',eq:'Barbell',tags:['k'],note:'Progression from DB bench'},
  {id:'wtpullup',n:'Weighted Pull-up',m:'Back',t:'w',eq:'Bodyweight',tags:['k'],note:'Add plate via belt or DB between feet'},
  {id:'bbohp',n:'Barbell Overhead Press',m:'Shoulders',t:'w',eq:'Barbell',tags:['k'],note:'Standing, strict press'},
  {id:'hipthrusthvy',n:'Heavy Hip Thrust',m:'Glutes',t:'w',eq:'Barbell',tags:['k'],note:'Progressive overload — 3s pause at top'},
  {id:'lowboxjump',n:'Low Box Jump',m:'Legs',t:'r',eq:'Box',tags:['k','p'],note:'Soft landing, step down — do NOT jump down'},
  {id:'gobsquat',n:'Goblet Squat',m:'Quads',t:'w',eq:'Dumbbell',tags:['k'],note:'Only when physio clears deeper flexion. Controlled depth.'},
  {id:'skierswing',n:'KB Skier Swing',m:'Glutes',t:'w',eq:'Kettlebell',tags:['k','p'],note:'Double arm ski-pole motion, explosive hips'},
  {id:'sledpush',n:'Sled Push',m:'Legs',t:'d',eq:'Sled',tags:['k','p'],note:'Low handle, drive through toes — great knee-safe conditioning'},
  {id:'tbarrow',n:'T-Bar Row',m:'Back',t:'w',eq:'Barbell',tags:['k'],note:'Chest-supported if available'},
  {id:'dblunge',n:'Walking DB Lunge',m:'Quads',t:'w',eq:'Dumbbell',tags:['k','b'],note:'Only Phase 3+ — controlled stride, upright torso'},
  {id:'hanglegraise',n:'Hanging Leg Raise',m:'Core',t:'r',eq:'Bar',tags:['k'],note:'Full leg raise — progression from knee raise'},
  {id:'slhop',n:'Single-Leg Forward Hop',m:'Legs',t:'r',eq:'Bodyweight',tags:['k','p','b'],note:'Stick the landing, 2s hold — sport-specific power'},
  {id:'suitcasecarry',n:'Suitcase Carry',m:'Core',t:'d',eq:'Dumbbell',tags:['k','b'],note:'Heavy DB one side, walk — anti-lateral flexion'}
];

const getEx=(eid)=>EXDB.find(e=>e.id===eid)||{id:eid,n:'Unknown',m:'Other',t:'w',eq:'None',tags:[],note:''};

// === PHASE-AWARE PROGRAM ===
const PHASES_META=[
  {id:1,n:'Foundation',wks:'Weeks 1-4',d:'Build base strength, learn movements, begin knee rehab. Lighter loads, higher reps, emphasis on form.',icon:'🌱'},
  {id:2,n:'Build',wks:'Weeks 5-8',d:'Progressive overload. Add sets & load on compounds. Introduce barbell work. Deepen eccentric capacity.',icon:'🔨'},
  {id:3,n:'Strength & Power',wks:'Weeks 9-12',d:'Peak intensity. Heavier loads, explosive movements, sport-specific trail running prep.',icon:'🔥'},
  {id:4,n:'Maintain & Perform',wks:'Weeks 13+',d:'Sustain strength while running volume increases. Metabolic conditioning. Injury-proof your body.',icon:'🏔'}
];

const getProgramDays=(phase)=>{
  // Day 1 always: Legs & Core (trainer exercises constant, progression layered on)
  // Day 2 always: Upper Body & Core (push/pull, progressive overload)
  // Day 3 always: Power, Balance & Core (explosive, stability, conditioning)

  if(phase===1) return [
    {id:1,n:'Legs & Core',icon:'🦵',
      focus:['Knee Recovery','Eccentric Strength','Core Stability','Trainer Rx'],
      supersets:[
        {label:'Strength & Mobility',type:'Circuit',color:'var(--grn)',
         ex:[{eid:'trapbar',s:3,r:'8-10'},{eid:'foamquad',s:1,r:'90s/side'},{eid:'johnsoncalf',s:3,r:'12-15'}]},
        {label:'Stability & Anti-Rotation',type:'Superset',color:'var(--blu)',
         ex:[{eid:'copenadduct',s:3,r:'20-30s/side'},{eid:'starplank',s:3,r:'8ea'},{eid:'staggerpallof',s:3,r:'10ea'}]},
        {label:'Power & Eccentric',type:'Circuit',color:'var(--org)',
         ex:[{eid:'anklejump',s:3,r:'15+15'},{eid:'eccstepdown',s:3,r:'10ea'},{eid:'bulgsplit',s:3,r:'8-10ea'}]}
      ]},
    {id:2,n:'Upper Body & Core',icon:'💪',
      focus:['Push/Pull Balance','Core Strength','Calorie Burn','Posture'],
      supersets:[
        {label:'Push & Pull',type:'Superset',color:'var(--pur)',
         ex:[{eid:'dbbench',s:3,r:'10-12'},{eid:'cablerow',s:3,r:'10-12'},{eid:'deadbug',s:3,r:'10ea'}]},
        {label:'Shoulders & Back',type:'Superset',color:'var(--cyn)',
         ex:[{eid:'dbohp',s:3,r:'10-12'},{eid:'latpd',s:3,r:'10-12'},{eid:'pallof',s:3,r:'12ea'}]},
        {label:'Arms & Core Finisher',type:'Circuit',color:'var(--yel)',
         ex:[{eid:'cablefly',s:3,r:'12-15'},{eid:'facepull',s:3,r:'15-20'},{eid:'hangknee',s:3,r:'10-15'}]}
      ]},
    {id:3,n:'Power, Balance & Core',icon:'⚡',
      focus:['Explosive Power','Balance Training','Landing Mechanics','Fat Burn'],
      supersets:[
        {label:'Power & Hinge',type:'Circuit',color:'var(--red)',
         ex:[{eid:'kbswing',s:3,r:'12-15'},{eid:'slrdl',s:3,r:'10ea'},{eid:'birddog',s:3,r:'10ea'}]},
        {label:'Upper Strength & Stability',type:'Superset',color:'var(--grn)',
         ex:[{eid:'pushup',s:3,r:'12-20'},{eid:'invrow',s:3,r:'8-12'},{eid:'sideplank',s:3,r:'30-45s/side'}]},
        {label:'Lower Leg Resilience',type:'Circuit',color:'var(--org)',
         ex:[{eid:'boxstep',s:3,r:'10ea'},{eid:'eccheeldrop',s:3,r:'12ea'},{eid:'seatedcalf',s:3,r:'15'}]}
      ]}
  ];

  if(phase===2) return [
    {id:1,n:'Legs & Core',icon:'🦵',
      focus:['Progressive Overload','Eccentric Depth','Hip Strength','Trainer Rx'],
      supersets:[
        {label:'Heavy Hinge & Calf',type:'Circuit',color:'var(--grn)',

// === SET LOGGER ===
const SetLogger=({exDef,exData,dayId,ssIdx,exIdx,onLog,phase})=>{
  const ex=getEx(exDef.eid);
  const sets=exDef.s||3;
  const isWeight=ex.t==='w';
  const isDuration=ex.t==='d';
  const logKey=`log_p${phase||1}_${dayId}_${ssIdx}_${exIdx}`;
  const [vals,setVals]=useState(()=>{
    const saved=ld(logKey,[]);
    return Array.from({length:sets},(_,i)=>saved[i]||{w:'',r:'',done:false});
  });

  const update=(si,field,val)=>{
    const nv=[...vals];
    nv[si]={...nv[si],[field]:val};
    setVals(nv);
    sv(logKey,nv);
  };

  const markDone=(si)=>{
    const nv=[...vals];
    nv[si]={...nv[si],done:!nv[si].done};
    setVals(nv);
    sv(logKey,nv);
    vb();
  };

  const completed=vals.filter(v=>v.done).length;

  return (
    <div className="log-area">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:13,color:'var(--t2)'}}>{completed}/{sets} sets</div>
        {ex.note && <div style={{fontSize:11,color:'var(--t3)',maxWidth:'60%',textAlign:'right'}}>{ex.note}</div>}
      </div>
      {vals.map((v,si)=>(
        <div key={si} className="set-row">
          <div className="set-num" style={v.done?{background:'var(--grn-d)',color:'var(--grn)'}:{}}>{si+1}</div>
          {isWeight && <input className={`inp${v.w?' done':''}`} placeholder="kg" type="number" inputMode="decimal" value={v.w} onChange={e=>update(si,'w',e.target.value)} style={{maxWidth:80}}/>}
          <input className={`inp${v.r?' done':''}`} placeholder={isDuration?'sec':'reps'} type={isDuration?'number':'text'} inputMode={isDuration?'numeric':'text'} value={v.r} onChange={e=>update(si,'r',e.target.value)} style={{maxWidth:isWeight?80:120}}/>
          <button onClick={()=>markDone(si)} style={{width:40,height:40,borderRadius:10,border:'none',background:v.done?'var(--grn)':'var(--c2)',color:v.done?'#000':'var(--t3)',fontSize:18,cursor:'pointer',flexShrink:0}}>✓</button>
        </div>
      ))}
    </div>
  );
};

const ProgressTab=()=>{
  const hist=ld('history',[]);

  const streak=(()=>{let s=0;const sorted=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date));let lastDate=new Date();for(const h of sorted){const d=new Date(h.date);const diff=Math.floor((lastDate-d)/(1000*60*60*24));if(diff<=1){s++;lastDate=d}else break}return s})();

    <>

const SettingsTab=()=>{

    if(confirm('Clear all workout data? This cannot be undone.')){

      keys.forEach(k=>localStorage.removeItem(k));
      setToast('All data cleared');
    }
  };

  const exportData=()=>{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith('ic13_'));
    const data={};
    keys.forEach(k=>{try{data[k]=JSON.parse(localStorage.getItem(k))}catch{data[k]=localStorage.getItem(k)}});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`ironclad-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    setToast('Backup exported');
  };

  return(
    <>
      <div className="hdr"><h1>Settings</h1><p>IronClad Pro v14.0</p></div>
      <div className="scroll">
        <div className="section-t">Body Stats</div>

          <div style={{fontSize:14,color:'var(--t2)',marginBottom:8}}>Body Weight (kg)</div>
          <div style={{display:'flex',gap:8}}>
            <input className="inp" type="number" inputMode="decimal" placeholder="e.g. 85" value={bw} onChange={e=>setBw(e.target.value)} style={{textAlign:'left',padding:'0 14px'}}/>
            <button className="btn btn-g" onClick={()=>{sv('bodyweight',bw);setToast('Weight saved');vb()}}>Save</button>
          </div>
        </div>

        <div className="section-t">Program Info</div>
        <div className="card" style={{padding:16}}>
          <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>Trail Runner Recovery Program</div>
          <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.5}}>
            3-day full body split with 4 progressive phases. Foundation builds base strength and begins knee rehab. Build adds progressive overload and barbell work. Strength & Power peaks with heavy loads and explosive movements. Maintain & Perform sustains your gains while running volume increases. Your trainer's prescribed exercises stay constant throughout all phases. Each phase tracks progress independently.
          </div>
        </div>

        <div className="section-t">Data</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <button className="btn btn-s" onClick={exportData} style={{width:'100%'}}>📤 Export Backup</button>
          <button className="btn btn-d" onClick={clearAll} style={{width:'100%'}}>🗑 Clear All Data</button>
        </div>

        <div style={{textAlign:'center',padding:'32px 0',color:'var(--t3)',fontSize:12}}>
          IronClad Pro v14.0 · Trail Runner Recovery Edition<br/>
          Built for Matt · Knee-safe · All exercises vetted
        </div>
      </div>
      {toast&&<Toast msg={toast} onClose={()=>setToast('')}/>}
    </>
  );
};

// === APP ===
const App=()=>{
  const[tab,setTab]=useState(0);
  const tabs=[
    {n:'Workout',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6.5 6.5h11M4 12h16M6.5 17.5h11"/><circle cx="4" cy="6.5" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="17.5" r="2"/></svg>},
    {n:'Progress',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 20h18M6 16V8M10 16V4M14 16v-5M18 16V9"/></svg>},
    {n:'Library',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>},
    {n:'Settings',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>}
  ];

  return(
    <div className="app">
      {tab===0&&<WorkoutTab/>}
      {tab===1&&<ProgressTab/>}
      {tab===2&&<LibraryTab/>}
      {tab===3&&<SettingsTab/>}
      <div className="tabs">
        {tabs.map((t,i)=>(
          <button key={i} className={`tab${tab===i?' on':''}`} onClick={()=>{setTab(i);vb()}}>
            {t.icon}<span>{t.n}</span>
          </button>
        ))}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
