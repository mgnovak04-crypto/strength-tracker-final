<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronClad">
<meta name="theme-color" content="#0a0f0a">
<title>IronClad v7</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--g:#169B62;--o:#FF883E;--bg:#0a0f0a;--c1:#1a251a;--c2:#243024;--c3:#2d3d2d;--t1:#fff;--t2:#8fa88f;--t3:#5a7a5a;--b:rgba(255,255,255,0.08);--r:#ff6b6b}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t1)}
#root{height:100%;display:flex;flex-direction:column}
.page{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex-shrink:0;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:rgba(10,15,10,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--b)}
.cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(70px + env(safe-area-inset-bottom))}
.tabs{flex-shrink:0;position:fixed;bottom:0;left:0;right:0;background:rgba(10,15,10,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--b);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 16px;border:none;background:none;color:var(--t3);font-size:9px;cursor:pointer;transition:color .2s}
.tab.on{color:var(--g)}
.tab i{font-size:18px}
.crd{background:var(--c1);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--b)}
.str{height:3px;background:linear-gradient(90deg,var(--g) 33%,#fff 33% 66%,var(--o) 66%);border-radius:2px;margin-bottom:12px}
.bdg{display:inline-flex;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:600}
.bdg.g{background:rgba(22,155,98,0.2);color:#1eb872}
.bdg.o{background:rgba(255,136,62,0.2);color:var(--o)}
.day{background:var(--c1);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--b);display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .15s,border-color .2s}
.day:active{transform:scale(0.98)}
.day-i{width:40px;height:40px;border-radius:10px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background .2s}
.day.dn .day-i{background:var(--g)}
.day.dn{border-color:var(--g)}
.ex{background:var(--c1);border-radius:10px;padding:10px;margin-bottom:6px;border:1px solid var(--b);display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.ex:active{transform:scale(0.98)}
.ex.dn{border-color:var(--g);background:linear-gradient(135deg,rgba(22,155,98,0.08),var(--c1))}
.ex-i{width:32px;height:32px;border-radius:8px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ex.dn .ex-i{background:var(--g)}
.ex-b{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--c2);color:var(--t2);flex-shrink:0}
.ex-b.on{background:var(--g);color:#fff}
.sr{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.sn{width:28px;height:28px;border-radius:50%;background:var(--c1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;border:2px solid var(--b);transition:all .2s}
.sn.dn{background:var(--g);color:#fff;border-color:var(--g)}
.sn.act{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,136,62,0.3)}
.si{width:100%;padding:10px 4px;font-size:18px;font-weight:700;text-align:center;background:var(--c1);border:2px solid var(--b);border-radius:8px;color:var(--t1);transition:border-color .2s}
.si:focus{outline:none;border-color:var(--g)}
.si.has{border-color:var(--g);background:rgba(22,155,98,0.05)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(0.97)}
.btn-g{background:linear-gradient(135deg,var(--g),#0d7a4d);color:#fff}
.btn-s{background:var(--c2);color:var(--t1)}
.btn-o{background:linear-gradient(135deg,var(--o),#e67332);color:#fff}
.st{text-align:center;padding:8px}
.st-v{font-size:20px;font-weight:800}
.st-l{font-size:8px;color:var(--t3);text-transform:uppercase;margin-top:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.ov-c{background:var(--c1);border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));width:100%;max-height:85vh;overflow-y:auto}
.ov-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--b)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.pill:active{transform:scale(0.95)}
.pill.on{background:var(--g);color:#fff}
.pill.off{background:var(--c2);color:var(--t2)}
.qb{width:36px;height:36px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.qb:active{transform:scale(0.9)}
.qb.up{background:rgba(22,155,98,0.2);color:var(--g)}
.qb.dn{background:rgba(255,107,107,0.2);color:var(--r)}
.note-inp{width:100%;padding:10px;font-size:13px;background:var(--c2);border:1px solid var(--b);border-radius:8px;color:var(--t1);resize:none;font-family:inherit}
.note-inp:focus{outline:none;border-color:var(--g)}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(135deg,rgba(255,136,62,0.15),rgba(255,136,62,0.05));border-radius:10px;border:1px solid rgba(255,136,62,0.2)}
.streak-num{font-size:24px;font-weight:800;color:var(--o)}
.streak-txt{font-size:10px;color:var(--t2);line-height:1.2}
.timer-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--c2);border-radius:10px;margin-bottom:10px}
.timer-display{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t1);flex:1}
.timer-btn{width:32px;height:32px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.swap-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--c2);border-radius:10px;margin-bottom:6px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.swap-item:active{transform:scale(0.98)}
.swap-item.sel{border-color:var(--g);background:rgba(22,155,98,0.1)}
.swap-i{width:36px;height:36px;border-radius:8px;background:var(--c1);display:flex;align-items:center;justify-content:center;font-size:16px}
.rest-ov{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;padding:20px}
.rest-time{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--t1)}
.rest-label{font-size:14px;color:var(--t2);margin-top:8px}
.rest-btns{display:flex;gap:10px;margin-top:24px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--t3)}
.cal-day.hd{font-size:8px;color:var(--t3)}
.cal-day.wk{background:var(--c2);color:var(--t2)}
.cal-day.td{border:1px solid var(--g)}
.cal-day.dn{background:var(--g);color:#fff}
@keyframes cf{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.cf{position:fixed;width:10px;height:10px;top:0;z-index:9999;pointer-events:none;animation:cf 3s ease-out forwards}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pulse{animation:pulse .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.slide-up{animation:slideUp .25s ease}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// === DATA ===
const P=[{id:1,n:'Foundation',m:'1-3',r:'12-15',s:3,c:'g'},{id:2,n:'Build',m:'4-6',r:'10-12',s:3,c:'o'},{id:3,n:'Strengthen',m:'7-9',r:'8-10',s:4,c:'g'},{id:4,n:'Maintain',m:'10-12',r:'10-12',s:3,c:'o'}];
const D=[{id:1,n:'Upper Push',i:'💪',m:'Chest, Shoulders, Triceps'},{id:2,n:'Lower Body',i:'🍑',m:'Glutes, Hamstrings, Calves'},{id:3,n:'Upper Pull',i:'🔙',m:'Back, Biceps, Rear Delts'},{id:4,n:'Core & Cardio',i:'🔥',m:'Core, Conditioning'},{id:5,n:'Recovery',i:'🧘',m:'Mobility, Rehab'}];

const defaultEx={
    1:[{n:'Push-ups',r:'12-15',m:'Chest',i:'💪'},{n:'DB Bench Press',r:'12-15',m:'Chest',i:'🏋️'},{n:'DB Shoulder Press',r:'12-15',m:'Shoulders',i:'🎯'},{n:'Lateral Raises',r:'12-15',m:'Shoulders',i:'🦅'},{n:'Tricep Dips',r:'12-15',m:'Triceps',i:'💪'},{n:'Tricep Pushdowns',r:'12-15',m:'Triceps',i:'⬇️'}],
    2:[{n:'Glute Bridges',r:'15-20',m:'Glutes',i:'🍑',k:1},{n:'Romanian Deadlift',r:'12-15',m:'Hamstrings',i:'🦵',k:1},{n:'Hip Thrust',r:'12-15',m:'Glutes',i:'🍑',k:1},{n:'Lying Leg Curl',r:'12-15',m:'Hamstrings',i:'🦵',k:1},{n:'Calf Raises',r:'15-20',m:'Calves',i:'🦶'},{n:'TKE',r:'15-20',m:'VMO',i:'🦿',k:1}],
    3:[{n:'Lat Pulldown',r:'12-15',m:'Lats',i:'🔙'},{n:'Seated Cable Row',r:'12-15',m:'Back',i:'🚣'},{n:'DB Rows',r:'12-15',m:'Back',i:'🏋️'},{n:'Face Pulls',r:'15-20',m:'Rear Delts',i:'🎯'},{n:'Bicep Curls',r:'12-15',m:'Biceps',i:'💪'},{n:'Hammer Curls',r:'12-15',m:'Biceps',i:'🔨'}],
    4:[{n:'Plank',r:'30-45s',m:'Core',i:'🧘'},{n:'Dead Bug',r:'10-12/side',m:'Core',i:'🐛'},{n:'Pallof Press',r:'12-15/side',m:'Core',i:'🎯'},{n:'Bird Dog',r:'10-12/side',m:'Core',i:'🐕'},{n:'Rowing Machine',r:'10-15 min',m:'Cardio',i:'🚣',k:1},{n:'Battle Ropes',r:'30s x 5',m:'Cardio',i:'🌊'}],
    5:[{n:'Prone Leg Raise',r:'12-15/leg',m:'Glutes',i:'🦵',k:1},{n:'Glute Bridge Hold',r:'30s',m:'Glutes',i:'🍑',k:1},{n:'Clamshells',r:'15-20/side',m:'Hips',i:'🐚',k:1},{n:'Straight Leg Raise',r:'12-15/leg',m:'Quads',i:'🦵',k:1},{n:'Foam Rolling',r:'5-10 min',m:'Recovery',i:'🧘'},{n:'Swimming/Walking',r:'20-30 min',m:'Cardio',i:'🏊',k:1}]
};

const altEx={
    'Chest':[{n:'Push-ups',i:'💪'},{n:'DB Bench Press',i:'🏋️'},{n:'Incline DB Press',i:'📐'},{n:'Cable Flyes',i:'🦋'},{n:'Chest Dips',i:'⬇️'},{n:'Floor Press',i:'🛏️'}],
    'Shoulders':[{n:'DB Shoulder Press',i:'🎯'},{n:'Lateral Raises',i:'🦅'},{n:'Front Raises',i:'⬆️'},{n:'Arnold Press',i:'💪'},{n:'Cable Lateral Raise',i:'📡'},{n:'Reverse Flyes',i:'🔙'}],
    'Triceps':[{n:'Tricep Dips',i:'💪'},{n:'Tricep Pushdowns',i:'⬇️'},{n:'Overhead Extension',i:'🙆'},{n:'Skull Crushers',i:'💀'},{n:'Diamond Push-ups',i:'💎'},{n:'Kickbacks',i:'🦵'}],
    'Glutes':[{n:'Hip Thrust',i:'🍑',k:1},{n:'Glute Bridges',i:'🍑',k:1},{n:'Glute Bridge Hold',i:'🍑',k:1},{n:'Cable Kickbacks',i:'🦵',k:1},{n:'Frog Pumps',i:'🐸',k:1},{n:'Fire Hydrants',i:'🔥',k:1}],
    'Hamstrings':[{n:'Romanian Deadlift',i:'🦵',k:1},{n:'Lying Leg Curl',i:'🦵',k:1},{n:'Seated Leg Curl',i:'🪑',k:1},{n:'Good Mornings',i:'🌅',k:1},{n:'Nordic Curl',i:'❄️'},{n:'Single Leg RDL',i:'1️⃣',k:1}],
    'Calves':[{n:'Calf Raises',i:'🦶'},{n:'Seated Calf Raise',i:'🪑'},{n:'Single Leg Calf Raise',i:'1️⃣'},{n:'Donkey Calf Raise',i:'🫏'}],
    'VMO':[{n:'TKE',i:'🦿',k:1},{n:'Terminal Knee Extension',i:'🦵',k:1},{n:'VMO Dips',i:'⬇️',k:1}],
    'Lats':[{n:'Lat Pulldown',i:'🔙'},{n:'Pull-ups',i:'⬆️'},{n:'Chin-ups',i:'🫴'},{n:'Straight Arm Pulldown',i:'📏'}],
    'Back':[{n:'Seated Cable Row',i:'🚣'},{n:'DB Rows',i:'🏋️'},{n:'Barbell Row',i:'🏋️'},{n:'T-Bar Row',i:'🔧'},{n:'Chest Supported Row',i:'🛏️'},{n:'Inverted Row',i:'🔄'}],
    'Rear Delts':[{n:'Face Pulls',i:'🎯'},{n:'Reverse Flyes',i:'🦋'},{n:'Rear Delt Cable',i:'📡'}],
    'Biceps':[{n:'Bicep Curls',i:'💪'},{n:'Hammer Curls',i:'🔨'},{n:'Preacher Curls',i:'🙏'},{n:'Incline Curls',i:'📐'},{n:'Cable Curls',i:'📡'},{n:'Concentration Curl',i:'🧘'}],
    'Core':[{n:'Plank',i:'🧘'},{n:'Dead Bug',i:'🐛'},{n:'Pallof Press',i:'🎯'},{n:'Bird Dog',i:'🐕'},{n:'Ab Wheel',i:'🛞'},{n:'Hanging Leg Raise',i:'🦵'},{n:'Cable Crunch',i:'📡'}],
    'Cardio':[{n:'Rowing Machine',i:'🚣',k:1},{n:'Battle Ropes',i:'🌊'},{n:'Swimming/Walking',i:'🏊',k:1},{n:'Bike',i:'🚴',k:1},{n:'Elliptical',i:'⭕',k:1},{n:'Stair Climber',i:'🪜'}],
    'Hips':[{n:'Clamshells',i:'🐚',k:1},{n:'Fire Hydrants',i:'🔥',k:1},{n:'Side Lying Abduction',i:'🦵',k:1},{n:'Banded Walks',i:'🦀',k:1}],
    'Quads':[{n:'Straight Leg Raise',i:'🦵',k:1},{n:'Prone Leg Raise',i:'🦵',k:1},{n:'TKE',i:'🦿',k:1}],
    'Recovery':[{n:'Foam Rolling',i:'🧘'},{n:'Stretching',i:'🤸'},{n:'Yoga',i:'🧘'},{n:'Walking',i:'🚶',k:1}]
};

const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d}catch{return d}};
const cf=()=>{const c=['#169B62','#FF883E','#FFF','#FFD700'];for(let i=0;i<50;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[Math.floor(Math.random()*c.length)];e.style.animationDelay=Math.random()*0.5+'s';e.style.borderRadius=Math.random()>0.5?'50%':'2px';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}if(navigator.vibrate)navigator.vibrate([10,50,10,50,10])};
const vib=()=>{if(navigator.vibrate)navigator.vibrate(5)};

// === COMPONENTS ===
const Rg=({p,sz=32,sw=3,cl='var(--g)'})=>{const r=(sz-sw)/2,c=r*2*Math.PI,o=c-(p/100)*c;return<svg width={sz} height={sz} style={{transform:'rotate(-90deg)'}}><circle stroke="var(--c2)" fill="none" strokeWidth={sw} r={r} cx={sz/2} cy={sz/2}/><circle stroke={cl} fill="none" strokeWidth={sw} strokeLinecap="round" r={r} cx={sz/2} cy={sz/2} style={{strokeDasharray:c,strokeDashoffset:o,transition:'stroke-dashoffset .3s'}}/></svg>};

const RestTimer=({show,onClose,onDone})=>{
    const[t,sT]=useState(90);
    const[run,sR]=useState(false);
    const[sel,sS]=useState(90);
    const rf=useRef();
    
    useEffect(()=>{
        if(run&&t>0)rf.current=setInterval(()=>sT(x=>x-1),1000);
        else if(t===0){sR(false);if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);onDone?.();}
        return()=>clearInterval(rf.current);
    },[run,t]);
    
    const rs=x=>{sS(x);sT(x);sR(false)};
    if(!show)return null;
    const m=Math.floor(t/60),s=t%60;
    
    return<div className="rest-ov" onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{textAlign:'center'}}>
            <div style={{fontSize:14,color:'var(--t2)',marginBottom:8}}>REST TIME</div>
            <div className="rest-time">{m}:{s.toString().padStart(2,'0')}</div>
            <div style={{display:'flex',gap:8,justifyContent:'center',margin:'20px 0'}}>
                {[60,90,120,180].map(x=><button key={x} onClick={()=>rs(x)} className={`pill ${sel===x?'on':'off'}`}>{x}s</button>)}
            </div>
            <div className="rest-btns">
                <button onClick={()=>sR(!run)} className={`btn ${run?'btn-o':'btn-g'}`} style={{width:120}}>{run?'⏸ Pause':'▶ Start'}</button>
                <button onClick={()=>rs(sel)} className="btn btn-s" style={{width:60}}>↺</button>
                <button onClick={onClose} className="btn btn-s" style={{width:60}}>✕</button>
            </div>
        </div>
    </div>;
};

const SwapSheet=({show,muscle,current,onSelect,onClose})=>{
    if(!show)return null;
    const opts=altEx[muscle]||[];
    return<div className="ov" onClick={onClose}>
        <div className="ov-c slide-up" onClick={e=>e.stopPropagation()}>
            <div className="ov-h">
                <span style={{fontWeight:700}}>Swap Exercise</span>
                <button onClick={onClose} style={{background:'none',border:'none',color:'var(--t2)',fontSize:18,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{fontSize:11,color:'var(--t2)',marginBottom:10}}>Select alternative for {muscle}</div>
            {opts.map((ex,i)=>(
                <div key={i} className={`swap-item ${ex.n===current?'sel':''}`} onClick={()=>{onSelect(ex);vib();}}>
                    <div className="swap-i">{ex.i}</div>
                    <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:13}}>{ex.n}</div>
                        {ex.k&&<div style={{fontSize:10,color:'#1eb872'}}>⭐ Knee-Safe</div>}
                    </div>
                    {ex.n===current&&<span style={{color:'var(--g)'}}>✓</span>}
                </div>
            ))}
        </div>
    </div>;
};

const WorkoutTimer=({running,seconds})=>{
    const m=Math.floor(seconds/60);
    const s=seconds%60;
    return<div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'var(--c2)',borderRadius:8}}>
        <span style={{color:running?'var(--g)':'var(--t3)',fontSize:10}}>{running?'●':'○'}</span>
        <span style={{fontSize:14,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{m}:{s.toString().padStart(2,'0')}</span>
    </div>;
};

const SetTracker=({ex,ph,ini,onSv,cl,customEx,setCustomEx,dayId})=>{
    const st=ph.s;
    const[dt,sD]=useState(()=>ini?.sets||Array(st).fill().map(()=>({w:'',r:''})));
    const[note,setNote]=useState(ini?.note||'');
    const[rest,setRest]=useState(false);
    const[swap,setSwap]=useState(false);
    const[activeSet,setActiveSet]=useState(()=>{
        const first=dt.findIndex(s=>!s.w||parseFloat(s.w)===0);
        return first===-1?0:first;
    });
    
    const up=(i,f,v)=>{const d=[...dt];d[i]={...d[i],[f]:v};sD(d);vib();};
    const adj=(i,amt)=>{
        const cur=parseFloat(dt[i].w)||0;
        const nv=Math.max(0,cur+amt);
        up(i,'w',nv.toString());
    };
    const dn=s=>s.w&&parseFloat(s.w)>0;
    const av=()=>{const w=dt.filter(dn).map(s=>parseFloat(s.w));return w.length?(w.reduce((a,b)=>a+b,0)/w.length).toFixed(1):0};

    const rp=()=>dt.reduce((t,s)=>t+(parseInt(s.r)||0),0);
    const vl=()=>dt.reduce((t,s)=>t+((parseFloat(s.w)||0)*(parseInt(s.r)||0)),0);
    
    const hSv=()=>{
        onSv({sets:dt,average:parseFloat(av()),max:mx(),totalReps:rp(),totalVolume:vl(),completedSets:dt.filter(dn).length,note});

            <div style={{display:'grid',gridTemplateColumns:'28px 36px 1fr 36px 1fr',gap:4,alignItems:'center',marginBottom:6}}>

const WorkoutDay=({dy,ph,dt,sD,bk,customEx,setCustomEx,streak,setStreak,workoutHistory,setWorkoutHistory})=>{
    const[ei,sE]=useState(null);
    const[timer,setTimer]=useState(0);
    const[timerRun,setTimerRun]=useState(false);
    const timerRef=useRef();
    const startTimeRef=useRef();
    
    useEffect(()=>{
        startTimeRef.current=Date.now();
        setTimerRun(true);
        return()=>setTimerRun(false);
    },[]);
    
    useEffect(()=>{
        if(timerRun){
            timerRef.current=setInterval(()=>{
                setTimer(Math.floor((Date.now()-startTimeRef.current)/1000));
            },1000);
        }
        return()=>clearInterval(timerRef.current);
    },[timerRun]);
    
    const el=customEx?.[dy.id]?Object.keys(defaultEx[dy.id]).map((k,i)=>customEx[dy.id][defaultEx[dy.id][i].n]||defaultEx[dy.id][i]):defaultEx[dy.id];
    const getEx=()=>defaultEx[dy.id].map(e=>customEx?.[dy.id]?.[e.n]||e);
    const exList=getEx();
    
    const ky=n=>`p${ph.id}_d${dy.id}_${n}`;
    const dn=exList.filter(e=>dt[ky(e.n)]?.completedSets>0).length;
    const pc=dn/exList.length*100;
    
    const svE=(n,d)=>{
        const pv=Object.keys(dt).filter(k=>k.includes(n)).map(k=>dt[k]?.average||0).filter(v=>v>0);
        const bs=pv.length?Math.max(...pv):0;
        if(d.average&&bs&&d.average>bs)cf();
        const nd={...dt,[ky(n)]:d};
        sD(nd);sv('workoutData',nd);
        sE(null);
    };
    
    const completeWorkout=()=>{
        cf();
        const today=new Date().toDateString();
        const hist=ld('workoutHistory',[]);
        const lastWorkout=hist[0]?.date;
        let newStreak=streak;
        
        if(lastWorkout){
            const last=new Date(lastWorkout);
            const diff=Math.floor((new Date()-last)/(1000*60*60*24));
            if(diff<=1)newStreak=streak+1;
            else newStreak=1;
        }else{
            newStreak=1;
        }
        
        const entry={date:today,day:dy.id,phase:ph.id,duration:timer,exercises:dn};
        const newHist=[entry,...hist].slice(0,50);
        sv('workoutHistory',newHist);
        sv('streak',newStreak);
        setStreak(newStreak);
        setWorkoutHistory(newHist);
        bk();
    };
    
    if(ei!==null){
        const ex=exList[ei];
        const origEx=defaultEx[dy.id][ei];
        return<SetTracker ex={origEx} ph={ph} ini={dt[ky(origEx.n)]} onSv={d=>svE(origEx.n,d)} cl={()=>sE(null)} customEx={customEx} setCustomEx={setCustomEx} dayId={dy.id}/>;
    }
    
    return<div className="page">
        <div className="hdr">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <button onClick={bk} style={{background:'var(--c1)',border:'none',color:'var(--t1)',padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:12}}>←</button>
                <div style={{textAlign:'center',flex:1}}>
                    <div style={{fontSize:11,color:'var(--t2)'}}>Day {dy.id}</div>
                    <div style={{fontSize:14,fontWeight:700}}>{dy.n}</div>
                </div>
                <WorkoutTimer running={timerRun} seconds={timer}/>
            </div>
        </div>
        <div className="cnt">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div className={`bdg ${ph.c}`}>Phase {ph.id} • {ph.s}×{ph.r}</div>
                <div style={{display:'flex',alignItems:'center',gap:4}}><Rg p={pc} sz={24} sw={2}/><span style={{fontWeight:700,fontSize:12}}>{dn}/{exList.length}</span></div>
            </div>
            
            {exList.map((ex,i)=>{
                const origEx=defaultEx[dy.id][i];
                const d=dt[ky(origEx.n)];
                const iD=d?.completedSets>0;
                return<div key={i} className={`ex ${iD?'dn':''}`} onClick={()=>sE(i)}>
                    <div className="ex-i">{ex.i}</div>
                    <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:12,display:'flex',alignItems:'center',gap:4}}>
                            {ex.n}
                            {iD&&<span style={{color:'var(--g)'}}>✓</span>}
                        </div>
                        <div style={{fontSize:10,color:'var(--t2)'}}>{ex.m}{ex.k&&' ⭐'}</div>
                        {d?.note&&<div style={{fontSize:9,color:'var(--o)',marginTop:1}}>📝 {d.note.slice(0,30)}{d.note.length>30?'...':''}</div>}
                        {d&&!d.note&&<div style={{fontSize:9,color:'var(--g)',marginTop:1}}>{d.average}kg • {d.totalReps}r</div>}
                    </div>
                    <div className={`ex-b ${iD?'on':''}`}>{iD?`${d.average}kg`:'Log'}</div>
                </div>;
            })}
            
            {dn===exList.length&&<button onClick={completeWorkout} className="btn btn-g" style={{marginTop:10}}>🏁 Complete Workout</button>}
        </div>
    </div>;
};

const Calendar=({history})=>{
    const today=new Date();
    const days=['S','M','T','W','T','F','S'];
    const firstDay=new Date(today.getFullYear(),today.getMonth(),1).getDay();
    const daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
    
    const workoutDates=history.map(h=>new Date(h.date).getDate());
    
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(<div key={`e${i}`} className="cal-day"/>);
    for(let d=1;d<=daysInMonth;d++){
        const isToday=d===today.getDate();
        const isWorkout=workoutDates.includes(d);
        cells.push(<div key={d} className={`cal-day wk ${isToday?'td':''} ${isWorkout?'dn':''}`}>{d}</div>);
    }
    
    return<div>
        <div className="cal-grid">{days.map(d=><div key={d} className="cal-day hd">{d}</div>)}</div>
        <div className="cal-grid">{cells}</div>
    </div>;
};

            </div>
            
            <div className="crd" style={{padding:10}}>
                <div style={{fontWeight:700,marginBottom:10,fontSize:12}}>📅 Program</div>
                <div style={{marginBottom:10}}>
                    <div style={{fontSize:9,color:'var(--t3)',textTransform:'uppercase',marginBottom:4}}>Phase</div>
                    <select value={ph.id} onChange={e=>{const p=P.find(x=>x.id===+e.target.value);sPh(p);sv('phase',p.id)}} style={{width:'100%',padding:10,fontSize:13,borderRadius:6,border:'1px solid var(--b)',background:'var(--c2)',color:'var(--t1)'}}>
                        {P.map(p=><option key={p.id} value={p.id}>P{p.id}: {p.n} ({p.m})</option>)}
                    </select>
                </div>
                <div>
                    <div style={{fontSize:9,color:'var(--t3)',textTransform:'uppercase',marginBottom:4}}>Week</div>
                    <input type="number" min={1} max={12} value={wk} onChange={e=>{const v=Math.min(12,Math.max(1,+e.target.value||1));sWk(v);sv('week',v)}} style={{width:'100%',padding:10,fontSize:13,textAlign:'center',borderRadius:6,border:'1px solid var(--b)',background:'var(--c2)',color:'var(--t1)'}}/>
                </div>
            </div>
            
            <div className="crd" style={{padding:10}}>
                <div style={{fontWeight:700,marginBottom:10,fontSize:12}}>🔄 Exercise Customization</div>
                <button onClick={resetEx} className="btn btn-s" style={{padding:10}}>Reset All Swaps to Default</button>
            </div>
            
            <div className="crd" style={{padding:10}}>
                <div style={{fontWeight:700,marginBottom:10,fontSize:12}}>💾 Data</div>
                <button onClick={ex} className="btn btn-g" style={{marginBottom:6,padding:10}}>⬇ Export Backup</button>
                <label className="btn btn-s" style={{marginBottom:6,cursor:'pointer',padding:10}}>⬆ Import Backup<input type="file" accept=".json" onChange={im} style={{display:'none'}}/></label>
                <button onClick={()=>{if(confirm('Delete ALL data? This cannot be undone.')){localStorage.clear();location.reload()}}} className="btn" style={{background:'rgba(255,77,77,0.12)',color:'#ff6b6b',border:'1px solid rgba(255,77,77,0.2)',padding:10}}>🗑 Clear All Data</button>
            </div>
            
            <div style={{textAlign:'center',padding:12,color:'var(--t3)',fontSize:10}}>
                ☘️ <b>IronClad</b> v7.0 🇮🇪<br/>
                <span style={{fontSize:9}}>iPhone: ⬆ → Add to Home Screen</span>
            </div>
        </div>
    </div>;
};

const App=()=>{
    const[tb,sTb]=useState('workout');
    const[ph,sPh]=useState(()=>P.find(p=>p.id===ld('phase',1))||P[0]);
    const[wk,sWk]=useState(()=>ld('week',1));
    const[dt,sD]=useState(()=>ld('workoutData',{}));
    const[customEx,setCustomEx]=useState(()=>ld('customEx',{}));
    const[streak,setStreak]=useState(()=>ld('streak',0));
    const[workoutHistory,setWorkoutHistory]=useState(()=>ld('workoutHistory',[]));
    
    return<div style={{height:'100%',display:'flex',flexDirection:'column'}}>
        {tb==='workout'&&<WorkoutTab ph={ph} dt={dt} sD={sD} customEx={customEx} setCustomEx={setCustomEx} streak={streak} setStreak={setStreak} workoutHistory={workoutHistory} setWorkoutHistory={setWorkoutHistory}/>}
        {tb==='progress'&&<ProgressTab dt={dt} workoutHistory={workoutHistory}/>}
        {tb==='settings'&&<SettingsTab ph={ph} sPh={sPh} wk={wk} sWk={sWk} customEx={customEx} setCustomEx={setCustomEx}/>}
        <div className="tabs">
            {[{id:'workout',i:'fa-dumbbell',l:'Workout'},{id:'progress',i:'fa-chart-line',l:'Progress'},{id:'settings',i:'fa-gear',l:'Settings'}].map(t=>
                <button key={t.id} className={`tab ${tb===t.id?'on':''}`} onClick={()=>{sTb(t.id);vib();}}>
                    <i className={`fa-solid ${t.i}`}/>
                    <span>{t.l}</span>
                </button>
            )}
        </div>
    </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
