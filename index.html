:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--sep:rgba(84,84,88,0.65);--t1:#fff;--t2:rgba(235,235,245,0.6);--t3:rgba(235,235,245,0.3);--grn:#30d158;--grn-d:rgba(48,209,88,0.15);--org:#ff9f0a;--org-d:rgba(255,159,10,0.15);--red:#ff453a;--blu:#0a84ff;--pur:#bf5af2;--cyn:#64d2ff;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#root{height:100%}
.pg{height:100%;display:flex;flex-direction:column}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(90px + var(--safe-b))}
.nav{padding:max(12px,var(--safe-t)) 16px 12px;background:rgba(0,0,0,0.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100;border-bottom:0.5px solid var(--sep)}
.nav-lg{padding:max(12px,var(--safe-t)) 16px 8px;background:var(--bg)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(28,28,30,0.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--sep);padding:8px 0 calc(8px + var(--safe-b));display:flex;justify-content:space-around;z-index:1000}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;background:none;border:none;color:var(--t3);font-size:10px;font-weight:500;cursor:pointer;transition:color .2s,transform .1s;position:relative}
.tab:active{transform:scale(0.95)}
.tab.on{color:var(--grn)}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab-bdg{position:absolute;top:2px;right:12px;width:8px;height:8px;background:var(--org);border-radius:50%;box-shadow:0 0 4px var(--org)}
.sec{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.5px;padding:20px 16px 10px}
.crd{background:var(--c1);border-radius:14px;margin:0 16px 12px;overflow:hidden;transition:transform .15s}
.crd:active{transform:scale(0.98)}
.crd-p{padding:16px}
.crd-r{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--sep);cursor:pointer;transition:background .15s}
.crd-r:last-child{border-bottom:none}
.crd-r:active{background:var(--c2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;transition:all .15s}
.chip.g{background:var(--grn-d);color:var(--grn)}
.chip.o{background:var(--org-d);color:var(--org)}
.chip.b{background:var(--c2);color:var(--t2)}
.chip.p{background:rgba(191,90,242,0.15);color:var(--pur)}
.chip.c{background:rgba(100,210,255,0.15);color:var(--cyn)}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(0.98);opacity:0.9}
.btn-p{background:var(--grn);color:#000}
.btn-s{background:var(--c2);color:var(--t1)}
.btn-d{background:rgba(255,69,58,0.12);color:var(--red)}
.inp{width:100%;padding:14px 16px;background:var(--c2);border:2px solid transparent;border-radius:12px;color:var(--t1);font-size:17px;font-family:inherit;outline:none;transition:all .2s}
.inp:focus{border-color:var(--blu);background:rgba(10,132,255,0.1)}
.inp.has{border-color:var(--grn);background:var(--grn-d)}
.inp::placeholder{color:var(--t3)}
.sht{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sht-bg{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sht-c{background:var(--c1);border-radius:20px 20px 0 0;max-height:90vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b);animation:slideUp .3s cubic-bezier(0.32,0.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}}
.sht-h{padding:16px 20px;border-bottom:0.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between}
.sht-bar{width:40px;height:5px;background:var(--c3);border-radius:3px;margin:10px auto 6px}
.sht-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.prg{height:8px;background:var(--c2);border-radius:4px;overflow:hidden}
.prg-f{height:100%;background:linear-gradient(90deg,var(--grn),var(--cyn));border-radius:4px;transition:width .4s cubic-bezier(0.32,0.72,0,1)}
.toast{position:fixed;top:max(70px,calc(var(--safe-t) + 60px));left:16px;right:16px;background:var(--c1);border:1px solid var(--grn);border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:3000;animation:toastIn .4s cubic-bezier(0.32,0.72,0,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(0.95)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:4000}
.superset{background:var(--c1);border-radius:16px;margin:0 16px 18px;overflow:hidden;border:2px solid var(--pur);box-shadow:0 4px 24px rgba(191,90,242,0.2)}
.superset-hdr{background:linear-gradient(135deg,rgba(191,90,242,0.25),rgba(100,210,255,0.15));padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(191,90,242,0.3)}
.superset-title{font-size:16px;font-weight:700;color:var(--pur);display:flex;align-items:center;gap:8px}
.superset-count{font-size:11px;background:var(--pur);color:#000;padding:3px 8px;border-radius:10px;font-weight:700}
.badge-eq{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--c3);color:var(--t2);font-weight:600;text-transform:uppercase}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--c1);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--sep)}
.stat-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.stat-value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.set-row{display:grid;grid-template-columns:44px 1fr 80px 70px;gap:10px;align-items:center;padding:8px 0}
.set-num{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;transition:all .2s}
.set-done{background:var(--grn);color:#000}
.set-empty{background:var(--c2);color:var(--t3)}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{padding:8px 14px;border-radius:20px;border:1.5px solid var(--sep);background:transparent;color:var(--t2);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s}
.filter-btn.on{border-color:var(--grn);background:var(--grn-d);color:var(--grn)}
</style>

const Toast=({msg,onClose})=>{
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t)},[onClose]);
  return<div className="toast"><span style={{fontSize:22}}>🎉</span><span style={{fontWeight:600,fontSize:15}}>{msg}</span></div>;
};

const Confetti=({show})=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(!show||!ref.current)return;
    const c=ref.current,ctx=c.getContext('2d');
    c.width=window.innerWidth;c.height=window.innerHeight;
    const cols=['#30d158','#ff9f0a','#0a84ff','#ff453a','#bf5af2','#64d2ff','#ffd60a'];
    const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height-c.height,vx:(Math.random()-0.5)*10,vy:Math.random()*5+3,col:cols[Math.floor(Math.random()*cols.length)],sz:Math.random()*10+5,rot:Math.random()*360,rs:(Math.random()-0.5)*15}));
    let af;const draw=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rs;p.vy+=0.12;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore()});if(ps.some(p=>p.y<c.height+60))af=requestAnimationFrame(draw)};
    draw();return()=>cancelAnimationFrame(af);
  },[show]);
  return show?<canvas ref={ref} className="confetti"/>:null;
};

const RestTimer=({onClose,def=60})=>{
  const[t,sT]=useState(def);const[run,sRun]=useState(false);const[left,sLeft]=useState(def);
  useEffect(()=>{if(!run)return;const i=setInterval(()=>sLeft(l=>l<=1?(sRun(false),vb(),t):l-1),1000);return()=>clearInterval(i)},[run,t]);
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  return<div className="sht"><div className="sht-bg" onClick={onClose}/><div className="sht-c"><div className="sht-bar"/>
  <div style={{padding:24,textAlign:'center'}}>
  <div style={{fontSize:72,fontWeight:700,fontVariantNumeric:'tabular-nums',color:run?'var(--grn)':'var(--t1)',transition:'color .3s'}}>{fmt(left)}</div>
  <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:20,flexWrap:'wrap'}}>
  {[30,45,60,90,120,180].map(p=><button key={p} onClick={()=>{sT(p);sLeft(p);vb()}} className={`chip ${t===p?'g':'b'}`} style={{border:'none',cursor:'pointer'}}>{p}s</button>)}
  </div>
  <div style={{display:'flex',gap:14,marginTop:28,justifyContent:'center'}}>
  <button className="btn btn-p" style={{width:'auto',padding:'14px 40px'}} onClick={()=>{sRun(!run);vb()}}>{run?'⏸ Pause':'▶ Start'}</button>
  <button className="btn btn-s" style={{width:'auto',padding:'14px 40px'}} onClick={()=>{sLeft(t);sRun(false);vb()}}>↺ Reset</button>
  </div></div></div></div>;
};

const SwapSheet=({muscle,onSwap,onClose})=>{
  const[search,setSearch]=useState('');const[fM,sFM]=useState(muscle||'');const[fEq,sFEq]=useState('');const[fK,sFK]=useState(false);
  const filtered=useMemo(()=>EXDB.filter(e=>{
    if(search&&!e.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(fM&&e.m!==fM)return false;
    if(fEq&&e.eq!==fEq)return false;
    if(fK&&!e.k)return false;
    return true;
  }),[search,fM,fEq,fK]);
  const grouped=useMemo(()=>{const g={};filtered.forEach(e=>{if(!g[e.m])g[e.m]=[];g[e.m].push(e)});return g},[filtered]);

  return<div className="sht"><div className="sht-bg" onClick={onClose}/><div className="sht-c" style={{maxHeight:'88vh'}}>
  <div className="sht-bar"/>

  <button className={`filter-btn ${fK?'on':''}`} onClick={()=>sFK(!fK)}>⭐ Knee-Safe</button>

  <div className="sht-sc" style={{maxHeight:'55vh'}}>
  {Object.entries(grouped).map(([m,exs])=><div key={m}>
  <div className="sec" style={{paddingTop:16}}>{m} ({exs.length})</div>
  {exs.map(e=><div key={e.id} className="crd-r" onClick={()=>{onSwap(e.id);vb();onClose()}} style={{padding:'12px 16px'}}>
  <div style={{flex:1}}>

  </div><span style={{color:'var(--t3)',fontSize:20}}>›</span>
  </div>)}
  </div>)}
  {Object.keys(grouped).length===0&&<div style={{padding:50,textAlign:'center',color:'var(--t3)'}}>No exercises found</div>}
  </div></div></div>;
};

  useEffect(()=>{setDraft(d=>({...d,[key]:sets,[key+'_n']:notes}))},[sets,notes,key,setDraft]);
  const updateSet=(i,f,v)=>{const n=[...sets];n[i]={...n[i],[f]:v};setSets(n);vb()};
  
  const handleSave=()=>{
    const maxW=Math.max(0,...sets.filter(s=>s.w).map(s=>parseFloat(s.w)||0));
    const prev=ld(`pr_${exDef.eid}`,0);
    if(maxW>prev&&maxW>0){sv(`pr_${exDef.eid}`,maxW);setToast(`New PR: ${maxW}kg on ${ex.n}!`);setConfetti(true);setTimeout(()=>setConfetti(false),3500)}
    onSave(exDef,sets,notes,false);vb()};
  const handleSwap=newEid=>{onSave({...exDef,eid:newEid},sets,notes,true)};
  
  const avgW=sets.filter(s=>s.w).length?Math.round(sets.filter(s=>s.w).reduce((a,s)=>a+parseFloat(s.w),0)/sets.filter(s=>s.w).length*10)/10:0;
  const maxW=Math.max(0,...sets.map(s=>parseFloat(s.w)||0));
  const totalR=sets.reduce((a,s)=>a+(parseInt(s.r)||0),0);

  <div style={{textAlign:'center',marginBottom:24}}>

  <div style={{fontSize:32}}>{day.icon}</div>

  {exDef.star&&<div style={{marginTop:10}}><span className="chip g">⭐ Knee Rehab Priority</span></div>}
  {prevPR>0&&<div style={{marginTop:10}}><span className="chip o">🏆 PR: {prevPR}kg</span></div>}
  </div>
  
  {(()=>{const prevData=ld('workoutData',{});const prevKey=Object.keys(prevData).find(k=>k.includes('_'+exDef.eid+'_'));const prevSets=prevKey?prevData[prevKey]?.sets:null;

  useEffect(()=>{sv(`dayEx_${ph.id}_${day.id}`,dayEx)},[dayEx,ph.id,day.id]);

  const handleSaveEx=(exDef,sets,notes,isSwap)=>{

    let ns=strk;if(last===yest)ns=strk+1;else if(last!==today)ns=1;sStrk(ns);sv('streak',ns);sv('lastWorkout',today);
    const h={date:new Date().toISOString(),day:day.n,phase:ph.n,duration:wkTimer,exercises:dayEx.length};

  <div style={{padding:'0 16px 20px'}}>
  <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--t2)',marginBottom:8,fontWeight:500}}><span>Progress</span><span>{compCnt}/{dayEx.length} complete</span></div>

  {id:'settings',l:'Settings',ic:<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>}

};
