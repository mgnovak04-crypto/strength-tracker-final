ar(--text-secondary)' }}>{pr || '—'}<span style={{ fontSize: '12px', fontWeight: '400' }}> kg</span></div></Card>); })}</div></div></div>); };

        const SettingsTab = ({ currentPhase, setCurrentPhase, currentWeek, setCurrentWeek, darkMode, setDarkMode }) => { const handleExport = () => { const data = { workoutData: loadData('workoutData', {}), workoutHistory: loadData('workoutHistory', []), currentPhase, currentWeek, exportDate: new Date().toISOString(), version: '5.1-knee-safe' }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `strength-tracker-knee-safe-${new Date().toISOString().split('T')[0]}.json`; a.click(); }; const handleImport = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (event) => { try { const data = JSON.parse(event.target.result); if (data.workoutData) saveData('workoutData', migrateWorkoutData(data.workoutData)); if (data.workoutHistory) saveData('workoutHistory', data.workoutHistory); if (data.currentPhase) saveData('currentPhase', data.currentPhase); if (data.currentWeek) saveData('currentWeek', data.currentWeek); alert('Data imported! Refreshing...'); window.location.reload(); } catch { alert('Error importing data.'); } }; reader.readAsText(file); } }; return (<div><Header title="Settings" /><div style={{ padding: '16px', paddingBottom: '100px' }}><div style={{ display: 'flex', height: '6px', borderRadius: '3px', overflow: 'hidden', marginBottom: '16px' }}><div style={{ flex: 1, background: '#169B62' }}></div><div style={{ flex: 1, background: '#FFFFFF' }}></div><div style={{ flex: 1, background: '#FF883E' }}></div></div><Card style={{ background: 'linear-gradient(135deg, var(--success)22 0%, var(--bg-card) 100%)', borderColor: 'var(--success)' }}><h3 style={{ margin: '0 0 12px', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-shield-heart" style={{ color: 'var(--success)' }}></i>Knee-Safe Principles</h3><ul style={{ margin: 0, paddingLeft: '20px', fontSize: '13px', color: 'var(--text-secondary)', lineHeight: '1.8' }}><li><strong>Hip hinge over knee bend</strong> - RDLs, hip thrusts are primary</li><li><strong>Open chain leg work</strong> - Leg curls, straight leg raises</li><li><strong>TKE every lower day</strong> - Strengthens VMO safely</li><li><strong>Zero deep squats</strong> - No wall sits, no leg press</li><li><strong>Stop if pain</strong> - Sharp knee pain = stop immediately</li></ul></Card><Card><h3 style={{ margin: '0 0 16px', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-calendar" style={{ color: 'var(--primary)' }}></i>Current Program</h3><div style={{ marginBottom: '16px' }}><label style={{ display: 'block', marginBottom: '8px', fontWeight: '500', fontSize: '14px' }}>Phase</label><select value={currentPhase} onChange={(e) => { const val = parseInt(e.target.value); setCurrentPhase(val); saveData('currentPhase', val); }} style={{ width: '100%', padding: '12px', fontSize: '16px', borderRadius: '10px', border: '1px solid var(--border)', background: 'var(--bg-card-light)', color: 'var(--text-primary)' }}>{phases.map(p => <option key={p.id} value={p.id}>Phase {p.id}: {p.name} ({p.months})</option>)}</select></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '500', fontSize: '14px' }}>Week (1-12)</label><input type="number" min="1" max="12" value={currentWeek} onChange={(e) => { const val = Math.min(12, Math.max(1, parseInt(e.target.value) || 1)); setCurrentWeek(val); saveData('currentWeek', val); }} style={{ width: '100%', padding: '12px', fontSize: '16px', borderRadius: '10px', border: '1px solid var(--border)', background: 'var(--bg-card-light)', color: 'var(--text-primary)' }} /></div></Card><Card><div onClick={() => { const newMode = !darkMode; setDarkMode(newMode); saveData('darkMode', newMode); document.body.classList.toggle('light-mode', !newMode); }} className="haptic" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}><span><i className="fa-solid fa-moon" style={{ marginRight: '8px' }}></i>Dark Mode</span><div style={{ width: '50px', height: '28px', background: darkMode ? 'var(--primary)' : 'var(--border)', borderRadius: '14px', position: 'relative', transition: 'background 0.3s' }}><div style={{ width: '24px', height: '24px', background: 'white', borderRadius: '50%', position: 'absolute', top: '2px', left: darkMode ? '24px' : '2px', transition: 'left 0.3s' }} /></div></div></Card><Card><h3 style={{ margin: '0 0 16px', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-database" style={{ color: 'var(--success)' }}></i>Data</h3><button onClick={handleExport} className="haptic" style={{ width: '100%', padding: '14px', background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', marginBottom: '10px', cursor: 'pointer' }}><i className="fa-solid fa-download"></i> Export Backup</button><label className="haptic" style={{ display: 'flex', width: '100%', padding: '14px', background: 'var(--bg-card-light)', color: 'var(--text-primary)', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', marginBottom: '10px', cursor: 'pointer', alignItems: 'center', justifyContent: 'center', gap: '8px' }}><i className="fa-solid fa-upload"></i> Import Backup<input type="file" accept=".json" onChange={handleImport} style={{ display: 'none' }} /></label><button onClick={() => { if (confirm('Delete ALL data?')) { localStorage.clear(); window.location.reload(); }}} className="haptic" style={{ width: '100%', padding: '14px', background: 'var(--accent)', color: 'white', border: 'none', borderRadius: '10px', fontSize: '15px', fontWeight: '600', cursor: 'pointer' }}><i className="fa-solid fa-trash"></i> Clear All Data</button></Card><div style={{ textAlign: 'center', marginTop: '20px', color: 'var(--text-secondary)', fontSize: '12px' }}>☘️ Knee-Safe Strength v5.1 🇮🇪<br/>Zero patellofemoral compression</div></div></div>); };

        const App = () => { const [activeTab, setActiveTab] = useState('workout'); const [currentPhase, setCurrentPhase] = useState(() => loadData('currentPhase', 1)); const [currentWeek, setCurrentWeek] = useState(() => loadData('currentWeek', 1)); const [workoutData, setWorkoutData] = useState(() => migrateWorkoutData(loadData('workoutData', {}))); const [workoutHistory, setWorkoutHistory] = useState(() => loadData('workoutHistory', [])); const [darkMode, setDarkMode] = useState(() => loadData('darkMode', true)); useEffect(() => { document.body.classList.toggle('light-mode', !darkMode); }, []); return (<div style={{ paddingBottom: '80px' }}>{activeTab === 'workout' && <WorkoutTab currentPhase={currentPhase} currentWeek={currentWeek} workoutData={workoutData} setWorkoutData={setWorkoutData} workoutHistory={workoutHistory} setWorkoutHistory={setWorkoutHistory} />}{activeTab === 'progress' && <ProgressTab workoutData={workoutData} workoutHistory={workoutHistory} />}{activeTab === 'settings' && <SettingsTab currentPhase={currentPhase} setCurrentPhase={setCurrentPhase} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} darkMode={darkMode} setDarkMode={setDarkMode} />}<TabBar activeTab={activeTab} setActiveTab={setActiveTab} /></div>); };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
