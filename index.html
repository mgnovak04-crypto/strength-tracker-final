<style>
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--sep:rgba(84,84,88,0.65);--t1:#fff;--t2:rgba(235,235,245,0.6);--t3:rgba(235,235,245,0.3);--grn:#30d158;--grn-d:rgba(48,209,88,0.15);--org:#ff9f0a;--org-d:rgba(255,159,10,0.15);--red:#ff453a;--red-d:rgba(255,69,58,0.15);--blu:#0a84ff;--pur:#bf5af2;--cyn:#64d2ff;--yel:#ffd60a;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,system-ui,'SF Pro Display',sans-serif;-webkit-font-smoothing:antialiased}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(90px + var(--safe-b)) 16px}
.hdr{padding:max(12px,var(--safe-t)) 16px 12px;background:rgba(0,0,0,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.hdr p{font-size:13px;color:var(--t2);margin-top:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(30,30,30,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--sep);padding:6px 0 calc(6px + var(--safe-b));display:flex;z-index:200}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:none;border:none;color:var(--t3);font-size:10px;font-family:inherit;cursor:pointer;transition:color .2s}
.tab.on{color:var(--grn)}
.tab svg{width:22px;height:22px}
.card{background:var(--c1);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.card-h h3{font-size:17px;font-weight:600}
.card-h .sub{font-size:13px;color:var(--t2);margin-top:2px}
.card-h .icon{font-size:24px;margin-right:12px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-g{background:var(--grn-d);color:var(--grn)}
.badge-o{background:var(--org-d);color:var(--org)}
.badge-b{background:rgba(10,132,255,0.15);color:var(--blu)}
.badge-p{background:rgba(191,90,242,0.15);color:var(--pur)}
.ss{border-top:0.5px solid var(--sep);padding:12px 16px}
.ss-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ss-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ss-type{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600}
.ex-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid rgba(84,84,88,0.3)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-size:15px;font-weight:500;flex:1}
.ex-info{font-size:13px;color:var(--t2)}
.ex-tag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.tag-k{background:var(--grn-d);color:var(--grn)}
.tag-e{background:rgba(100,210,255,0.15);color:var(--cyn)}
.tag-p{background:rgba(255,69,58,0.15);color:var(--red)}
.tag-b{background:rgba(255,214,10,0.15);color:var(--yel)}
.tag-t{background:rgba(191,90,242,0.15);color:var(--pur)}
.tag-f{background:var(--org-d);color:var(--org)}
.log-area{padding:12px 16px;border-top:0.5px solid var(--sep)}

.set-num{width:28px;height:28px;border-radius:8px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--t2);flex-shrink:0}

.sht-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.stat-card .lbl{font-size:12px;color:var(--t2);margin-top:2px}
.hist-item{background:var(--c1);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}

.section-t{font-size:20px;font-weight:700;margin:20px 0 12px;letter-spacing:-0.3px}
.focus-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:6px}
/* REST TIMER */
.rest-overlay{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px)}
.rest-ring{position:relative;width:200px;height:200px}
.rest-ring svg{transform:rotate(-90deg)}
.rest-ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest-ring .time .big{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.rest-ring .time .small{font-size:14px;color:var(--t2);margin-top:4px}
.rest-btns{display:flex;gap:12px;margin-top:32px}
.rest-btn{padding:12px 24px;border-radius:12px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
/* WEIGHT CHART */
.wt-chart{background:var(--c1);border-radius:12px;padding:16px;margin-bottom:12px}
.wt-spark{display:flex;align-items:flex-end;gap:3px;height:60px}
.wt-bar{flex:1;border-radius:3px 3px 0 0;min-width:6px;transition:height .3s}
/* SESSION TIMER */
.session-timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--org)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.cal-label{font-size:10px;color:var(--t3);text-align:center;padding-bottom:2px}

.pain-row{display:flex;gap:4px;align-items:center}

.rpe-row{display:flex;gap:4px;margin:8px 0}
.rpe-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--c3);background:none;color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.rpe-btn.on{border-color:var(--org);background:var(--org-d);color:var(--org)}

.mini-chart{display:flex;align-items:flex-end;gap:2px;height:40px}
.mini-bar{flex:1;border-radius:2px 2px 0 0;min-width:4px;transition:height .3s}
/* READINESS */
.readiness-row{display:flex;gap:12px;margin:8px 0}
.readiness-item{flex:1;text-align:center}
.readiness-item .emoji-row{display:flex;justify-content:center;gap:4px;margin-top:4px}
.readiness-emoji{font-size:20px;cursor:pointer;opacity:0.3;transition:opacity .2s}
.readiness-emoji.on{opacity:1}
/* RUNNING LOG */
.run-stat{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.run-stat .val{font-size:18px;font-weight:700}
.run-stat .lbl{font-size:11px;color:var(--t2)}
/* GOAL PROGRESS */
.goal-bar{height:12px;background:var(--c2);border-radius:6px;overflow:hidden;position:relative}
.goal-fill{height:100%;border-radius:6px;transition:width .5s}
.goal-marker{position:absolute;top:-2px;width:2px;height:16px;background:var(--t1);border-radius:1px}
/* MILESTONE */
.ms-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--sep)}
.ms-item:last-child{border-bottom:none}
.ms-check{width:24px;height:24px;border-radius:12px;border:2px solid var(--c3);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;transition:all .2s}
.ms-check.done{border-color:var(--grn);background:var(--grn);color:#000}
/* CORRELATION CHART */
.corr-chart{position:relative;height:80px;display:flex;align-items:flex-end;gap:2px}
.corr-bar{display:flex;flex-direction:column;align-items:center;flex:1;gap:1px}
.corr-bar .top{border-radius:2px 2px 0 0;width:100%;min-width:3px}
.corr-bar .bot{border-radius:0 0 2px 2px;width:100%;min-width:3px}
</style>

// === SERVICE WORKER (inline registration for offline PWA) ===
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='ironclad-v16';
    const ASSETS=['/'];
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
    self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(fetch(e.request).then(r=>{if(r.ok){const rc=r.clone();caches.open(CACHE).then(c=>c.put(e.request,rc))}return r}).catch(()=>caches.match(e.request)));
    });
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>

const Toast=({msg,onClose})=>{
  useEffect(()=>{const t=setTimeout(onClose,2500);return()=>clearTimeout(t)},[onClose]);
  return <div className="toast">{msg}</div>;
};

// === REST TIMER ===
const RestTimer=({seconds,onDone,onSkip})=>{
  const[left,setLeft]=useState(seconds);
  const total=seconds;
  useEffect(()=>{
    if(left<=0){vb();vb();onDone();return}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[left,onDone]);

  const pct=(left/total)*100;
  const r=90;const circ=2*Math.PI*r;const offset=circ*(1-left/total);
  const color=left<=5?'var(--red)':left<=15?'var(--org)':'var(--grn)';

  return(
    <div className="rest-overlay" onClick={e=>e.target===e.currentTarget&&onSkip()}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{fontSize:14,color:'var(--t2)',marginBottom:16,fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>Rest</div>
        <div className="rest-ring">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r={r} fill="none" stroke="var(--c2)" strokeWidth="8"/>
            <circle cx="100" cy="100" r={r} fill="none" stroke={color} strokeWidth="8"
              strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={offset}
              style={{transition:'stroke-dashoffset 1s linear, stroke 0.3s'}}/>
          </svg>
          <div className="time">
            <div className="big" style={{color}}>{left}</div>
            <div className="small">seconds</div>
          </div>
        </div>
        <div className="rest-btns">
          <button className="rest-btn" style={{background:'var(--c2)',color:'var(--t1)'}} onClick={onSkip}>Skip</button>
          <button className="rest-btn" style={{background:color,color:'#000'}} onClick={()=>setLeft(l=>l+15)}>+15s</button>
        </div>
      </div>
    </div>
  );
};

// === SESSION TIMER ===
const useSessionTimer=()=>{
  const[elapsed,setElapsed]=useState(0);
  const[running,setRunning]=useState(false);
  const startRef=useRef(null);
  const intervalRef=useRef(null);

  const start=useCallback(()=>{
    if(!running){
      startRef.current=Date.now()-elapsed*1000;
      setRunning(true);
    }
  },[running,elapsed]);

  const stop=useCallback(()=>{setRunning(false)},[]);

  useEffect(()=>{
    if(running){
      intervalRef.current=setInterval(()=>{
        setElapsed(Math.floor((Date.now()-startRef.current)/1000));
      },1000);
    }
    return()=>clearInterval(intervalRef.current);
  },[running]);

  return{elapsed,running,start,stop,fmtElapsed:fmtTime(elapsed)};
};

        {[{label:'Sleep',opts:sleepOpts,val:sleep,set:setSleep},{label:'Soreness',opts:sorenessOpts,val:soreness,set:setSoreness},{label:'Energy',opts:energyOpts,val:energy,set:setEnergy},{label:'Mood',opts:moodOpts,val:mood,set:setMood}].map(item=>(
          <div key={item.label} className="readiness-item">

// === 1RM ESTIMATOR (Brzycki formula) ===
const est1RM=(weight,reps)=>{
  const w=parseFloat(weight);const r=parseInt(reps);
  if(!w||!r||r<1||r>30)return null;
  if(r===1)return w;
  return Math.round(w*(36/(37-r)));
};

// === COUNTDOWN TIMER (for duration exercises) ===
const CountdownTimer=({targetSec})=>{
  const[left,setLeft]=useState(targetSec||0);
  const[active,setActive]=useState(false);
  const[started,setStarted]=useState(false);

  useEffect(()=>{
    if(!active||left<=0){if(left<=0&&started){vb();vb();setActive(false)}return}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[active,left,started]);

  const toggle=()=>{
    if(!started){setLeft(targetSec);setStarted(true);setActive(true)}
    else if(active){setActive(false)}
    else{setActive(true)}
  };
  const reset=()=>{setLeft(targetSec);setActive(false);setStarted(false)};
  const done=left<=0&&started;

  return(
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <div className="cd-timer" onClick={toggle} style={{background:done?'var(--grn-d)':active?'var(--org-d)':'var(--c2)',color:done?'var(--grn)':active?'var(--org)':'var(--t2)'}}>
        {done?'Done':active?fmtTime(left):started?fmtTime(left):`${targetSec}s`}
        {!done&&<span style={{fontSize:10}}>{active?'⏸':'▶'}</span>}
      </div>
      {started&&<span onClick={reset} style={{fontSize:12,color:'var(--t3)',cursor:'pointer'}}>↺</span>}
    </div>
  );
};

// === PR TRACKER ===
const getPR=(eid)=>{
  const prs=ld('prs',{});
  return prs[eid]||null;
};
const checkAndSavePR=(eid,weight)=>{
  if(!weight||isNaN(parseFloat(weight)))return false;
  const w=parseFloat(weight);
  const prs=ld('prs',{});
  const prev=prs[eid]||0;
  if(w>prev){prs[eid]=w;sv('prs',prs);return true}
  return false;
};

// === EXERCISE HISTORY ===
const getExHistory=(eid)=>{
  const hist=ld('exHistory',{});
  return(hist[eid]||[]).slice(-10);
};
const saveExHistory=(eid,sets)=>{
  const hist=ld('exHistory',{});
  if(!hist[eid])hist[eid]=[];
  const entry={date:new Date().toISOString(),sets:sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r}))};
  if(entry.sets.length>0){hist[eid].push(entry);if(hist[eid].length>20)hist[eid]=hist[eid].slice(-20);sv('exHistory',hist)}
};

// === SET LOGGER ===
const SetLogger=({exDef,dayId,ssIdx,exIdx,phase,onSetDone,onPR})=>{
  const ex=getEx(exDef.eid);
  const sets=exDef.s||3;
  const isWeight=ex.t==='w';
  const isDuration=ex.t==='d';
  const logKey=`log_p${phase||1}_${dayId}_${ssIdx}_${exIdx}`;
  const prevHistory=getExHistory(exDef.eid);
  const lastSession=prevHistory.length>0?prevHistory[prevHistory.length-1]:null;
  const currentPR=getPR(exDef.eid);
  const[vals,setVals]=useState(()=>{
    const saved=ld(logKey,[]);
    return Array.from({length:sets},(_,i)=>saved[i]||{w:'',r:'',done:false});
  });

  const update=(si,field,val)=>{
    const nv=[...vals];
    nv[si]={...nv[si],[field]:val};
    setVals(nv);
    sv(logKey,nv);
  };

  const markDone=(si)=>{
    const nv=[...vals];
    const wasDone=nv[si].done;
    nv[si]={...nv[si],done:!nv[si].done};
    setVals(nv);
    sv(logKey,nv);
    vb();
    if(!wasDone){
      if(isWeight&&!nv[si].warmup&&checkAndSavePR(exDef.eid,nv[si].w)&&onPR){onPR(ex.n,nv[si].w)}
      saveExHistory(exDef.eid,nv.filter(s=>!s.warmup));
      if(onSetDone) onSetDone();
    }
  };

  const quickFill=()=>{
    if(!lastSession)return;
    const nv=[...vals];
    lastSession.sets.forEach((s,i)=>{if(i<nv.length&&!nv[i].done){nv[i]={...nv[i],w:s.w||'',r:s.r||''}}});
    setVals(nv);sv(logKey,nv);vb();
  };

  const toggleWarmup=(si)=>{
    const nv=[...vals];
    nv[si]={...nv[si],warmup:!nv[si].warmup};
    setVals(nv);sv(logKey,nv);vb();
  };

  const completed=vals.filter(v=>v.done).length;
  const workingSets=vals.filter(v=>!v.warmup);
  const best1RM=isWeight?workingSets.reduce((best,v)=>{if(!v.w||!v.r)return best;const e=est1RM(v.w,parseInt(v.r)||0);return e&&e>best?e:best},0):0;

  return(
    <div className="log-area">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:13,color:'var(--t2)'}}>{completed}/{sets} sets</span>
          {isWeight&&currentPR&&<span style={{fontSize:11,color:'var(--yel)',fontWeight:600}}>PR: {currentPR}kg</span>}
          {isWeight&&best1RM>0&&<span style={{fontSize:11,color:'var(--cyn)',fontWeight:600}}>~1RM: {best1RM}kg</span>}
        </div>
        {ex.note&&<div style={{fontSize:11,color:'var(--t3)',maxWidth:'50%',textAlign:'right'}}>{ex.note}</div>}
      </div>
      {lastSession&&<div style={{fontSize:11,color:'var(--t3)',marginBottom:8,padding:'6px 8px',background:'var(--c2)',borderRadius:6,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>Last: {lastSession.sets.map((s,i)=>`${s.w?s.w+'kg×':''}${s.r}`).join(' / ')}</span>
        <button onClick={quickFill} style={{background:'none',border:'1px solid var(--c3)',borderRadius:6,color:'var(--grn)',fontSize:10,fontWeight:600,padding:'2px 8px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap',marginLeft:8}}>Fill</button>
      </div>}
      {vals.map((v,si)=>(
        <div key={si} className="set-row">
          <div className="set-num" onClick={()=>{if(isWeight)toggleWarmup(si)}} style={v.done?{background:'var(--grn-d)',color:'var(--grn)'}:v.warmup?{background:'var(--org-d)',color:'var(--org)',fontSize:9,cursor:'pointer'}:{cursor:isWeight?'pointer':'default'}} title={isWeight?'Tap to toggle warm-up':''}>{v.warmup?'W':si+1}</div>
          {isWeight&&<input className={`inp${v.w?' done':''}`} placeholder={lastSession?.sets[si]?.w?`${lastSession.sets[si].w}`:'kg'} type="number" inputMode="decimal" value={v.w} onChange={e=>update(si,'w',e.target.value)} style={{maxWidth:80,opacity:v.warmup?0.6:1}}/>}
          <input className={`inp${v.r?' done':''}`} placeholder={lastSession?.sets[si]?.r?`${lastSession.sets[si].r}`:(isDuration?'sec':'reps')} type={isDuration?'number':'text'} inputMode={isDuration?'numeric':'text'} value={v.r} onChange={e=>update(si,'r',e.target.value)} style={{maxWidth:isWeight?80:120,opacity:v.warmup?0.6:1}}/>
          {isDuration&&<CountdownTimer targetSec={parseInt(exDef.r)||30}/>}
          <button onClick={()=>markDone(si)} style={{width:40,height:40,borderRadius:10,border:'none',background:v.done?v.warmup?'var(--org)':'var(--grn)':'var(--c2)',color:v.done?'#000':'var(--t3)',fontSize:18,cursor:'pointer',flexShrink:0}}>✓</button>
        </div>
      ))}
    </div>
  );
};

// === DAY VIEW ===
const DayView=({day,phase,onBack})=>{
  const[showRest,setShowRest]=useState(null);
  const[restTime,setRestTime]=useState(()=>ld('restTime',PHASES_META.find(p=>p.id===phase)?.restDefault||60));
  const[restEnabled,setRestEnabled]=useState(()=>ld('restEnabled',true));
  const[toast,setToast]=useState('');
  const[note,setNote]=useState('');
  const[kneePain,setKneePain]=useState(null);
  const[rpe,setRpe]=useState(null);
  const[showComplete,setShowComplete]=useState(false);
  const[tick,setTick]=useState(0);
  const session=useSessionTimer();

  useEffect(()=>{session.start()},[]);

  const totalEx=day.supersets.reduce((a,ss)=>a+ss.ex.length,0);
  const completed=day.supersets.reduce((a,ss,si)=>a+ss.ex.reduce((b,ex,ei)=>{
    const saved=ld(`log_p${phase}_${day.id}_${si}_${ei}`,[]);
    return b+(saved.filter(s=>s.done).length>0?1:0);
  },0),0);
  const pct=Math.round((completed/totalEx)*100);
  const pMeta=PHASES_META.find(p=>p.id===phase);

  // Per-superset completion
  const ssCompletion=day.supersets.map((ss,si)=>{
    const done=ss.ex.reduce((b,ex,ei)=>{
      const saved=ld(`log_p${phase}_${day.id}_${si}_${ei}`,[]);
      return b+(saved.filter(s=>s.done).length>0?1:0);
    },0);
    return{done,total:ss.ex.length};
  });

  // Volume calculation
  const totalVolume=day.supersets.reduce((vol,ss,si)=>vol+ss.ex.reduce((v,exDef,ei)=>{
    const saved=ld(`log_p${phase}_${day.id}_${si}_${ei}`,[]);
    return v+saved.filter(s=>s.done&&s.w&&s.r).reduce((sv2,s)=>sv2+(parseFloat(s.w)||0)*(parseInt(s.r)||0),0);
  },0),0);

  const handleSetDone=(ssRest)=>{
    session.start();
    setTick(t=>t+1);
    const t=ssRest||restTime;
    if(restEnabled&&t>0) setShowRest(t);
  };

  const handlePR=(name,weight)=>{
    setToast(`New PR! ${name}: ${weight}kg`);
    vb();vb();
  };

  const toggleRest=()=>{
    const next=!restEnabled;
    setRestEnabled(next);
    sv('restEnabled',next);
    setToast(next?'Rest timer ON':'Rest timer OFF');
    vb();
  };

  const[lastCalories,setLastCalories]=useState(0);
  const saveWorkout=()=>{
    session.stop();
    const ts=new Date().toISOString();
    const bw=ld('bodyweight',80);
    const calories=estCalories(session.elapsed,totalVolume,parseFloat(bw)||80);
    setLastCalories(calories);
    const hist=ld('history',[]);
    hist.push({day:day.n,date:ts,completed,total:totalEx,duration:session.elapsed,note:note||undefined,volume:totalVolume||undefined,kneePain:kneePain!=null?kneePain:undefined,rpe:rpe||undefined,calories});
    sv('history',hist);
    vb();
    setShowComplete(true);

  );
};

// === WORKOUT TAB ===
const WorkoutTab=()=>{
  const[activeDay,setActiveDay]=useState(null);
  const[phase,setPhase]=useState(ld('phase',1));
  const[toast,setToast]=useState('');
  const[tick,setTick]=useState(0);
  const days=getProgramDays(phase);
  const pMeta=PHASES_META.find(p=>p.id===phase);

  const resetDay=(dayId,e)=>{
    e.stopPropagation();
    if(!confirm(`Reset Day ${dayId} for a new week? This clears all logged sets for this day.`))return;
    const day=days.find(d=>d.id===dayId);
    if(!day)return;
    day.supersets.forEach((ss,si)=>ss.ex.forEach((ex,ei)=>{
      localStorage.removeItem('ic15_log_p'+phase+'_'+dayId+'_'+si+'_'+ei);
    }));
    setTick(t=>t+1);
    setToast(`Day ${dayId} reset`);
    vb();
  };

  const resetAllDays=()=>{
    if(!confirm('Reset ALL days for a new week? This clears all logged sets for the current phase.'))return;
    days.forEach(day=>day.supersets.forEach((ss,si)=>ss.ex.forEach((ex,ei)=>{
      localStorage.removeItem('ic15_log_p'+phase+'_'+day.id+'_'+si+'_'+ei);
    })));
    setTick(t=>t+1);
    setToast('All days reset for new week');
    vb();
  };

  if(activeDay) return <DayView day={activeDay} phase={phase} onBack={()=>setActiveDay(null)}/>;

  return(
    <>
      <div className="hdr">
        <h1>IronClad Pro</h1>
        <p>v16.0 · Trail Runner Recovery · 3-Day Program</p>
      </div>
      <div className="scroll">
        <div className="section-t">Phase</div>
        <div className="phase-sel">
          {PHASES_META.map(p=>(
            <button key={p.id} className={`phase-btn${phase===p.id?' on':''}`} onClick={()=>{setPhase(p.id);sv('phase',p.id);vb()}}>
              {p.icon} {p.n}
            </button>
          ))}
        </div>
        {pMeta&&<div className="card" style={{padding:14,marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{pMeta.icon} {pMeta.n} <span style={{fontWeight:400,color:'var(--t2)',fontSize:13}}>— {pMeta.wks}</span></div>
          <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.5}}>{pMeta.d}</div>
        </div>}

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div className="section-t">Workouts</div>
          <button onClick={resetAllDays} style={{background:'none',border:'1px solid var(--c3)',borderRadius:8,color:'var(--org)',fontSize:12,fontWeight:600,padding:'4px 10px',cursor:'pointer',fontFamily:'inherit'}}>↺ New Week</button>
        </div>
        {days.map(day=>{
          const totalEx=day.supersets.reduce((a,ss)=>a+ss.ex.length,0);
          const completed=day.supersets.reduce((a,ss,si)=>a+ss.ex.reduce((b,ex,ei)=>{
            const saved=ld(`log_p${phase}_${day.id}_${si}_${ei}`,[]);
            return b+(saved.filter(s=>s.done).length>0?1:0);
          },0),0);
          const pct=Math.round((completed/totalEx)*100);
          return(
            <div key={day.id} className="card" onClick={()=>{setActiveDay(day);vb()}} style={{cursor:'pointer'}}>
              <div className="card-h">
                <div style={{display:'flex',alignItems:'center'}}>
                  <span className="icon">{day.icon}</span>
                  <div>
                    <h3>Day {day.id}: {day.n}</h3>
                    <div className="sub">{day.supersets.length} supersets · {totalEx} exercises</div>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {pct>0&&<button onClick={(e)=>resetDay(day.id,e)} style={{background:'none',border:'none',color:'var(--t3)',fontSize:14,cursor:'pointer',padding:4}} title="Reset day">↺</button>}
                  <span className={`badge ${pct===100?'badge-g':pct>0?'badge-o':'badge-b'}`}>{pct}%</span>
                </div>
              </div>
              <div style={{padding:'0 16px 12px'}}><div className="prg"><div className="prg-f" style={{width:`${pct}%`}}/></div></div>
            </div>
          );
        })}

        <div className="section-t" style={{marginTop:24}}>Program Focus</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div><span className="ex-tag tag-t" style={{fontSize:12}}>Trainer Rx</span><div style={{fontSize:13,color:'var(--t2)',marginTop:4}}>Your trainer's prescribed exercises on Leg Day</div></div>
            <div><span className="ex-tag tag-e" style={{fontSize:12}}>Eccentric</span><div style={{fontSize:13,color:'var(--t2)',marginTop:4}}>Slow lowering to rebuild knee cartilage tolerance</div></div>
            <div><span className="ex-tag tag-p" style={{fontSize:12}}>Power</span><div style={{fontSize:13,color:'var(--t2)',marginTop:4}}>Explosive movements for trail running</div></div>
            <div><span className="ex-tag tag-b" style={{fontSize:12}}>Balance</span><div style={{fontSize:13,color:'var(--t2)',marginTop:4}}>Single-leg & stability for better landing</div></div>
          </div>
        </div>
      </div>
      {toast&&<Toast msg={toast} onClose={()=>setToast('')}/>}
    </>
  );
};

// === PROGRESS TAB ===
const ProgressTab=()=>{
  const[hist,setHist]=useState(()=>ld('history',[]));
  const[showAll,setShowAll]=useState(false);
  const[prView,setPrView]=useState(false);
  const[showLiftChart,setShowLiftChart]=useState(null);
  const[tick,setTick]=useState(0);
  const weightLog=ld('weightLog',[]);
  const prs=ld('prs',{});
  const exHistory=ld('exHistory',{});
  const runs=ld('runLog',[]);
  const totalWorkouts=hist.length;
  const thisWeek=hist.filter(h=>{const d=new Date(h.date);const now=new Date();const diff=(now-d)/(1000*60*60*24);return diff<=7}).length;
  const streak=(()=>{let s=0;const sorted=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date));let lastDate=new Date();for(const h of sorted){const d=new Date(h.date);const diff=Math.floor((lastDate-d)/(1000*60*60*24));if(diff<=1){s++;lastDate=d}else break}return s})();
  const avgDuration=hist.length>0?Math.round(hist.filter(h=>h.duration).reduce((a,h)=>a+(h.duration||0),0)/Math.max(1,hist.filter(h=>h.duration).length)):0;
  const lastWeight=weightLog.length>0?weightLog[weightLog.length-1].w:'—';
  const firstWeight=weightLog.length>1?weightLog[0].w:null;
  const weightDiff=firstWeight&&lastWeight!=='—'?(lastWeight-firstWeight).toFixed(1):null;

  const deleteHistEntry=(idx)=>{
    const realIdx=hist.length-1-idx;
    if(!confirm('Delete this workout entry?'))return;
    const nh=[...hist];nh.splice(realIdx,1);setHist(nh);sv('history',nh);
  };

  // Knee pain trend
  const painData=hist.filter(h=>h.kneePain!=null).slice(-15);
  const avgPain=painData.length>0?Math.round(painData.reduce((a,h)=>a+h.kneePain,0)/painData.length*10)/10:null;
  const recentPain=painData.length>0?painData[painData.length-1].kneePain:null;
  const painTrend=painData.length>=3?(painData.slice(-3).reduce((a,h)=>a+h.kneePain,0)/3-painData.slice(0,3).reduce((a,h)=>a+h.kneePain,0)/3):null;

  // RPE trend
  const rpeData=hist.filter(h=>h.rpe).slice(-10);
  const avgRpe=rpeData.length>0?Math.round(rpeData.reduce((a,h)=>a+h.rpe,0)/rpeData.length*10)/10:null;

  // Running stats
  const weekRuns=runs.filter(r=>(new Date()-new Date(r.date))/(1000*60*60*24)<=7);
  const weekRunDist=weekRuns.reduce((a,r)=>a+(r.dist||0),0);
  const totalRunDist=runs.reduce((a,r)=>a+(r.dist||0),0);

  // Key lift progression (exercises with history)
  const liftProgressions=Object.entries(exHistory).filter(([eid,h])=>{
    const ex=getEx(eid);return ex.t==='w'&&h.length>=2;
  }).map(([eid,h])=>{
    const ex=getEx(eid);
    const entries=h.slice(-12).map(e=>{const maxW=Math.max(...e.sets.map(s=>parseFloat(s.w)||0));return{date:e.date,w:maxW}}).filter(e=>e.w>0);
    return{eid,ex,entries};
  }).filter(l=>l.entries.length>=2).sort((a,b)=>b.entries.length-a.entries.length);

  // Muscle group volume from exercise history
  const weekHist=hist.filter(h=>(new Date()-new Date(h.date))/(1000*60*60*24)<=7);
  const muscleVolume={};
  Object.entries(exHistory).forEach(([eid,sessions])=>{
    const ex=getEx(eid);
    const weekSessions=sessions.filter(s=>(new Date()-new Date(s.date))/(1000*60*60*24)<=7);
    weekSessions.forEach(s=>{
      const vol=s.sets.reduce((a,set)=>a+(parseFloat(set.w)||0)*(parseInt(set.r)||1),0);
      const sets=s.sets.length;
      if(!muscleVolume[ex.m])muscleVolume[ex.m]={volume:0,sets:0};
      muscleVolume[ex.m].volume+=vol;
      muscleVolume[ex.m].sets+=sets;
    });
  });
  const mvEntries=Object.entries(muscleVolume).sort((a,b)=>b[1].volume-a[1].volume);
  const maxMV=mvEntries.length>0?mvEntries[0][1].volume:1;

  // PR list
  const prList=Object.entries(prs).map(([eid,w])=>({ex:getEx(eid),w})).filter(p=>p.ex.n!=='Unknown').sort((a,b)=>b.w-a.w);

  // Sparkline
  const sparkData=weightLog.slice(-20);
  const sparkMin=sparkData.length?Math.min(...sparkData.map(d=>d.w)):0;
  const sparkMax=sparkData.length?Math.max(...sparkData.map(d=>d.w)):100;
  const sparkRange=sparkMax-sparkMin||1;

  // Readiness data
  const readiness=ld('readiness',{});
  const readinessEntries=Object.values(readiness).sort((a,b)=>a.date>b.date?1:-1).slice(-14);
  const avgReadiness=readinessEntries.length>0?Math.round(readinessEntries.reduce((a,r)=>a+((r.sleepVal+r.sorenessVal+r.energyVal+r.moodVal)/4),0)/readinessEntries.length*100):null;

  // ACWR (Acute:Chronic Workload Ratio)
  const acuteVolume=hist.filter(h=>(new Date()-new Date(h.date))/(1000*60*60*24)<=7).reduce((a,h)=>a+(h.volume||0),0);
  const chronicVolume=hist.filter(h=>{const d=(new Date()-new Date(h.date))/(1000*60*60*24);return d<=28}).reduce((a,h)=>a+(h.volume||0),0)/4;
  const acwr=chronicVolume>0?Math.round((acuteVolume/chronicVolume)*100)/100:null;
  const acwrColor=acwr?acwr<0.8?'var(--blu)':acwr<=1.3?'var(--grn)':acwr<=1.5?'var(--org)':'var(--red)':'var(--t3)';
  const acwrLabel=acwr?acwr<0.8?'Detraining zone':acwr<=1.3?'Sweet spot':acwr<=1.5?'Caution — high ramp':'Danger — injury risk':'—';

  // Weekly summary (this week vs last week)
  const lastWeekHist=hist.filter(h=>{const d=(new Date()-new Date(h.date))/(1000*60*60*24);return d>7&&d<=14});
  const thisWeekVol=hist.filter(h=>(new Date()-new Date(h.date))/(1000*60*60*24)<=7).reduce((a,h)=>a+(h.volume||0),0);
  const lastWeekVol=lastWeekHist.reduce((a,h)=>a+(h.volume||0),0);
  const lastWeekCount=lastWeekHist.length;
  const thisWeekRunKm=runs.filter(r=>(new Date()-new Date(r.date))/(1000*60*60*24)<=7).reduce((a,r)=>a+(r.dist||0),0);
  const lastWeekRunKm=runs.filter(r=>{const d=(new Date()-new Date(r.date))/(1000*60*60*24);return d>7&&d<=14}).reduce((a,r)=>a+(r.dist||0),0);
  const thisWeekAvgPain=painData.filter(h=>(new Date()-new Date(h.date))/(1000*60*60*24)<=7);
  const lastWeekAvgPain=painData.filter(h=>{const d=(new Date()-new Date(h.date))/(1000*60*60*24);return d>7&&d<=14});
  const twPain=thisWeekAvgPain.length>0?Math.round(thisWeekAvgPain.reduce((a,h)=>a+h.kneePain,0)/thisWeekAvgPain.length*10)/10:null;
  const lwPain=lastWeekAvgPain.length>0?Math.round(lastWeekAvgPain.reduce((a,h)=>a+h.kneePain,0)/lastWeekAvgPain.length*10)/10:null;

  // Phase progression recommendation
  const currentPhase=ld('phase',1);
  const phaseWeeksKey=`phaseStart_${currentPhase}`;
  const phaseStart=ld(phaseWeeksKey,null);
  if(!phaseStart&&hist.length>0){sv(phaseWeeksKey,new Date().toISOString())}
  const weeksInPhase=phaseStart?Math.floor((new Date()-new Date(phaseStart))/(1000*60*60*24*7)):0;
  const phaseMinWeeks=PHASES_META.find(p=>p.id===currentPhase)?.id===4?99:4;
  const recentCompletion=hist.slice(-6).length>0?Math.round(hist.slice(-6).reduce((a,h)=>a+(h.completed/h.total),0)/Math.min(6,hist.slice(-6).length)*100):0;
  const readyToProgress=currentPhase<4&&weeksInPhase>=phaseMinWeeks&&recentCompletion>=75&&(twPain===null||twPain<=4)&&(avgRpe===null||avgRpe<=7);

  const displayed=showAll?[...hist].reverse():[...hist].reverse().slice(0,20);

  return(
    <>
      <div className="hdr"><h1>Progress</h1><p>Track your recovery journey</p></div>
      <div className="scroll">
        <ReadinessCheckIn onSave={()=>setTick(t=>t+1)}/>

        {/* WEEKLY SUMMARY */}
        {(thisWeek>0||lastWeekCount>0)&&<>
          <div className="section-t">This Week vs Last</div>
          <div className="card" style={{padding:14}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:8,fontSize:13,textAlign:'center'}}>
              <div style={{textAlign:'left',fontWeight:600,color:'var(--t2)'}}>This Week</div>
              <div></div>
              <div style={{textAlign:'right',fontWeight:600,color:'var(--t3)'}}>Last Week</div>

              <div style={{textAlign:'left'}}><span style={{fontWeight:700,color:'var(--grn)'}}>{thisWeek}</span> workouts</div>
              <div style={{color:'var(--t3)',fontSize:11}}>🏋️</div>
              <div style={{textAlign:'right'}}><span style={{fontWeight:700,color:'var(--t3)'}}>{lastWeekCount}</span> workouts</div>

              {(thisWeekVol>0||lastWeekVol>0)&&<>
                <div style={{textAlign:'left'}}><span style={{fontWeight:700,color:'var(--grn)'}}>{(thisWeekVol/1000).toFixed(1)}t</span></div>
                <div style={{color:'var(--t3)',fontSize:11}}>📊</div>
                <div style={{textAlign:'right'}}><span style={{fontWeight:700,color:'var(--t3)'}}>{(lastWeekVol/1000).toFixed(1)}t</span></div>
              </>}

              {(thisWeekRunKm>0||lastWeekRunKm>0)&&<>
                <div style={{textAlign:'left'}}><span style={{fontWeight:700,color:'var(--cyn)'}}>{thisWeekRunKm.toFixed(1)}km</span></div>
                <div style={{color:'var(--t3)',fontSize:11}}>🏃</div>
                <div style={{textAlign:'right'}}><span style={{fontWeight:700,color:'var(--t3)'}}>{lastWeekRunKm.toFixed(1)}km</span></div>
              </>}

              {(twPain!==null||lwPain!==null)&&<>
                <div style={{textAlign:'left'}}><span style={{fontWeight:700,color:twPain!==null?painColor(twPain):'var(--t3)'}}>{twPain!==null?twPain+'/10':'—'}</span></div>
                <div style={{color:'var(--t3)',fontSize:11}}>🦵</div>
                <div style={{textAlign:'right'}}><span style={{fontWeight:700,color:'var(--t3)'}}>{lwPain!==null?lwPain+'/10':'—'}</span></div>
              </>}
            </div>
          </div>
        </>}

        <div className="stat-grid" style={{marginTop:12}}>
          <div className="stat-card"><div className="val" style={{color:'var(--grn)'}}>{totalWorkouts}</div><div className="lbl">Total Workouts</div></div>
          <div className="stat-card"><div className="val" style={{color:'var(--blu)'}}>{thisWeek}</div><div className="lbl">This Week</div></div>
          <div className="stat-card"><div className="val" style={{color:'var(--org)'}}>{streak}🔥</div><div className="lbl">Day Streak</div></div>
          <div className="stat-card"><div className="val" style={{color:'var(--pur)'}}>{avgDuration?fmtTime(avgDuration):'—'}</div><div className="lbl">Avg Duration</div></div>
        </div>

        {/* ACWR + PHASE PROGRESSION */}
        {(acwr||readyToProgress)&&<>
          <div className="section-t">Training Load</div>
          <div className="card" style={{padding:14}}>
            {acwr&&<div style={{marginBottom:readyToProgress?12:0}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:13,color:'var(--t2)'}}>Acute:Chronic Workload</span>
                <span style={{fontWeight:700,color:acwrColor}}>{acwr}</span>
              </div>
              <div style={{height:8,background:'var(--c2)',borderRadius:4,overflow:'hidden',position:'relative'}}>
                <div style={{position:'absolute',left:'26.6%',width:'33.3%',height:'100%',background:'var(--grn)',opacity:0.15,borderRadius:4}}/>
                <div style={{position:'absolute',left:`${Math.min(95,Math.max(2,acwr/2*100))}%`,width:6,height:'100%',background:acwrColor,borderRadius:3,transform:'translateX(-50%)'}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--t3)',marginTop:3}}>
                <span>0</span><span>0.8</span><span style={{color:'var(--grn)'}}>sweet spot</span><span>1.3</span><span>2.0</span>
              </div>
              <div style={{fontSize:11,color:acwrColor,marginTop:4,fontWeight:600}}>{acwrLabel}</div>
            </div>}
            {readyToProgress&&<div style={{padding:10,background:'var(--grn-d)',borderRadius:8,border:'1px solid var(--grn)'}}>
              <div style={{fontWeight:700,color:'var(--grn)',fontSize:14,marginBottom:4}}>Ready to progress!</div>
              <div style={{fontSize:12,color:'var(--t2)'}}>
                {weeksInPhase} weeks in {PHASES_META.find(p=>p.id===currentPhase)?.n} · {recentCompletion}% completion · {twPain!==null?`Pain ${twPain}/10`:'No pain data'} · {avgRpe?`RPE ${avgRpe}`:''}
              </div>

            </div>}
          </div>
        </>}

        {/* RECOVERY INSIGHTS */}
        {(painData.length>0||avgRpe||avgReadiness||runs.length>0)&&<>
          <div className="section-t">Recovery & Load</div>
          <div className="card" style={{padding:14}}>
            {recentPain!=null&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:13,color:'var(--t2)'}}>Knee Pain (last)</span>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontWeight:700,color:painColor(recentPain)}}>{recentPain}/10</span>
                {painTrend!=null&&<span style={{fontSize:11,fontWeight:600,color:painTrend<0?'var(--grn)':painTrend>0?'var(--red)':'var(--t3)'}}>
                  {painTrend<-0.5?'↓ improving':painTrend>0.5?'↑ worsening':'→ stable'}
                </span>}
              </div>
            </div>}
            {painData.length>=3&&<div style={{marginBottom:10}}>
              <div className="mini-chart">
                {painData.map((p,i)=>(
                  <div key={i} className="mini-bar" style={{height:`${Math.max(4,(p.kneePain/10)*40)}px`,background:painColor(p.kneePain)+'90'}}/>

        {weightLog.length>1&&<>

        </>}

        {prList.length>0&&<>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div className="section-t">Personal Records</div>
            <button style={{background:'none',border:'none',color:'var(--grn)',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}} onClick={()=>setPrView(!prView)}>{prView?'Hide':'Show All'}</button>
          </div>
          {prView?prList.map((p,i)=>(
            <div key={i} className="hist-item">
              <div>
                <div style={{fontWeight:600}}>{p.ex.n}</div>
                <div style={{fontSize:13,color:'var(--t2)'}}>{p.ex.m} · {p.ex.eq}</div>
              </div>
              <span className="badge badge-o" style={{fontSize:14,fontWeight:700}}>{p.w}kg</span>

            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              {prList.slice(0,5).map((p,i)=>(
                <div key={i} style={{fontSize:13}}>
                  <span style={{fontWeight:600}}>{p.ex.n}</span>

            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>

// === CALORIE ESTIMATE ===
const estCalories=(duration,volume,bodyweight)=>{
  const bw=bodyweight||80;
  const baseMET=5;
  const durationMin=(duration||0)/60;
  const baseCalories=baseMET*bw/60*durationMin;
  const volumeBonus=volume>0?volume/500:0;
  return Math.round(baseCalories+volumeBonus);
};

// === SETTINGS TAB ===
const SettingsTab=()=>{
  const[bw,setBw]=useState('');
  const[toast,setToast]=useState('');
  const[customRest,setCustomRest]=useState('');
  const[goalW,setGoalW]=useState(()=>ld('weightGoal',''));
  const[mWaist,setMWaist]=useState('');
  const[mChest,setMChest]=useState('');
  const[mThigh,setMThigh]=useState('');
  const weightLog=ld('weightLog',[]);
  const measurements=ld('measurements',[]);

  // Weigh-in nudge
  const lastWeighIn=weightLog.length>0?weightLog[weightLog.length-1]:null;
  const daysSinceWeighIn=lastWeighIn?Math.floor((new Date()-new Date(lastWeighIn.date))/(1000*60*60*24)):99;
  const needsWeighIn=daysSinceWeighIn>=7;

  const saveWeight=()=>{
    if(!bw||isNaN(parseFloat(bw)))return;
    const log=[...weightLog,{date:new Date().toISOString(),w:parseFloat(bw)}];
    sv('weightLog',log);
    sv('bodyweight',bw);
    setBw('');
    setToast('Weight logged: '+bw+' kg');
    vb();
  };

  const saveGoal=()=>{
    if(!goalW||isNaN(parseFloat(goalW)))return;
    sv('weightGoal',parseFloat(goalW));
    setToast('Goal set: '+goalW+' kg');
    vb();
  };

  const saveMeasurements=()=>{
    if(!mWaist&&!mChest&&!mThigh)return;
    const entry={date:new Date().toISOString(),waist:parseFloat(mWaist)||null,chest:parseFloat(mChest)||null,thigh:parseFloat(mThigh)||null};
    const log=[...measurements,entry];
    sv('measurements',log);
    setMWaist('');setMChest('');setMThigh('');
    setToast('Measurements saved');
    vb();
  };

  const clearAll=()=>{
    if(confirm('Clear all workout data? This cannot be undone.')){
      const keys=Object.keys(localStorage).filter(k=>k.startsWith('ic15_'));
      keys.forEach(k=>localStorage.removeItem(k));
      setToast('All data cleared');
    }
  };

  const exportData=()=>{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith('ic15_'));
    const data={};
    keys.forEach(k=>{try{data[k]=JSON.parse(localStorage.getItem(k))}catch{data[k]=localStorage.getItem(k)}});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`ironclad-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    setToast('Backup exported');
  };

  const importData=()=>{
    const input=document.createElement('input');
    input.type='file';input.accept='.json';
    input.onchange=(e)=>{
      const file=e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=(ev)=>{
        try{
          const data=JSON.parse(ev.target.result);
          const keys=Object.keys(data).filter(k=>k.startsWith('ic15_'));
          if(keys.length===0){setToast('Invalid backup file');return}
          if(!confirm(`Restore ${keys.length} items from backup? This will overwrite current data.`))return;
          keys.forEach(k=>localStorage.setItem(k,typeof data[k]==='string'?data[k]:JSON.stringify(data[k])));
          setToast(`Restored ${keys.length} items`);
          setTimeout(()=>location.reload(),1500);
        }catch{setToast('Error reading backup file')}
      };
      reader.readAsText(file);
    };
    input.click();
  };

  return(
    <>
      <div className="hdr"><h1>Settings</h1><p>IronClad Pro v16.0</p></div>
      <div className="scroll">
        {needsWeighIn&&<div className="card" style={{padding:14,border:'1px solid var(--org)',marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:20}}>⚖️</span>
            <div>
              <div style={{fontWeight:600,fontSize:14,color:'var(--org)'}}>Time to weigh in!</div>
              <div style={{fontSize:12,color:'var(--t2)'}}>Last weigh-in was {daysSinceWeighIn} days ago. Weekly consistency = reliable trends.</div>
            </div>
          </div>
        </div>}

        <div className="section-t">Body Weight</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <input className="inp" type="number" inputMode="decimal" placeholder="Current weight (kg)" value={bw} onChange={e=>setBw(e.target.value)} style={{textAlign:'left',padding:'0 14px'}}/>
            <button className="btn btn-g" onClick={saveWeight}>Save</button>
          </div>
          {weightLog.length>0&&<div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>
            Current: {weightLog[weightLog.length-1].w} kg · {weightLog.length} entries · {daysSinceWeighIn===0?'today':daysSinceWeighIn+'d ago'}
          </div>}
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input className="inp" type="number" inputMode="decimal" placeholder="Goal weight (kg)" value={goalW} onChange={e=>setGoalW(e.target.value)} style={{textAlign:'left',padding:'0 14px',maxWidth:160}}/>
            <button className="btn btn-s" onClick={saveGoal}>Set Goal</button>
          </div>
          {(()=>{
            const goal=ld('weightGoal',null);
            const current=weightLog.length>0?weightLog[weightLog.length-1].w:null;
            const start=weightLog.length>1?weightLog[0].w:null;
            if(!goal||!current)return null;
            const totalToLose=start?(start-goal):0;
            const lost=start?(start-current):0;
            const remaining=current-goal;
            const pct=totalToLose>0?Math.min(100,Math.max(0,Math.round((lost/totalToLose)*100))):0;
            return(
              <div style={{marginTop:10}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--t2)',marginBottom:4}}>
                  <span>{start||current}kg</span>
                  <span style={{color:remaining<=0?'var(--grn)':'var(--t1)',fontWeight:600}}>{remaining<=0?'Goal reached!':remaining.toFixed(1)+'kg to go'}</span>
                  <span>{goal}kg</span>
                </div>
                <div className="goal-bar">
                  <div className="goal-fill" style={{width:`${pct}%`,background:pct>=100?'var(--grn)':pct>=50?'var(--blu)':'var(--org)'}}/>
                </div>
                <div style={{fontSize:11,color:'var(--t3)',marginTop:4,textAlign:'center'}}>{pct}% of the way there</div>
              </div>
            );
          })()}
        </div>

        <div className="section-t">Body Measurements</div>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>Track changes beyond the scale (cm)</div>
          <div style={{display:'flex',gap:6,marginBottom:8}}>
            <input className="inp" type="number" inputMode="decimal" placeholder="Waist" value={mWaist} onChange={e=>setMWaist(e.target.value)} style={{textAlign:'center'}}/>
            <input className="inp" type="number" inputMode="decimal" placeholder="Chest" value={mChest} onChange={e=>setMChest(e.target.value)} style={{textAlign:'center'}}/>
            <input className="inp" type="number" inputMode="decimal" placeholder="Thigh" value={mThigh} onChange={e=>setMThigh(e.target.value)} style={{textAlign:'center'}}/>
          </div>
          <button className="btn btn-g" style={{width:'100%'}} onClick={saveMeasurements}>Save Measurements</button>
          {measurements.length>0&&(()=>{
            const last=measurements[measurements.length-1];
            const first=measurements[0];
            return <div style={{marginTop:10,fontSize:12,color:'var(--t2)'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                {last.waist&&<span>Waist: {last.waist}cm{measurements.length>1&&first.waist?<span style={{color:last.waist<first.waist?'var(--grn)':'var(--red)',marginLeft:4}}>{(last.waist-first.waist)>0?'+':''}{(last.waist-first.waist).toFixed(1)}</span>:null}</span>}
                {last.chest&&<span>Chest: {last.chest}cm{measurements.length>1&&first.chest?<span style={{color:last.chest>first.chest?'var(--grn)':'var(--red)',marginLeft:4}}>{(last.chest-first.chest)>0?'+':''}{(last.chest-first.chest).toFixed(1)}</span>:null}</span>}
                {last.thigh&&<span>Thigh: {last.thigh}cm{measurements.length>1&&first.thigh?<span style={{color:last.thigh>first.thigh?'var(--grn)':'var(--red)',marginLeft:4}}>{(last.thigh-first.thigh)>0?'+':''}{(last.thigh-first.thigh).toFixed(1)}</span>:null}</span>}
              </div>
              <div style={{color:'var(--t3)',marginTop:4}}>{measurements.length} entries logged</div>
            </div>;
          })()}
        </div>

        <div className="section-t">Rest Timer</div>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>Auto-starts between sets. Shorter rest = more calorie burn.</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {REST_OPTIONS.map(s=>{
              const current=ld('restTime',60);
              return <button key={s} className={`phase-btn${current===s?' on':''}`} onClick={()=>{sv('restTime',s);setToast(`Rest timer: ${s}s`);vb()}}>{s}s</button>;
            })}
          </div>
          <div style={{display:'flex',gap:8,marginTop:10,alignItems:'center'}}>
            <span style={{fontSize:13,color:'var(--t2)',whiteSpace:'nowrap'}}>Custom:</span>
            <input className="inp" type="number" inputMode="numeric" placeholder="sec" value={customRest} onChange={e=>setCustomRest(e.target.value)} style={{maxWidth:80,textAlign:'center'}}/>

          </div>
        </div>

        <div className="section-t">Program Info</div>
        <div className="card" style={{padding:16}}>
          <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>Trail Runner Recovery Program</div>

          IronClad Pro v16.0 · Trail Runner Recovery Edition<br/>
          Built for Matt · Knee-safe · All exercises vetted
        </div>
      </div>
      {toast&&<Toast msg={toast} onClose={()=>setToast('')}/>}
    </>
  );
};

// === RECOVERY TAB ===
const RecoveryTab=()=>{
  const[toast,setToast]=useState('');
  const[tick,setTick]=useState(0);
  const[milestones,setMilestones]=useState(()=>ld('kneeMilestones',{}));
  const hist=ld('history',[]);
  const runs=ld('runLog',[]);
  const readiness=ld('readiness',{});
  const exHistory=ld('exHistory',{});

  // Readiness trend (last 14 days)
  const readinessEntries=Object.values(readiness).sort((a,b)=>a.date>b.date?1:-1).slice(-14);

  // Knee pain from runs
  const runPainData=runs.filter(r=>r.kneeFeel!=null).slice(-10);

  // Rehab compliance: % of knee-tagged exercises done this week
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  const kneeExIds=EXERCISES.filter(e=>e.tags&&e.tags.includes('k')).map(e=>e.id);
  const kneeDoneThisWeek=kneeExIds.filter(eid=>{
    const sessions=exHistory[eid]||[];
    return sessions.some(s=>new Date(s.date)>=weekAgo);
  }).length;
  const totalKneeEx=kneeExIds.length;
  const compliancePct=totalKneeEx>0?Math.round((kneeDoneThisWeek/totalKneeEx)*100):0;

  // Knee recovery milestones
  const MILESTONES=[
    {id:'pain3',label:'Pain ≤ 3/10 during workouts'},
    {id:'fullsquat',label:'Full bodyweight squat pain-free'},
    {id:'singleleg',label:'Single-leg balance 30s each side'},
    {id:'run5k',label:'Run 5k pain-free'},
    {id:'jump',label:'Box jump 12" pain-free'},
    {id:'split',label:'Bulgarian split squat with weight'},
    {id:'trail',label:'Trail run 30+ minutes'},
    {id:'noNSAID',label:'7 days without NSAIDs'},
  ];
  const toggleMs=(id)=>{
    const next={...milestones,[id]:!milestones[id]};
    setMilestones(next);
    sv('kneeMilestones',next);
    vb();
  };
  const msDoneCount=MILESTONES.filter(m=>milestones[m.id]).length;

  // Pain vs training load correlation (last 8 weeks)
  const corrWeeks=[];
  for(let i=7;i>=0;i--){
    const ws=new Date();ws.setDate(ws.getDate()-(i*7+6));ws.setHours(0,0,0,0);
    const we=new Date();we.setDate(we.getDate()-(i*7));we.setHours(23,59,59,999);
    const wHist=hist.filter(h=>{const d=new Date(h.date);return d>=ws&&d<=we});
    const wRuns=runs.filter(r=>{const d=new Date(r.date);return d>=ws&&d<=we});
    const load=wHist.reduce((a,h)=>a+(h.volume||0),0)/1000+wRuns.reduce((a,r)=>a+(r.dist||0),0);
    const pains=[...wHist.filter(h=>h.kneePain!=null).map(h=>h.kneePain),...wRuns.filter(r=>r.kneeFeel!=null).map(r=>r.kneeFeel)];
    const avgPain=pains.length>0?pains.reduce((a,p)=>a+p,0)/pains.length:null;
    corrWeeks.push({load,avgPain,wkLabel:`${ws.getMonth()+1}/${ws.getDate()}`});
  }
  const maxLoad=Math.max(1,...corrWeeks.map(w=>w.load));

  // Weekly km progression with 10% rule
  const weekKm=[];
  for(let i=7;i>=0;i--){
    const ws=new Date();ws.setDate(ws.getDate()-(i*7+6));ws.setHours(0,0,0,0);
    const we=new Date();we.setDate(we.getDate()-(i*7));we.setHours(23,59,59,999);
    const km=runs.filter(r=>{const d=new Date(r.date);return d>=ws&&d<=we}).reduce((a,r)=>a+(r.dist||0),0);
    weekKm.push(km);
  }
  const lastWk=weekKm[weekKm.length-2]||0;
  const safeNext=lastWk*1.1;
  const thisWk=weekKm[weekKm.length-1]||0;
  const overTen=lastWk>0&&thisWk>safeNext;
  const maxKm=Math.max(1,...weekKm,safeNext);

  // Pace trend (last 10 runs with valid pace)
  const paceRuns=runs.filter(r=>r.pace>0).slice(-10);
  const maxPace=paceRuns.length>0?Math.max(...paceRuns.map(r=>r.pace)):0;
  const minPace=paceRuns.length>0?Math.min(...paceRuns.map(r=>r.pace)):0;

  return(
    <>
      <div className="hdr"><h1>Recovery</h1><p>Running, readiness & rehab tracking</p></div>
      <div className="scroll">
        <ReadinessCheckIn onSave={()=>setTick(t=>t+1)}/>

        {readinessEntries.length>=3&&<>
          <div className="section-t">Readiness Trend</div>
          <div className="card" style={{padding:14}}>
            <div className="mini-chart" style={{height:50}}>
              {readinessEntries.map((r,i)=>{
                const val=(r.sleepVal+r.sorenessVal+r.energyVal+r.moodVal)/4;
                return <div key={i} className="mini-bar" style={{height:`${Math.max(4,val*46)}px`,background:val>=0.66?'var(--grn)':val>=0.33?'var(--org)':'var(--red)'}} title={`${Math.round(val*100)}%`}/>;
              })}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--t3)',marginTop:4}}>
              <span>{readinessEntries[0].date}</span><span>today</span>
            </div>
          </div>
        </>}

        <div className="section-t">Knee Rehab Compliance</div>
        <div className="card" style={{padding:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:13}}>
            <span style={{fontWeight:600}}>This week</span>
            <span style={{color:compliancePct>=70?'var(--grn)':compliancePct>=40?'var(--org)':'var(--red)',fontWeight:700}}>{kneeDoneThisWeek}/{totalKneeEx} ({compliancePct}%)</span>
          </div>
          <div className="goal-bar">
            <div className="goal-fill" style={{width:`${compliancePct}%`,background:compliancePct>=70?'var(--grn)':compliancePct>=40?'var(--org)':'var(--red)'}}/>
          </div>
          <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>{compliancePct>=70?'Excellent rehab consistency':compliancePct>=40?'Keep going — aim for 70%+':'Try to hit more knee-safe exercises this week'}</div>
        </div>

        <div className="section-t">Knee Recovery Milestones <span style={{color:'var(--t3)',fontWeight:400,fontSize:11}}>({msDoneCount}/{MILESTONES.length})</span></div>
        <div className="card" style={{padding:'4px 14px'}}>
          {MILESTONES.map(m=>(
            <div key={m.id} className="ms-item" onClick={()=>toggleMs(m.id)} style={{cursor:'pointer'}}>
              <div className={`ms-check${milestones[m.id]?' done':''}`}>{milestones[m.id]?'✓':''}</div>
              <div style={{fontSize:13,color:milestones[m.id]?'var(--t3)':'var(--t1)',textDecoration:milestones[m.id]?'line-through':'none'}}>{m.label}</div>
            </div>
          ))}
        </div>

        <div className="section-t">Running</div>
        <RunningLog onToast={(msg)=>{setToast(msg);setTick(t=>t+1)}}/>

        {weekKm.some(k=>k>0)&&<>
          <div className="section-t" style={{marginTop:16}}>Weekly km · 10% Rule</div>
          <div className="card" style={{padding:14}}>
            <div className="mini-chart" style={{height:60,alignItems:'flex-end'}}>
              {weekKm.map((k,i)=>(
                <div key={i} className="mini-bar" style={{height:`${Math.max(2,(k/maxKm)*56)}px`,background:i===weekKm.length-1&&overTen?'var(--red)':'var(--blu)'}} title={`${k.toFixed(1)}km`}/>
              ))}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t2)',marginTop:6}}>
              <span>This wk: <b style={{color:overTen?'var(--red)':'var(--t1)'}}>{thisWk.toFixed(1)}km</b></span>
              <span>Last wk: {lastWk.toFixed(1)}km</span>
              <span>Safe max: {safeNext.toFixed(1)}km</span>
            </div>
            {overTen&&<div style={{fontSize:11,color:'var(--red)',marginTop:4,textAlign:'center'}}>⚠️ Volume jumped &gt;10% — injury risk</div>}
          </div>
        </>}

        {paceRuns.length>=3&&<>
          <div className="section-t" style={{marginTop:16}}>Pace Trend</div>
          <div className="card" style={{padding:14}}>
            <div className="mini-chart" style={{height:50,alignItems:'flex-end'}}>
              {paceRuns.map((r,i)=>{
                const range=maxPace-minPace||1;
                const norm=1-((r.pace-minPace)/range);
                return <div key={i} className="mini-bar" style={{height:`${Math.max(4,norm*46+4)}px`,background:'var(--grn)'}} title={`${r.pace}min/km`}/>;
              })}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t2)',marginTop:6}}>
              <span>Best: {minPace.toFixed(1)}min/km</span>
              <span>Avg: {(paceRuns.reduce((a,r)=>a+r.pace,0)/paceRuns.length).toFixed(1)}min/km</span>
              <span>Slowest: {maxPace.toFixed(1)}min/km</span>
            </div>
          </div>
        </>}

        {corrWeeks.filter(w=>w.avgPain!=null).length>=3&&<>
          <div className="section-t" style={{marginTop:16}}>Load vs Knee Pain</div>
          <div className="card" style={{padding:14}}>
            <div className="corr-chart">
              {corrWeeks.map((w,i)=>(
                <div key={i} className="corr-bar">
                  <div className="top" style={{height:`${(w.load/maxLoad)*36}px`,background:'var(--blu)'}} title={`Load: ${w.load.toFixed(1)}`}/>
                  <div className="bot" style={{height:`${w.avgPain!=null?(w.avgPain/10)*36:0}px`,background:w.avgPain!=null?painColor(w.avgPain):'transparent'}} title={w.avgPain!=null?`Pain: ${w.avgPain.toFixed(1)}/10`:''}/>
                </div>
              ))}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--t3)',marginTop:6}}>
              <span style={{color:'var(--blu)'}}>■ Load (top)</span>
              <span style={{color:'var(--red)'}}>■ Pain (bottom)</span>
            </div>
            <div style={{fontSize:11,color:'var(--t2)',marginTop:4,textAlign:'center'}}>8 weeks · spot if higher load = more pain</div>
          </div>
        </>}

        {runPainData.length>=3&&<>
          <div className="section-t" style={{marginTop:16}}>Knee Feel After Runs</div>
          <div className="card" style={{padding:14}}>
            <div className="mini-chart" style={{height:40}}>
              {runPainData.map((r,i)=>(
                <div key={i} className="mini-bar" style={{height:`${Math.max(4,(r.kneeFeel/10)*36)}px`,background:painColor(r.kneeFeel)+'90'}} title={`${r.kneeFeel}/10`}/>
              ))}
            </div>
            <div style={{fontSize:11,color:'var(--t2)',marginTop:6,textAlign:'center'}}>
              Avg: {(runPainData.reduce((a,r)=>a+r.kneeFeel,0)/runPainData.length).toFixed(1)}/10 · {runPainData.length<3?'Need more data':''}
              {runPainData.length>=3&&(()=>{
                const recent=runPainData.slice(-3).reduce((a,r)=>a+r.kneeFeel,0)/3;
                const early=runPainData.slice(0,3).reduce((a,r)=>a+r.kneeFeel,0)/3;
                return recent<early?' · Trending better':'';
              })()}
            </div>
          </div>
        </>}

        {toast&&<Toast msg={toast} onClose={()=>setToast('')}/>}
      </div>
    </>
  );
};

// === APP ===
const App=()=>{
  const[tab,setTab]=useState(0);
  const tabs=[
    {n:'Workout',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6.5 6.5h11M4 12h16M6.5 17.5h11"/><circle cx="4" cy="6.5" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="17.5" r="2"/></svg>},
    {n:'Progress',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 20h18M6 16V8M10 16V4M14 16v-5M18 16V9"/></svg>},
    {n:'Recovery',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21c-4.97 0-9-4.03-9-9s4.03-9 9-9 9 4.03 9 9"/><path d="M12 7v5l3 3"/><path d="M19 16v6M16 19h6"/></svg>},
    {n:'Library',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>},
    {n:'Settings',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>}
  ];

  return(
    <div className="app">
      {tab===0&&<WorkoutTab/>}
      {tab===1&&<ProgressTab/>}
      {tab===2&&<RecoveryTab/>}
      {tab===3&&<LibraryTab/>}
      {tab===4&&<SettingsTab/>}
      <div className="tabs">
        {tabs.map((t,i)=>(
          <button key={i} className={`tab${tab===i?' on':''}`} onClick={()=>{setTab(i);vb()}}>
            {t.icon}<span>{t.n}</span>
          </button>
        ))}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
