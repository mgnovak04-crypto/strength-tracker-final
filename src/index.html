    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState!=='visible'||Date.now()-lastCheck<30*60*1000)return;
      lastCheck=Date.now();sw.getRegistration().then(function(r){if(r)r.update().catch(function(){})});
    });

    sw.addEventListener('controllerchange',function(){
      if(!hadController){hadController=true;return}
      window.__icUpdateReady=true;window.dispatchEvent(new Event('ic-update-ready'));

<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// === UTILITIES ===
const P='ic17_';
const ld=(k,d)=>{try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>localStorage.setItem(P+k,JSON.stringify(v));
const rm=(k)=>localStorage.removeItem(P+k);
const vb=()=>{try{navigator.vibrate?.(10)}catch{}};
const fmtDate=(d)=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=(s)=>{const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec.toString().padStart(2,'0')}`};
const today=()=>new Date().toISOString().slice(0,10);

// === DATA MIGRATION ===
(()=>{
  try{
    if(localStorage.getItem('ic17_migrated'))return;
    const oldPrefixes=['ic13_','ic14_','ic15_','ic16_'];
    const unprefixed=['history','prs','bodyweight','weightLog','exHistory','phase','restTime','restEnabled'];
    oldPrefixes.forEach(op=>{
      Object.keys(localStorage).filter(k=>k.startsWith(op)).forEach(k=>{
        const newKey='ic17_'+k.replace(op,'');
        if(!localStorage.getItem(newKey))localStorage.setItem(newKey,localStorage.getItem(k));
      });
    });
    unprefixed.forEach(k=>{
      const v=localStorage.getItem(k);
      if(v&&!localStorage.getItem('ic17_'+k))localStorage.setItem('ic17_'+k,v);
    });
    Object.keys(localStorage).filter(k=>k.startsWith('pr_')).forEach(k=>{
      const newKey='ic17_'+k;
      if(!localStorage.getItem(newKey))localStorage.setItem(newKey,localStorage.getItem(k));
    });
    localStorage.setItem('ic17_migrated','1');
  }catch(e){}
})();

// === CALORIE ESTIMATE ===
const estCalories=(duration,volume,bodyweight)=>{
  const bw=bodyweight||80;
  const baseMET=5;
  const durationMin=(duration||0)/60;
  const baseCalories=baseMET*bw/60*durationMin;
  const volumeBonus=volume>0?volume/500:0;
  return Math.round(baseCalories+volumeBonus);
};

// === est1RM ===
const est1RM=(w,r)=>{if(!w||!r||r<1)return 0;if(r===1)return w;return Math.round(w*(1+r/30))};
const estRunCal=(distKm,bw)=>Math.round((bw||80)*distKm*1.036);
// Progressive overload: parse a rep range like "8-10" -> [8,10]; smaller weight jumps for isolation/DB
const parseRepRange=(reps)=>{const m=String(reps).match(/^(\d+)\s*-\s*(\d+)/);return m?[parseInt(m[1]),parseInt(m[2])]:null};
const weightStep=(eq)=>['Barbell','Machine'].includes(eq)?2.5:2;
// Given last session's completed sets + target range, suggest the next target (add weight vs push reps)
const suggestTarget=(lastSets,range,eq)=>{
  if(!range||!lastSets)return null;
  const done=lastSets.filter(s=>parseFloat(s.w)>0&&parseInt(s.r)>0);
  if(!done.length)return null;
  const w=Math.max(...done.map(s=>parseFloat(s.w)));
  const repsAtW=Math.min(...done.filter(s=>parseFloat(s.w)===w).map(s=>parseInt(s.r)));
  const[lo,hi]=range;
  if(repsAtW>=hi){const nw=Math.round((w+weightStep(eq))*2)/2;return{w:nw,r:lo,add:true};}
  return{w,r:Math.min(repsAtW+1,hi),add:false};
};
// Least-squares slope: pts=[{x,y}] -> dy/dx
const linSlope=(pts)=>{
  const n=pts.length;if(n<2)return 0;
  const sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0),sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const d=n*sxx-sx*sx;return d===0?0:(n*sxy-sx*sy)/d;
};
// Daily readiness / auto-regulation from recent check-ins, RPE, rest, ACWR
const computeReadiness=(history,acwr)=>{
  if(!history.length)return null;
  const last=history[0];
  const daysSince=Math.round((new Date()-new Date(last.date))/86400000);
  let score=100;const f=[];
  const kp=last.kneePre,cp=last.calfPre;
  if(kp!==undefined||cp!==undefined){
    const pen=Math.round((((kp||0)+(cp||0))/2)*8);
    if(pen>0){score-=pen;f.push({t:`Knee ${kp||0}/5 · Calf ${cp||0}/5`,d:-pen});}
  }
  const ck=history.filter(h=>h.kneePre!==undefined);
  if(ck.length>=4){
    const avg=a=>a.reduce((s,h)=>s+((h.kneePre||0)+(h.calfPre||0)),0)/a.length;
    if(avg(ck.slice(0,3))>avg(ck.slice(3,6))+1){score-=8;f.push({t:'Pain trending up',d:-8});}
  }
  if(last.rpe){
    const pen=Math.max(0,Math.round((last.rpe-7)*5));
    if(pen>0){score-=pen;f.push({t:`Last session hard (RPE ${last.rpe})`,d:-pen});}
  }
  if(daysSince<=0){score-=12;f.push({t:'Back-to-back training day',d:-12});}
  else if(daysSince===1)score-=4;
  else if(daysSince>=8){score-=5;f.push({t:`${daysSince} days since last session`,d:-5});}
  const a=parseFloat(acwr)||0;
  if(a>1.5){score-=15;f.push({t:`Training-load spike (ACWR ${a})`,d:-15});}
  else if(a>1.3){score-=8;f.push({t:`Load climbing (ACWR ${a})`,d:-8});}
  score=Math.max(0,Math.min(100,Math.round(score)));
  let label,color;
  if(score>=80){label='Go heavy — push your progression targets';color='var(--grn)';}
  else if(score>=60){label='Train as planned';color='var(--grn)';}
  else if(score>=40){label='Lighten load ~10–20%, focus on technique';color='var(--org)';}
  else{label='Active recovery / mobility only — protect the knee';color='var(--red)';}
  return{score,label,color,factors:f,daysSince};
};

// === REST TIMER ===
const RestTimer=({seconds,onDone})=>{
  const[left,setLeft]=useState(seconds);
  const[base,setBase]=useState(seconds);
  const doneRef=useRef(onDone);doneRef.current=onDone;
  // Only re-arm the interval when `seconds` changes — NOT when the parent
  // re-renders (the session timer re-renders DayView every second, and a
  // fresh inline onDone used to reset this countdown each tick).
  useEffect(()=>{
    setLeft(seconds);setBase(seconds);
    const iv=setInterval(()=>setLeft(p=>{if(p<=1){clearInterval(iv);doneRef.current&&doneRef.current();return 0}return p-1}),1000);
    return()=>clearInterval(iv);
  },[seconds]);
  const pct=base>0?left/base:0;
  const r=90,c=2*Math.PI*r;
  const close=()=>doneRef.current&&doneRef.current();
  return (
    <div className="rest-overlay" onClick={close}>
      <div style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
        <div className="rest-ring">
          <svg width={200} height={200}>
            <circle cx={100} cy={100} r={r} fill="none" stroke="var(--c2)" strokeWidth={8} />
            <circle cx={100} cy={100} r={r} fill="none" stroke="var(--grn)" strokeWidth={8} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)} />
          </svg>
          <div className="time">
            <div className="big">{left}</div>
            <div className="small">REST</div>
          </div>
        </div>
        <div className="rest-btns">
          <button className="rest-btn" style={{background:'var(--c2)',color:'var(--t1)'}} onClick={()=>{setLeft(p=>p+15);setBase(b=>Math.max(b,left+15))}}>+15s</button>
          <button className="rest-btn" style={{background:'var(--grn)',color:'#000'}} onClick={close}>Skip</button>
        </div>
      </div>
    </div>
  );
};

// === SESSION TIMER HOOK ===
const useSessionTimer=()=>{
  const[elapsed,setElapsed]=useState(0);
  const[running,setRunning]=useState(false);
  const startRef=useRef(null);
  const ivRef=useRef(null);
  const start=useCallback(()=>{
    if(!startRef.current)startRef.current=Date.now();
    setRunning(true);
    ivRef.current=setInterval(()=>{setElapsed(Math.floor((Date.now()-startRef.current)/1000))},1000);
  },[]);
  const stop=useCallback(()=>{setRunning(false);clearInterval(ivRef.current)},[]);
  const reset=useCallback(()=>{stop();setElapsed(0);startRef.current=null},[stop]);
  useEffect(()=>()=>clearInterval(ivRef.current),[]);
  return{elapsed,running,start,stop,reset};
};

// === COUNTDOWN TIMER ===
// "3 min easy" -> 180, "2 min: 30s hard / 30s easy" -> 120, "40s" -> 40, "30s each side" -> 30
const parseDurationSec=(reps)=>{const s=String(reps);const m=s.match(/(\d+(?:\.\d+)?)\s*min/);if(m)return Math.round(parseFloat(m[1])*60);const n=parseInt(s);return n>0?n:60};
const CountdownTimer=({duration})=>{
  const[left,setLeft]=useState(0);
  const[active,setActive]=useState(false);
  const ivRef=useRef(null);
  const secs=parseDurationSec(duration);
  const toggle=()=>{
    if(active){clearInterval(ivRef.current);setActive(false);setLeft(0);return}
    setLeft(secs);setActive(true);
    ivRef.current=setInterval(()=>setLeft(p=>{if(p<=1){clearInterval(ivRef.current);setActive(false);vb();return 0}return p-1}),1000);
  };
  useEffect(()=>()=>clearInterval(ivRef.current),[]);
  return (
    <div className="cd-timer" style={{background:active?'var(--org-d)':'var(--c2)',color:active?'var(--org)':'var(--t2)'}} onClick={toggle}>
      {active?fmtTime(left):'Start '+(secs>=60?fmtTime(secs):secs+'s')}
    </div>
  );
};

// === SET LOGGER ===
// Bands have no kg, so band exercises log a tension level per set (progress by moving up a band).
const BAND_LEVELS=[['L','Light'],['M','Medium'],['H','Heavy'],['XH','X-Heavy']];
const bandLabel=(b)=>(BAND_LEVELS.find(x=>x[0]===b)||[])[1]||'';
const EMPTY_SET={w:'',r:'',done:false};
// Rest comes from each block (e.g. 60s on heavy lifts, 20s on accessories); this setting scales all of them
const REST_SCALES={'0.75':0.75,'1':1,'1.5':1.5};
// Older builds could save a set list with gaps (e.g. logging set 2 before set 1), which crashed the app
// on every launch. Every stored day log is passed through this so gaps become empty sets.
const cleanLog=(o)=>{const r={};Object.keys(o&&typeof o==='object'?o:{}).forEach(k=>{r[k]=Array.isArray(o[k])?Array.from(o[k],s=>s&&typeof s==='object'?s:{...EMPTY_SET}):[]});return r};
const SetLogger=({ex,exData,sets,onUpdate,onDone,onSetsDelta})=>{
  const info=exMap[ex.eid];
  const isDuration=info&&(info.t==='d'||info.t==='c');
  const isBand=!!info&&info.eq==='Band';
  // Always build a dense copy so editing a later set first can't leave gaps in the saved list
  const upd=(i,patch)=>{const d=Array.from({length:Math.max(exData.length,i+1)},(_,j)=>exData[j]||{...EMPTY_SET});d[i]={...d[i],...patch};return d};
  // lw = can be loaded (DB/backpack step-ups, heel drops, carries): shows an optional kg box
  const needsWeight=info&&(info.t==='w'||!!info.lw||['Cable','Machine','Dumbbell','Barbell','Kettlebell'].includes(info.eq));
  const exHist=ld('exHistory',{});
  const lastSession=exHist[ex.eid]||null;
  const target=(needsWeight&&!isDuration)?suggestTarget(lastSession,parseRepRange(ex.reps),info&&info.eq):null;
  const lastTopSet=(lastSession&&lastSession.length)?(()=>{const s=lastSession.find(x=>x.w||x.r);return s?((needsWeight&&s.w)?(s.w+'×'+s.r):((s.b?bandLabel(s.b)+' · ':'')+s.r+(isDuration?'s':' reps'))):null})():null;
  return (
    <div className="log-area">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:600,color:'var(--t2)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{info?.n||ex.eid}</div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          <span style={{fontSize:11,color:'var(--t3)'}}>sets</span>
          <button className="btn btn-s" style={{padding:'2px 9px',fontSize:13}} onClick={()=>onSetsDelta(-1)}>−</button>
          <button className="btn btn-s" style={{padding:'2px 9px',fontSize:13}} onClick={()=>onSetsDelta(1)}>+</button>
        </div>
      </div>
      {(target||lastTopSet) && (
        <div style={{display:'flex',gap:6,marginBottom:7,flexWrap:'wrap',alignItems:'center'}}>
          {target && (
            <button className="pill" style={{color:'var(--grn)',background:'var(--grn-d)'}} onClick={()=>{
              const filled=[];for(let i=0;i<sets;i++)filled.push({w:String(target.w),r:String(target.r),done:false});onUpdate(filled);
            }}>{target.add?'↑':'▲'} Target {target.w}×{target.r}</button>
          )}
          {lastTopSet && (
            <button className="pill" style={{color:'var(--blu)',background:'rgba(10,132,255,0.12)'}} onClick={()=>{
              const filled=[];lastSession.forEach((s,i)=>{if(i<sets)filled.push({w:s.w||'',r:s.r||'',b:s.b||'',done:false})});onUpdate(filled);
            }}>Last {lastTopSet}</button>
          )}
          <span style={{fontSize:10,color:'var(--t3)'}}>tap to fill</span>
        </div>
      )}
      {(isDuration||/\d\s*min\b/.test(String(ex.reps))) && <div style={{marginBottom:8}}><CountdownTimer duration={ex.reps} /></div>}
      {Array.from({length:sets}).map((_,i)=>{
        const s=exData[i]||{w:'',r:'',done:false};
        return (
          <div key={i} className="set-row">
            <div className="set-num" style={s.done?{background:'var(--grn)',color:'#000'}:{}}>{s.done?'✓':i+1}</div>
            {needsWeight && (!isDuration||info.lw) && (
              <input className={'inp'+(s.done?' done':'')} type="number" inputMode="decimal" placeholder="kg" value={s.w}
                onChange={e=>onUpdate(upd(i,{w:e.target.value}))} />
            )}
            {isBand && (
              <select className={'inp'+(s.done?' done':'')} aria-label="Band tension" value={s.b||''}
                style={{flex:'0 0 86px',fontSize:14,padding:'0 4px',color:s.b?'var(--t1)':'var(--t3)'}}
                onChange={e=>onUpdate(upd(i,{b:e.target.value}))}>
                <option value="">Band</option>
                {BAND_LEVELS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
            )}
            <input className={'inp'+(s.done?' done':'')} type="number" inputMode="numeric"
              placeholder={isDuration?'sec':'reps'} value={s.r}
              onChange={e=>onUpdate(upd(i,{r:e.target.value}))} />
            {!s.done ? (
              <button className="logbtn" style={{background:'var(--grn)',color:'#000'}} onClick={()=>{
                const d=upd(i,{done:true});onUpdate(d);vb();onDone(ex,d[i],d);
              }}>Log</button>
            ) : (
              <button className="logbtn" style={{background:'var(--c2)',color:'var(--t3)',fontSize:12}} onClick={()=>{
                onUpdate(upd(i,{done:false}));vb();

        <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>
          Est 1RM: {est1RM(parseFloat(exData.find(s=>s.done&&s.w)?.w||0),parseInt(exData.find(s=>s.done&&s.w)?.r||0))} kg
        </div>
      )}
    </div>
  );
};

const DayView=({day,phase,onBack})=>{
  const[logData,setLogData]=useState(()=>cleanLog(ld('dayLog_'+day.name.replace(/\s/g,'')+'_p'+phase,{})));
  const[setsOverride,setSetsOverride]=useState(ld('setsOverride_'+day.name.replace(/\s/g,'')+'_p'+phase,{}));
  const[pain,setPain]=useState(0);
  const[rpe,setRpe]=useState(null);
  const[notes,setNotes]=useState('');
  const[showComplete,setShowComplete]=useState(null);
  const[restSecs,setRestSecs]=useState(null);
  const[restKey,setRestKey]=useState(0);
  const[openRow,setOpenRow]=useState(null);
  const[swaps,setSwaps]=useState(ld('swaps',{}));
  const dayKeyCI=day.name.replace(/\s/g,'')+'_p'+phase;
  const[kneePre,setKneePre]=useState(()=>{const c=ld('dayCheckin_'+dayKeyCI,{});return c.knee||0});
  const[calfPre,setCalfPre]=useState(()=>{const c=ld('dayCheckin_'+dayKeyCI,{});return c.calf||0});
  const[restEnabled,setRestEnabled]=useState(()=>ld('restEnabled',true));
  const restMul=REST_SCALES[ld('restScale','1')]||1;
  const timer=useSessionTimer();
  const bw=ld('bodyweight',80);
  const dayKey=day.name.replace(/\s/g,'')+'_p'+phase;

  useEffect(()=>{if(!timer.running)timer.start()},[]);
  useEffect(()=>{sv('dayLog_'+dayKey,logData)},[logData,dayKey]);
  useEffect(()=>{sv('setsOverride_'+dayKey,setsOverride)},[setsOverride,dayKey]);
  useEffect(()=>{sv('dayCheckin_'+dayKeyCI,{knee:kneePre,calf:calfPre})},[kneePre,calfPre,dayKeyCI]);

  // Picking the program's own exercise again clears the swap
  const handleSwap=(origId,newId)=>{const s={...swaps};if(newId===origId)delete s[origId];else s[origId]=newId;setSwaps(s);sv('swaps',s)};
  const dayIds=dayExerciseIds(day);
  const getEid=(eid)=>resolveSwap(eid,swaps,dayIds);

  const allExercises=day.supersets.flatMap(ss=>ss.exercises);
  const planned=(ex)=>setsOverride[getEid(ex.eid)]||ex.sets;
  const doneOf=(ex)=>(logData[getEid(ex.eid)]||[]).filter(s=>s&&s.done).length;
  const totalSets=allExercises.reduce((a,ex)=>a+planned(ex),0);
  const doneSets=allExercises.reduce((a,ex)=>a+Math.min(planned(ex),doneOf(ex)),0);
  const pct=totalSets>0?Math.round(doneSets/totalSets*100):0;

  const totalVolume=allExercises.reduce((a,ex)=>{
    const d=logData[getEid(ex.eid)]||[];
    return a+d.filter(s=>s.done&&!s.warmup).reduce((v,s)=>(parseFloat(s.w)||0)*(parseInt(s.r)||0)+v,0);
  },0);

  const handleSetDone=(ex,setData,allData,rowId)=>{
    const info=exMap[getEid(ex.eid)];
    if(info&&(info.t==='w'||(info.lw&&info.t==='r'))&&setData.w&&setData.r&&!setData.warmup){
      const prs=ld('prs',{});
      const key=getEid(ex.eid);
      const e1rm=est1RM(parseFloat(setData.w),parseInt(setData.r));
      if(!prs[key]||e1rm>prs[key].e1rm){
        prs[key]={w:parseFloat(setData.w),r:parseInt(setData.r),e1rm,date:today()};
        sv('prs',prs);
      }
      const e1rmHist=ld('e1rmLog',{});
      if(!e1rmHist[key])e1rmHist[key]=[];
      const last=e1rmHist[key][e1rmHist[key].length-1];
      if(last&&last.date===today()){
        if(e1rm>last.e1rm){last.e1rm=e1rm;last.w=parseFloat(setData.w);last.r=parseInt(setData.r)}
      }else{
        e1rmHist[key].push({date:today(),e1rm,w:parseFloat(setData.w),r:parseInt(setData.r)});
      }
      if(e1rmHist[key].length>30)e1rmHist[key]=e1rmHist[key].slice(-30);
      sv('e1rmLog',e1rmHist);
    }
    const hist=ld('exHistory',{});
    const eid=getEid(ex.eid);
    hist[eid]=(allData||[]).filter(s=>s.done);
    sv('exHistory',hist);
    // Block-aware rest: use this superset's rest; skip for warm-up/mobility (rest:0)
    const restSec=Math.round((ex.rest||0)*restMul);
    const startRest=()=>{if(restEnabled&&restSec>0){setRestSecs(restSec);setRestKey(k=>k+1)}};
    // Supersets run in rounds: A1 -> B1 -> rest -> A2 -> B2 ... Rest only comes at the end of a round;
    // warm-ups (rest 0) and single-exercise blocks just go straight through.
    const doneN=(allData||[]).filter(s=>s&&s.done).length;
    const [si,ei]=String(rowId).split('_').map(Number);
    const block=day.supersets[si];
    const left=(e,j)=>{const id=getEid(e.eid);const done=(j===ei)?doneN:((logData[id]||[]).filter(s=>s&&s.done).length);return (setsOverride[id]||e.sets)-done};
    const goTo=(rid)=>{setOpenRow(rid);setTimeout(()=>{const el=document.getElementById('row-'+rid);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},300)};
    if(block&&block.rest>0&&block.exercises.length>1){
      const n=block.exercises.length;
      let nxt=-1;
      for(let k=1;k<=n;k++){const j=(ei+k)%n;if(left(block.exercises[j],j)>0){nxt=j;break}}
      if(nxt>ei){goTo(si+'_'+nxt);return}          // same round: straight to the next exercise, no rest
      startRest();
      if(nxt>=0){goTo(si+'_'+nxt);return}          // round done: rest, then start the next round
    } else {
      startRest();
      if(left(block?block.exercises[ei]:ex,ei)>0)return; // more sets of this exercise
    }
    // Block finished: open the next unfinished exercise anywhere in the day
    const rows=[];
    day.supersets.forEach((ss,bi)=>ss.exercises.forEach((e,j)=>{
      const id=getEid(e.eid);const rid=bi+'_'+j;
      const dc=(rid===rowId)?doneN:((logData[id]||[]).filter(s=>s&&s.done).length);
      rows.push({rid,complete:dc>=(setsOverride[id]||e.sets)});
    }));
    const ci=rows.findIndex(r=>r.rid===rowId);
    const next=rows.slice(ci+1).find(r=>!r.complete)||rows.find(r=>!r.complete&&r.rid!==rowId);
    if(next)goTo(next.rid);else setOpenRow(null);
  };

  const finishWorkout=()=>{
    timer.stop();
    const exDone=allExercises.filter(ex=>{const d=logData[getEid(ex.eid)]||[];return d.some(s=>s.done)}).length;
    const kcal=estCalories(timer.elapsed,totalVolume,bw);
    const prs=ld('prs',{});
    let newPRs=0;
    allExercises.forEach(ex=>{
      const pr=prs[getEid(ex.eid)];
      if(pr&&pr.date===today())newPRs++;
    });
    const doneMap={};allExercises.forEach(ex=>{const id=getEid(ex.eid);const n=Math.min(planned(ex),doneOf(ex));if(n)doneMap[id]=(doneMap[id]||0)+n});
    const record={day:day.name,phase,trainPhase:ld('phase',1),len:ld('sessionLen','m45'),date:today(),duration:timer.elapsed,pain,rpe,notes,pct,exercises:exDone,
      totalExercises:allExercises.length,volume:totalVolume,calories:kcal,newPRs,kneePre,calfPre,doneSets:doneMap};
    try{localStorage.removeItem(PRE_RESTORE)}catch(e){} // new training since a restore: undoing it would lose this workout
    const history=ld('history',[]);
    history.unshift(record);
    sv('history',history);
    const wk=ld('weekDone',{});
    wk[day.name]=today();
    sv('weekDone',wk);
    setShowComplete({pct,exercises:exDone,duration:timer.elapsed,kcal,newPRs});
  };

  return (
    <div className="app">
      <div className="hdr">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button className="btn btn-s" style={{padding:'6px 10px',fontSize:13}} onClick={()=>{timer.stop();onBack()}}>Back</button>
              <h1 style={{fontSize:20}}>{day.name}</h1>
            </div>
            <div style={{display:'flex',gap:8,marginTop:4}}>
              {day.focus.map(f=><span key={f} className="focus-tag" style={{background:'var(--c2)'}}>{f}</span>)}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
            <div className="session-timer">{fmtTime(timer.elapsed)}</div>
            <button className="btn btn-s" style={{padding:'2px 8px',fontSize:10}}
              onClick={()=>{const v=!restEnabled;setRestEnabled(v);sv('restEnabled',v);if(!v)setRestSecs(null)}}>{restEnabled?'Rest: ON':'Rest: OFF'}</button>
          </div>
        </div>
        <div className="prg"><div className="prg-f" style={{width:pct+'%'}} /></div>
      </div>
      <div className="scroll">
        <div className="card" style={{padding:'10px 14px'}}>
          <div style={{fontSize:11,color:'var(--t2)',marginBottom:6}}>Muscles worked today <span style={{color:'var(--t3)'}}>· solid = direct · dashed = assisted</span></div>
          <MuscleChips day={applySwaps(day,swaps)} />
        </div>
        <div className="card" style={{padding:16,borderLeft:'3px solid var(--cyn)'}}>
          <div style={{fontSize:14,fontWeight:600,marginBottom:10}}>Pre-Workout Check-In</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:13,color:'var(--t2)',marginBottom:6}}>Knee pain (0=none, 5=severe)</div>
            <div className="pain-row">
              {[0,1,2,3,4,5].map(v=>{
                const c=['var(--grn)','#7bc67e','var(--yel)','var(--org)','var(--red)','#cc2020'][v];
                return <div key={v} className="pain-dot" style={{background:kneePre===v?c:'var(--c2)',borderColor:kneePre===v?c:'var(--c3)',color:kneePre===v?'#000':'var(--t2)'}}
                  onClick={()=>{vb();setKneePre(v)}}>{v}</div>;
              })}
            </div>
          </div>
          <div>
            <div style={{fontSize:13,color:'var(--t2)',marginBottom:6}}>Calf tightness (0=none, 5=very tight)</div>
            <div className="pain-row">
              {[0,1,2,3,4,5].map(v=>{
                const c=['var(--grn)','#7bc67e','var(--yel)','var(--org)','var(--red)','#cc2020'][v];
                return <div key={v} className="pain-dot" style={{background:calfPre===v?c:'var(--c2)',borderColor:calfPre===v?c:'var(--c3)',color:calfPre===v?'#000':'var(--t2)'}}
                  onClick={()=>{vb();setCalfPre(v)}}>{v}</div>;
              })}
            </div>
          </div>
        </div>
        {day.gate==='knee'&&(()=>{
          const calfOn=!!day.calfGate;
          const stop=kneePre>=3||(calfOn&&calfPre>=3);
          const caution=!stop&&(kneePre===2||(calfOn&&calfPre===2));
          const what=kneePre>=3?`Knee pain ${kneePre}/5`:`Calf tightness ${calfPre}/5`;
          if(stop)return (
            <div className="card" role="alert" style={{padding:14,borderLeft:'3px solid var(--red)',background:'var(--red-d)'}}>
              <div style={{fontSize:14,fontWeight:700,color:'var(--red)',marginBottom:4}}>{what} — skip the jumps today</div>
              <div style={{fontSize:12,color:'var(--t1)',lineHeight:1.5}}>Impact work while it's sore risks a flare-up. Do the Band or Core session instead, or rest and re-check next time. If this keeps happening, check in with your physio.</div>
            </div>
          );
          if(caution)return (
            <div className="card" style={{padding:12,borderLeft:'3px solid var(--org)',fontSize:12,color:'var(--t2)'}}>
              At 2/5: keep every landing soft and quiet, cut the reps if it climbs, and stop if it hits 3.
            </div>
          );
          return null;
        })()}
        {day.supersets.map((ss,si)=>{
          const isFinisher=ss.label.includes('Finisher');
          return (
            <div key={si} className="card">
              <div className="ss-h" style={{padding:'12px 16px'}}>
                <span className="ss-label">{ss.label}</span>
                <span className="ss-type" style={{background:isFinisher?'var(--red-d)':'var(--blu)',color:isFinisher?'var(--red)':'#fff'}}>
                  {isFinisher?ss.type:ss.type||'Strength'}
                </span>
                <span style={{fontSize:11,color:'var(--t3)',marginLeft:'auto'}}>Rest: {Math.round((ss.rest||0)*restMul)}s</span>
              </div>
              {ss.exercises.map((ex,ei)=>{
                const eid=getEid(ex.eid);
                const sets=setsOverride[eid]||ex.sets;
                const rowId=si+'_'+ei;
                return <ExCard key={eid+ei} ex={{...ex,eid,origEid:ex.eid,rest:ss.rest}} exData={logData[eid]||[]} sets={sets}
                  rowId={rowId} open={openRow===rowId} onToggle={()=>setOpenRow(openRow===rowId?null:rowId)}
                  onUpdate={d=>{const l={...logData};l[eid]=d;setLogData(l)}}
                  onDone={handleSetDone}
                  onSwap={handleSwap}
                  onSetsDelta={delta=>{
                    const cur=setsOverride[eid]||ex.sets;
                    const logged=(logData[eid]||[]).reduce((m,s,i)=>s&&s.done?i+1:m,0); // never hide a logged set
                    const next=Math.max(1,logged,cur+delta);
                    setSetsOverride(p=>({...p,[eid]:next}));
                  }} />;
              })}
            </div>
          );
        })}
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:17,fontWeight:600,marginBottom:12}}>Finish Workout</div>
          <PainScale value={pain} onChange={setPain} />
          <div style={{height:12}} />
          <RPESelector value={rpe} onChange={setRpe} />
          <textarea style={{width:'100%',height:60,background:'var(--c2)',border:'1.5px solid var(--c3)',borderRadius:10,padding:10,color:'var(--t1)',fontFamily:'inherit',fontSize:14,resize:'none',marginTop:8}}
            placeholder="Notes..." value={notes} onChange={e=>setNotes(e.target.value)} />
          <button className="btn btn-g" style={{width:'100%',marginTop:12}} onClick={finishWorkout}>
            Save Workout ({fmtTime(timer.elapsed)})
          </button>
        </div>
      </div>
      {restSecs && <RestTimer key={restKey} seconds={restSecs} onDone={()=>setRestSecs(null)} />}
      {showComplete && <CompletionSummary stats={showComplete} onClose={()=>{setShowComplete(null);onBack()}} />}
    </div>
  );
};

// === SESSION LENGTH ===
// Session-length options shown on the Workout tab (45 min is the default).
const SESSION_MODES=[
  {id:'m35',label:'35 min',mins:'~35m'},
  {id:'m45',label:'45 min',mins:'~45m'},
  {id:'full',label:'Full',mins:'~60m'}
];
// Each program exercise carries k: 1 = kept at 35/45/Full, 2 = 45 + Full, 3 = Full only (default).
// Days are designed so the k:1 skeleton alone is a complete full-body session. At 35/45 min sets are
// capped at 3; r35 swaps in shorter reps (e.g. warm-up cardio) for the 35-minute session only.
const SESSION_LEVEL={m35:1,m45:2,full:3};
const trimDay=(day,mode)=>{
  const lvl=SESSION_LEVEL[mode]||3;
  if(lvl>=3)return day;
  const supersets=day.supersets
    .map(ss=>({...ss,exercises:ss.exercises
      .filter(ex=>(ex.k||3)<=lvl)
      .map(ex=>({...ex,sets:Math.min(ex.sets,3),...(lvl===1&&ex.r35?{reps:ex.r35}:{})}))}))
    .filter(ss=>ss.exercises.length);
  return {...day,supersets};
};
// Rough session-time estimate in minutes (work + rest + transitions)
const estDayMinutes=(day)=>{
  let sec=0;
  day.supersets.forEach(ss=>{
    sec+=35; // block setup/transition
    ss.exercises.forEach(ex=>{
      const info=exMap[ex.eid];const reps=String(ex.reps);
      let per;
      if(/min/.test(reps))per=(parseInt(reps)||5)*60;
      else if(info&&(info.t==='d'||info.t==='c'))per=(parseInt(reps)||40)+15+(ss.rest||20);
      else per=50+(ss.rest||30); // ~50s work incl. unrack/re-rack, + block rest
      sec+=(ex.sets||1)*per+15; // +15s per-exercise setup
    });
  });
  return Math.round(sec/60);
};

s']],latpd:[['Back'],['Arms']],latraise:[['Shoulders'],[]],latstick:[['Glutes','Quads'],['Calves']],legcurl:[['Hamstrings'],[]],lowboxjump:[['Quads','Glutes'],['Calves']],mtclimb:[['Core'],[]],nordicham:[['Hamstrings'],[]],ohext:[['Arms'],[]],pallof:[['Core'],[]],plank:[['Core'],[]],pullup:[['Back'],['Arms']],pushup:[['Chest'],['Arms','Shoulders','Core']],rdelt:[['Shoulders'],['Back']],rdl:[['Hamstrings','Glutes'],['Back']],revcrunch:[['Core'],[]],revlunge:[['Quads','Glutes'],[]],ropepush:[['Arms'],[]],sandbagcarry:[['Core'],['Back']],seatedcalf:[['Calves'],[]],seatlegext:[['Quads'],[]],shortarcext:[['Quads'],[]],sideplank:[['Core'],[]],skierswing:[['Glutes','Hamstrings'],['Core','Shoulders']],slcalf:[['Calves'],[]],sledpush:[['Quads','Glutes'],['Calves']],slhop:[['Calves','Quads'],['Glutes']],sllathop:[['Calves','Glutes'],['Quads']],slraise:[['Quads'],[]],slrdl:[['Hamstrings','Glutes'],[]],snapdown:[['Quads','Glutes'],['Calves']],staggerpallof:[['Core'],[]],starplank:[['Core'],['Shoulders']],suitcasecarry:[['Core'],['Back']],tbarrow:[['Back'],['Arms']],tibraise:[['Calves'],[]],tke:[['Quads'],[]],trapbar:[['Quads','Glutes','Hamstrings'],['Back']],tripdip:[['Arms'],[]],vacuum:[['Core'],[]],wallsit:[['Quads'],[]],wtpullup:[['Back'],['Arms']]};
// Fallback for custom/other exercises: match their free-text muscle field by keyword (case-insensitive)
const MUSCLE_KEYWORDS=[['Quads',/quad|vmo|thigh/],['Hamstrings',/ham/],['Glutes',/glute|hip/],['Calves',/calf|calves|shin|tib/],['Chest',/chest|pec/],['Back',/back|lat|trap|row/],['Shoulders',/shoulder|delt/],['Arms',/arm|bicep|tricep|forearm/],['Core',/core|ab|oblique|full body/]];
const musclesFromText=(m)=>{const t=String(m||'').toLowerCase();if(t==='legs')return['Quads','Glutes'];return MUSCLE_KEYWORDS.filter(([,re])=>re.test(t)).map(([g])=>g)};
const sessionCoverage=(day)=>{
  const direct=new Set(),any=new Set();
  day.supersets.forEach(ss=>ss.exercises.forEach(ex=>{
    const m=MUSCLE_MAP[ex.eid]||MUSCLE_MAP[ex.origEid];
    (m?m[0]:musclesFromText((exMap[ex.eid]||{}).m)).forEach(g=>{direct.add(g);any.add(g)});
    (m?m[1]:[]).forEach(g=>any.add(g));
  }));
  return {direct:MUSCLE_GROUPS.filter(g=>direct.has(g)),any:MUSCLE_GROUPS.filter(g=>any.has(g))};
};
// Swaps are keyed by the program's original exercise id and apply wherever that exercise appears.
// A swap is ignored if its target no longer exists (deleted custom exercise) or is already in the same
// day (it would create two rows sharing one set log).
const dayExerciseIds=(day)=>new Set(day.supersets.flatMap(ss=>ss.exercises.map(e=>e.eid)));
const resolveSwap=(eid,swaps,dayIds)=>{const t=swaps&&swaps[eid];return (t&&t!==eid&&exMap[t]&&!(dayIds&&dayIds.has(t)))?t:eid};
// Apply the user's exercise swaps to a day (keeping the original id for muscle lookups)
const applySwaps=(day,swaps=ld('swaps',{}))=>{const ids=dayExerciseIds(day);return {...day,supersets:day.supersets.map(ss=>({...ss,exercises:ss.exercises.map(ex=>{const t=resolveSwap(ex.eid,swaps,ids);return t!==ex.eid?{...ex,eid:t,origEid:ex.eid}:ex})}))}};

};

  const phaseStart=ld('phaseStart',today());
  const weekDone=ld('weekDone',{});
  const daysSinceStart=Math.max(0,Math.floor((new Date()-new Date(phaseStart))/(86400000)));
  const weekNum=Math.floor(daysSinceStart/7)+1;
  const days=getProgramDays(phase).map(d=>trimDay(d,sessionLen));

  const changePhase=(p)=>{setPhase(p);sv('phase',p);if(p!==phase){sv('phaseStart',today());sv('weekDone',{})}};
  const changeLen=(m)=>{setSessionLen(m);sv('sessionLen',m)};
  const newWeek=()=>{
    if(!confirm('Start a new week?\n\nThis clears this week\'s logged sets, set changes and check-ins for all days in this phase so you get a fresh board. Your saved workouts, PRs and progress are kept.'))return;
    days.forEach(d=>{
      const k=d.name.replace(/\s/g,'')+'_p'+phase;
      rm('dayLog_'+k);rm('setsOverride_'+k);rm('dayCheckin_'+k);
    });
    OPTIONAL_SESSIONS.forEach(o=>{
      const k=dayStoreKey(o.get(phase),o.key);
      rm('dayLog_'+k);rm('setsOverride_'+k);rm('dayCheckin_'+k);
    });
    sv('weekDone',{});
    window.location.reload();
  };

  const dayPct=(day,ph=phase)=>{
    const logData=cleanLog(ld('dayLog_'+day.name.replace(/\s/g,'')+'_p'+ph,{}));
    const setsOvr=ld('setsOverride_'+day.name.replace(/\s/g,'')+'_p'+ph,{});
    const swapMap=ld('swaps',{});const ids=dayExerciseIds(day);const id=(eid)=>resolveSwap(eid,swapMap,ids);
    const allEx=day.supersets.flatMap(s=>s.exercises);
    const plan=(ex)=>setsOvr[id(ex.eid)]||ex.sets;
    const total=allEx.reduce((a,ex)=>a+plan(ex),0);
    const done=allEx.reduce((a,ex)=>{const d=logData[id(ex.eid)]||[];return a+Math.min(plan(ex),d.filter(s=>s.done).length)},0);
    return total>0?Math.round(done/total*100):0;
  };

  return (
    <>
      <div className="hdr">
        <h1>Workout</h1>
        <p>v__VERSION_SHORT__ · Calf Rebuild + Knee-Safe · Full Body Split</p>
      </div>
      <div className="scroll">
        <FirstRunRestore showToast={showToast} />
        <TodayCard days={days} weekDone={weekDone} phase={phase} onOpenDay={onOpenDay} />
        <div className="phase-sel">
          {[1,2,3,4].map(p=>(
            <button key={p} className={'phase-btn'+(phase===p?' on':'')} onClick={()=>changePhase(p)}>
              P{p}: {PHASE_NAMES[p-1]}
            </button>
          ))}
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'var(--t3)',marginBottom:6,textTransform:'uppercase',letterSpacing:0.5}}>Session length</div>
          <div style={{display:'flex',gap:8}}>
            {SESSION_MODES.map(m=>(
              <button key={m.id} className={'phase-btn'+(sessionLen===m.id?' on':'')} style={{flex:1,textAlign:'center'}} onClick={()=>changeLen(m.id)}>
                {m.label}<div style={{fontSize:10,color:'var(--t3)',fontWeight:400}}>{m.mins}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontSize:14,color:'var(--t2)'}}>Week {weekNum}</div>
          <button className="btn btn-s" style={{fontSize:12,padding:'6px 12px'}} onClick={newWeek}>New Week</button>
        </div>
        {days.map((day,i)=>{
          const p=dayPct(day);
          const isDone=weekDone[day.name];
          return (
            <div key={i} className="card" onClick={()=>onOpenDay(day,phase)} style={{cursor:'pointer'}}>
              <div className="card-h">
                <div>
                  <h3>{day.name}</h3>
                  <div className="sub">{day.focus.join(' + ')} · ~{estDayMinutes(day)}m · {sessionCoverage(applySwaps(day)).any.length}/9 muscles</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {isDone && <span className="badge badge-g">Done</span>}
                  {p>0&&!isDone && <span className="badge badge-o">{p}%</span>}
                  <span style={{fontSize:20,color:'var(--t3)'}}>{'>'}</span>
                </div>
              </div>
              <div style={{padding:'0 16px 12px'}}>
                <div className="prg"><div className="prg-f" style={{width:p+'%'}} /></div>
              </div>
            </div>
          );
        })}
        <div style={{fontSize:11,color:'var(--t3)',margin:'8px 0 6px',textTransform:'uppercase',letterSpacing:0.5}}>Optional add-ons</div>
        {OPTIONAL_SESSIONS.map(o=>{
          const d=o.get(phase);
          const p=dayPct(d,o.key);
          const isDone=weekDone[d.name];
          return (
            <div key={o.key} className="card" onClick={()=>onOpenDay(d,o.key)} style={{cursor:'pointer',borderLeft:'3px solid '+o.color}}>
              <div className="card-h">
                <div>
                  <h3>{d.name}</h3>
                  <div className="sub">{d.focus.join(' + ')} · ~{estDayMinutes(d)}m</div>

                </div>

              <div style={{padding:'0 16px 4px',fontSize:12,color:'var(--t2)'}}>{o.blurb}</div>
              <div style={{padding:'6px 16px 12px'}}>
                <div className="prg"><div className="prg-f" style={{width:p+'%',background:o.color}} /></div>
              </div>

          );
        })}

};

  const bw=ld('bodyweight',80);

  const saveRun=()=>{
    const d=parseFloat(dist);const m=parseInt(dur);
    if(!d||d<=0)return;
    const cal=estRunCal(d,bw);
    const pace=m>0?Math.round(m/d*100)/100:0;
    const entry={date:today(),dist:d,dur:m||0,pace,type:runType,cal};
    const log=[entry,...runs];
    sv('runLog',log);setRuns(log);
    setDist('');setDur('');setRunType('easy');

  const deleteRun=(i)=>{
    if(!confirm('Delete this run?'))return;

  const weekRuns=runs.filter(r=>(new Date()-new Date(r.date))/86400000<7);
  const weekKm=weekRuns.reduce((a,r)=>a+r.dist,0);

          {['easy','tempo','interval','long'].map(t=>(
            <button key={t} className={'btn'+(runType===t?' btn-g':' btn-s')} style={{padding:'6px 12px',fontSize:13,textTransform:'capitalize'}} onClick={()=>setRunType(t)}>{t}</button>

        <div className="stat-card"><div className="val">{weekCal}</div><div className="lbl">run kcal this week</div></div>

        <div key={i} className="hist-item">
          <div>
            <div style={{fontWeight:600,fontSize:15}}>{r.dist}km &middot; {r.type}</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>{fmtDate(r.date)}{r.dur>0?' · '+r.dur+'min':''}{r.pace>0?' · '+r.pace.toFixed(1)+' min/km':''} &middot; {r.cal} kcal</div>
          </div>
          <button style={{background:'none',border:'none',color:'var(--red)',fontSize:16,cursor:'pointer',padding:4}} onClick={()=>deleteRun(i)}>X</button>
        </div>

};

  const todayKey=today();
  const[todayGrams,setTodayGrams]=useState(()=>{const log=ld('proteinLog',{});return log[todayKey]||0});

  const addProtein=(g)=>{
    const log=ld('proteinLog',{});
    const newVal=(log[todayKey]||0)+g;
    log[todayKey]=newVal;
    sv('proteinLog',log);
    setTodayGrams(newVal);
  };

  const resetToday=()=>{
    const log=ld('proteinLog',{});

    sv('proteinLog',log);
    setTodayGrams(0);

  const pct=target>0?Math.min(100,Math.round(todayGrams/target*100)):0;

        <div className="prg" style={{height:10,marginBottom:12}}>
          <div className="prg-f" style={{width:pct+'%',background:pct>=100?'var(--grn)':'var(--org)'}} />
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          {[20,30,40,50].map(g=>(

// === PROGRESS TAB ===
const ProgressTab=({showToast})=>{
  const history=ld('history',[]);
  const weightLog=ld('weightLog',[]);
  const prs=ld('prs',{});
  const bw=ld('bodyweight',80);
  const runLog=ld('runLog',[]);
  const proteinLog=ld('proteinLog',{});

  const totalWorkouts=history.length;
  const thisWeek=history.filter(h=>{const d=new Date(h.date);const now=new Date();const diff=(now-d)/86400000;return diff<7}).length;
  const totalKcal=history.reduce((a,h)=>a+(h.calories||0),0);

  let streak=0;
  const sortedDates=[...new Set(history.map(h=>h.date))].sort().reverse();
  if(sortedDates.length>0){
    let cur=new Date();cur.setHours(0,0,0,0);
    for(let i=0;i<sortedDates.length;i++){
      const d=new Date(sortedDates[i]);d.setHours(0,0,0,0);
      const diff=Math.round((cur-d)/86400000);
      if(diff<=1){streak++;cur=d}else break;
    }
  }

  const calDays=[];
  const now=new Date();
  for(let i=55;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const count=history.filter(h=>h.date===ds).length;
    calDays.push({date:ds,count,day:d.getDay()});
  }

  const lastWeek=history.filter(h=>{const d=(new Date()-new Date(h.date))/86400000;return d>=7&&d<14}).length;

  const acuteLoad=history.filter(h=>(new Date()-new Date(h.date))/86400000<7).reduce((a,h)=>a+(h.volume||0),0);
  const chronicLoad=history.filter(h=>(new Date()-new Date(h.date))/86400000<28).reduce((a,h)=>a+(h.volume||0),0)/4;
  const acwr=chronicLoad>0?(acuteLoad/chronicLoad).toFixed(2):0;
  const acwrPct=Math.min(100,Math.max(0,(parseFloat(acwr)/2)*100));

  const recentHist=history.filter(h=>(new Date()-new Date(h.date))/86400000<7);
  // Direct sets per muscle group this week. Uses the sets actually logged (v20+ records); older records
  // fall back to the planned day.
  const muscleVol={};
  const addSets=(eid,n)=>{const m=MUSCLE_MAP[eid];const groups=m?m[0]:musclesFromText((exMap[eid]||{}).m);groups.forEach(g=>{muscleVol[g]=(muscleVol[g]||0)+n})};
  recentHist.forEach(h=>{
    if(h.doneSets&&typeof h.doneSets==='object'){Object.entries(h.doneSets).forEach(([eid,n])=>addSets(eid,Number(n)||0));return}
    const dayData=dayForHistory(h);
    if(dayData)dayData.supersets.flatMap(s=>s.exercises).forEach(ex=>addSets(ex.eid,ex.sets));
  });
  const maxVol=Math.max(1,...Object.values(muscleVol));

  const prList=Object.entries(prs).map(([eid,data])=>({eid,name:exMap[eid]?.n||eid,...data})).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const e1rmLog=ld('e1rmLog',{});
  // Most recently trained lifts first, so lifts dropped from the program don't crowd out the current ones
  const lastLogged=(d)=>(d[d.length-1]&&d[d.length-1].date)||'';
  const recentCutoff=new Date(Date.now()-56*86400000).toISOString().slice(0,10);
  const e1rmExercises=Object.entries(e1rmLog).filter(([,data])=>Array.isArray(data)&&data.length>=2)
    .sort((a,b)=>lastLogged(b[1]).localeCompare(lastLogged(a[1]))||b[1].length-a[1].length).slice(0,8);

  const checkinHistory=history.filter(h=>h.kneePre!==undefined).slice(0,20);

  const strengthData={};
  history.slice(0,20).reverse().forEach(h=>{
    if(h.day&&h.date){
      if(!strengthData[h.day])strengthData[h.day]=[];
      strengthData[h.day].push({date:h.date,vol:h.volume||0});
    }
  });

  const deleteHist=(idx)=>{const h=[...history];h.splice(idx,1);sv('history',h);window.location.reload()};

  const weekWorkoutKcal=recentHist.reduce((a,h)=>a+(h.calories||0),0);
  const weekRunsP=runLog.filter(r=>(new Date()-new Date(r.date))/86400000<7);
  const weekRunKm=weekRunsP.reduce((a,r)=>a+r.dist,0);
  const weekRunKcal=weekRunsP.reduce((a,r)=>a+(r.cal||0),0);
  const weekTotalKcal=weekWorkoutKcal+weekRunKcal;
  const proteinTarget=Math.round(bw*2);
  const proteinDays7=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);proteinDays7.push(d.toISOString().slice(0,10))}
  const proteinCompDays=proteinDays7.filter(k=>(proteinLog[k]||0)>=proteinTarget).length;
  // --- Weight-loss regression forecast (least-squares over last 28d) ---
  const goalW=ld('weightGoal',75);
  const curW=weightLog.length?weightLog[weightLog.length-1].kg:bw;
  let weeklyWeightRate=0,pctPerWk=0,wlFlag=null,etaWeeks=null,etaDate=null,wlSpanDays=0;
  if(weightLog.length>=2){
    const sortedW=[...weightLog].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const t0=new Date(sortedW[0].date);
    const allPts=sortedW.map(w=>({x:(new Date(w.date)-t0)/86400000,y:w.kg}));
    const maxX=allPts[allPts.length-1].x;
    const pts=allPts.filter(p=>p.x>=maxX-28);
    const use=pts.length>=2?pts:allPts;
    wlSpanDays=use[use.length-1].x-use[0].x;
    weeklyWeightRate=Math.round(linSlope(use)*7*100)/100;
    pctPerWk=curW>0?Math.round(weeklyWeightRate/curW*1000)/10:0;
    if(wlSpanDays>=7){
      if(pctPerWk<=-1)wlFlag={c:'var(--red)',bg:'var(--red-d)',t:'Losing >1%/wk — too fast. A deficit this steep burns muscle and stalls your lifts. Ease it back ~200–300 kcal/day.'};
      else if(pctPerWk<=-0.5)wlFlag={c:'var(--grn)',bg:'var(--grn-d)',t:'Ideal rate (0.5–1%/wk) — fast enough to progress, slow enough to keep muscle while you rebuild.'};
      else if(pctPerWk<0)wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Slow, conservative loss. Fine if you feel strong; nudge the deficit for faster results.'};
      else if(pctPerWk<0.15)wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Plateaued 2+ weeks. If loss is the goal, tighten intake or add a run/finisher.'};
      else wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Trending up — expected during a strength push; watch it if fat loss is the priority.'};
    }
    if(weeklyWeightRate<0&&curW>goalW){
      etaWeeks=Math.ceil((curW-goalW)/(-weeklyWeightRate));
      if(etaWeeks>0&&etaWeeks<520){const dd=new Date();dd.setDate(dd.getDate()+etaWeeks*7);etaDate=dd.toISOString().slice(0,10);}
    }
  }

  const readiness=computeReadiness(history,acwr);

  // --- Relative strength: e1RM ÷ bodyweight per lift ---
  const bwAtDate=(date)=>{if(!weightLog.length)return bw;let best=weightLog[0],bd=Infinity;weightLog.forEach(w=>{const dd=Math.abs(new Date(w.date)-new Date(date));if(dd<bd){bd=dd;best=w}});return best.kg||bw;};
  const relStrength=e1rmExercises.map(([eid,data])=>{
    const latest=data[data.length-1],first=data[0];
    const rNow=latest.e1rm/bwAtDate(latest.date);
    const rThen=first.e1rm/bwAtDate(first.date);
    const pct=rThen>0?Math.round((rNow-rThen)/rThen*100):0;
    return{eid,name:exMap[eid]?.n||eid,rNow:Math.round(rNow*100)/100,pct,rawKg:Math.round((latest.e1rm-first.e1rm)*10)/10};
  }).filter(x=>x.rNow>0);

  // --- Stall detection: no e1RM improvement in last 3 sessions ---
  const stalledLifts=[];let progressingCount=0;
  Object.entries(e1rmLog).forEach(([eid,data])=>{
    if(!Array.isArray(data)||data.length<3||lastLogged(data)<recentCutoff)return; // not trained in 8 weeks
    if(data[data.length-1].e1rm<=data[data.length-3].e1rm)stalledLifts.push({name:exMap[eid]?.n||eid,e1rm:data[data.length-1].e1rm});
    else progressingCount++;
  });

  // --- Weekly volume vs growth landmarks (~10-20 sets/wk primary muscles) ---
  const PRIMARY=MUSCLE_GROUPS;
  const volStatus=(m,v)=>{if(!PRIMARY.includes(m))return null;if(v<8)return{c:'var(--org)',l:'low'};if(v>22)return{c:'var(--red)',l:'high'};return{c:'var(--grn)',l:'ok'};};

  return (
    <>
      <div className="hdr"><h1>Progress</h1></div>
      <div className="scroll">
        <div className="stat-grid">
          <div className="stat-card"><div className="val">{totalWorkouts}</div><div className="lbl">Total Workouts</div></div>
          <div className="stat-card"><div className="val">{thisWeek}</div><div className="lbl">This Week</div></div>
          <div className="stat-card"><div className="val">{streak}</div><div className="lbl">Day Streak</div></div>

              <div style={{display:'flex',justifyContent:'space-between',marginBottom:stalledLifts.length>0?10:0}}>

        <div className="section-t">Recent Workouts</div>
        {history.slice(0,15).map((h,i)=>(
          <div key={i} className="hist-item">
            <div>
              <div style={{fontWeight:600,fontSize:15}}>{h.day}</div>
              <div style={{fontSize:12,color:'var(--t2)'}}>{fmtDate(h.date)} · {fmtTime(h.duration||0)} · {h.calories||0} kcal</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span className="badge badge-g">{h.pct}%</span>
              <button style={{background:'none',border:'none',color:'var(--red)',fontSize:16,cursor:'pointer',padding:4}}

        {prList.length>0 && (

            <div className="section-t">Personal Records</div>

                <span className="badge badge-p">{fmtDate(pr.date)}</span>

        <RunningLog showToast={showToast} />

    </>
  );
};

// === LIBRARY CARD ===
const LibraryCard=({ex})=>{
  const[showAlts,setShowAlts]=useState(false);
  const tagLabels={k:'KS',e:'EC',p:'PW',b:'BL',t:'TR',f:'FT'};
  const alts=EXDB.filter(e=>e.m===ex.m&&e.id!==ex.id);
  const altsByEq={};
  alts.forEach(a=>{if(!altsByEq[a.eq])altsByEq[a.eq]=[];altsByEq[a.eq].push(a)});
  const typeLabel=ex.t==='w'?'Weighted':(ex.t==='d'||ex.t==='c')?'Timed':'Bodyweight';
  const delCustom=()=>{
    if(!confirm('Delete "'+ex.n+'" from your exercises?'))return;
    sv('customExercises',ld('customExercises',[]).filter(c=>c.id!==ex.id));
    const sw=ld('swaps',{});Object.keys(sw).forEach(k=>{if(sw[k]===ex.id)delete sw[k]});sv('swaps',sw); // workouts go back to the original exercise
    window.location.reload();
  };
  return (
    <div className="card" style={{padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:600}}>{ex.n}</div>
          <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{ex.m} · {ex.eq} · {typeLabel}</div>
        </div>
        <div style={{display:'flex',gap:3,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {ex.custom&&<span className="ex-tag" style={{background:'var(--org-d)',color:'var(--org)'}}>Custom</span>}
          {(ex.tags||[]).map(t=><span key={t} className={'ex-tag tag-'+t}>{tagLabels[t]||t}</span>)}
        </div>
      </div>
      {ex.note && <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>{ex.note}</div>}
      {ex.custom&&<button className="btn" style={{width:'100%',marginTop:8,fontSize:11,padding:'6px 0',background:'var(--red-d)',color:'var(--red)'}} onClick={delCustom}>Delete Exercise</button>}
      {alts.length>0 && (
        <button className="btn btn-s" style={{width:'100%',marginTop:8,fontSize:11,padding:'6px 0'}}
          onClick={()=>setShowAlts(!showAlts)}>
          {showAlts?'Hide':'Show'} Alternatives ({alts.length})
        </button>
      )}
      {showAlts && (
        <div style={{marginTop:8,borderTop:'0.5px solid var(--sep)',paddingTop:8}}>
          {Object.entries(altsByEq).map(([eq,exs])=>(
            <div key={eq} style={{marginBottom:6}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--org)',marginBottom:2}}>{eq}</div>
              {exs.map(a=>(
                <div key={a.id} style={{padding:'3px 0 3px 8px',fontSize:13}}>
                  <span style={{fontWeight:500}}>{a.n}</span>
                  {a.note && <div style={{fontSize:11,color:'var(--t3)',marginTop:1}}>{a.note}</div>}
                </div>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// === ADD CUSTOM EXERCISE FORM ===
const AddExerciseForm=({muscleOptions,onAdded})=>{
  const[open,setOpen]=useState(false);
  const[n,setN]=useState('');
  const[m,setM]=useState('');
  const[t,setT]=useState('w');
  const[eq,setEq]=useState('');
  const[note,setNote]=useState('');
  const TYPES=[{v:'w',l:'Weighted',hint:'kg + reps'},{v:'r',l:'Bodyweight',hint:'reps only'},{v:'d',l:'Timed',hint:'seconds'}];
  const defEq=t==='w'?'Dumbbell':'Bodyweight';
  const save=()=>{
    const name=n.trim();const mus=m.trim();
    if(!name||!mus)return;
    const ex={id:'custom_'+Date.now(),n:name,m:mus,t,eq:(eq.trim()||defEq),tags:['k'],note:note.trim(),custom:true};
    sv('customExercises',[...ld('customExercises',[]),ex]);
    onAdded&&onAdded(name);
    window.location.reload();
  };
  if(!open)return (
    <button className="btn btn-g" style={{width:'100%',marginBottom:12}} onClick={()=>setOpen(true)}>＋ Add Your Own Exercise</button>
  );
  return (
    <div className="card" style={{padding:14,marginBottom:12,borderLeft:'3px solid var(--org)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:15,fontWeight:700}}>Add Exercise</div>
        <button className="btn btn-s" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>setOpen(false)}>Cancel</button>
      </div>
      <input className="inp" style={{width:'100%',textAlign:'left',paddingLeft:12,marginBottom:8}} placeholder="Exercise name" value={n} onChange={e=>setN(e.target.value)} />
      <div style={{fontSize:11,color:'var(--t2)',margin:'2px 0 4px'}}>Type</div>
      <div style={{display:'flex',gap:6,marginBottom:8}}>
        {TYPES.map(x=>(
          <button key={x.v} className={'btn'+(t===x.v?' btn-g':' btn-s')} style={{flex:1,fontSize:12,padding:'8px 0'}} onClick={()=>setT(x.v)}>
            {x.l}<div style={{fontSize:9,fontWeight:400,opacity:0.8}}>{x.hint}</div>
          </button>
        ))}
      </div>
      <div style={{fontSize:11,color:'var(--t2)',margin:'2px 0 4px'}}>Muscle group</div>
      <input className="inp" style={{width:'100%',textAlign:'left',paddingLeft:12,marginBottom:6}} placeholder="e.g. Chest" value={m} onChange={e=>setM(e.target.value)} />

// === SETTINGS TAB ===
// === BACKUP & RESTORE ===
// Everything lives in this phone's storage, so backups are the safety net. iOS Home Screen apps can't
// reliably "download" files: export goes through the share sheet (Save to Files) with copy/paste as the
// method that always works. Restore validates everything before writing, snapshots the current data
// (undo), and rolls back if storage fills up part-way.
const PRE_RESTORE='ic17__preRestore';
// Device-only keys: never exported, never restored
const BACKUP_SKIP=['ic17_appVersion','ic17_updatedFrom','ic17_persisted','ic17_lastBackup','ic17_firstRunDismissed',PRE_RESTORE];
const historySummary=(json)=>{
  try{const h=JSON.parse(json||'[]');if(!Array.isArray(h))return{n:0,latest:null};
    return{n:h.length,latest:h.map(x=>x&&x.date).filter(Boolean).sort().pop()||null}}
  catch(e){return{n:0,latest:null}}
};
const backupJSON=()=>{
  const data={};
  Object.keys(localStorage).filter(k=>k.startsWith(P)&&!BACKUP_SKIP.includes(k)).forEach(k=>{data[k]=localStorage.getItem(k)});
  const s=historySummary(data[P+'history']);
  data._meta={app:'IronClad Pro',version:'__VERSION__',exportedAt:new Date().toISOString(),workouts:s.n,latest:s.latest};
  return JSON.stringify(data,null,1);
};
const markBackedUp=()=>{try{sv('lastBackup',today())}catch(e){}};
// Shapes the app relies on — a wrong shape here would crash a screen, so the whole restore is refused
const BACKUP_SHAPES={
  list:['history','weightLog','runLog','customExercises','dorsiflex'],
  record:['prs','e1rmLog','exHistory','proteinLog','weekDone','swaps'],
  number:['bodyweight','weightGoal','restTime','weeklyGoal'],
};
const backupValueProblem=(key,raw)=>{
  const name=key.slice(P.length);
  const strict=BACKUP_SHAPES.list.includes(name)||BACKUP_SHAPES.record.includes(name)||BACKUP_SHAPES.number.includes(name)||/^(dayLog_|setsOverride_|dayCheckin_)/.test(name)||name==='phase'||name==='measurements';
  let v;
  try{v=JSON.parse(raw)}catch(e){return strict?'is not valid data':null}
  const isRecord=v&&typeof v==='object'&&!Array.isArray(v);
  if(BACKUP_SHAPES.list.includes(name)&&!Array.isArray(v))return 'should be a list';
  if((BACKUP_SHAPES.record.includes(name)||/^(dayLog_|setsOverride_|dayCheckin_)/.test(name))&&!isRecord)return 'should be a record';
  // Older versions saved some numbers as text ("82.5") and measurements as a list — both still load fine
  if(BACKUP_SHAPES.number.includes(name)&&typeof v!=='number'&&!(typeof v==='string'&&isFinite(parseFloat(v))))return 'should be a number';
  if(name==='measurements'&&!(v&&typeof v==='object'))return 'should be a record';
  if(name==='phase'&&![1,2,3,4].includes(v))return 'should be 1-4';
  return null;
};
// Store legacy numeric strings as numbers so maths on them can't misbehave
const normalizeBackupValue=(key,raw)=>{
  if(!BACKUP_SHAPES.number.includes(key.slice(P.length)))return raw;
  try{const v=JSON.parse(raw);return typeof v==='string'?JSON.stringify(parseFloat(v)):raw}catch(e){return raw}
};
const restoreBackupText=(text,showToast)=>{
  let data;
  try{data=JSON.parse(String(text).trim())}catch(e){showToast('Import failed — that is not a valid backup');return false}
  if(!data||typeof data!=='object'||Array.isArray(data)){showToast('Import failed — that is not a valid backup');return false}
  const keys=Object.keys(data).filter(k=>k.startsWith(P)&&!BACKUP_SKIP.includes(k)&&typeof data[k]==='string');
  if(!keys.length){showToast('Import failed — no IronClad data found');return false}
  for(const k of keys){const prob=backupValueProblem(k,data[k]);if(prob){showToast('Import failed — "'+k.slice(P.length)+'" '+prob+'. Nothing was changed.');return false}}
  const b=historySummary(data[P+'history']),d=historySummary(localStorage.getItem(P+'history'));
  const newerHere=d.latest&&(!b.latest||d.latest>b.latest);
  const msg='Restore this backup?\n\nBackup: '+b.n+' workout'+(b.n===1?'':'s')+(b.latest?' (latest '+fmtDate(b.latest)+')':'')
    +'\nThis phone: '+d.n+' workout'+(d.n===1?'':'s')+(d.latest?' (latest '+fmtDate(d.latest)+')':'')
    +(newerHere?'\n\nWARNING: this phone has NEWER workouts than the backup. They will be replaced.':'')
    +'\n\nItems in the backup overwrite the same items here; anything else is kept. You can undo this in Settings.';
  if(!confirm(msg))return false;
  const prev={};keys.forEach(k=>{prev[k]=localStorage.getItem(k)});
  try{localStorage.setItem(PRE_RESTORE,JSON.stringify({at:new Date().toISOString(),prev}))}
  catch(e){showToast('Restore stopped — not enough space to keep an undo copy. Nothing was changed.');return false}
  try{keys.forEach(k=>localStorage.setItem(k,normalizeBackupValue(k,data[k])))}
  catch(e){
    // Roll back: drop keys that didn't exist before (frees space), then put the old values back
    keys.forEach(k=>{if(prev[k]===null){try{localStorage.removeItem(k)}catch(x){}}});
    keys.forEach(k=>{if(prev[k]!==null){try{localStorage.setItem(k,prev[k])}catch(x){}}});
    try{localStorage.removeItem(PRE_RESTORE)}catch(x){}
    showToast('Restore failed — your existing data was kept'+(e&&e.name==='QuotaExceededError'?' (storage full)':''));
    return false;
  }
  showToast('Backup restored — reloading...');
  setTimeout(()=>window.location.reload(),900);
  return true;
};
const hasRestoreSnapshot=()=>{try{return !!localStorage.getItem(PRE_RESTORE)}catch(e){return false}};
const undoLastRestore=(showToast)=>{
  let snap=null;try{snap=JSON.parse(localStorage.getItem(PRE_RESTORE)||'null')}catch(e){}
  if(!snap||!snap.prev){showToast('Nothing to undo');return}
  if(!confirm('Undo the last restore and put back the data you had before it?'))return;
  Object.entries(snap.prev).forEach(([k,v])=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}});
  try{localStorage.removeItem(PRE_RESTORE)}catch(e){}
  showToast('Restore undone — reloading...');
  setTimeout(()=>window.location.reload(),900);
};
const exportBackupFile=async(showToast)=>{
  const json=backupJSON();const name='ironclad-backup-'+today()+'.json';
  let shareErr=null;
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'IronClad backup'});
      markBackedUp();showToast('Backup shared — make sure it saved');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;if(e&&e.name==='InvalidStateError')return;shareErr=e}
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(e){}
  // We can't confirm a download actually saved on iOS, so don't claim it did
  showToast((shareErr?'Share failed. ':'')+'If no file saved, use Copy Backup instead');
};
const copyBackupText=async(showToast)=>{
  try{await navigator.clipboard.writeText(backupJSON());markBackedUp();showToast('Backup copied — paste it into Notes')}
  catch(e){showToast('Copy failed — use Export Backup instead')}
};
const importBackupFile=(e,showToast)=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(ev)=>restoreBackupText(ev.target.result,showToast);
  reader.readAsText(file);
  e.target.value='';
};

  // A new version downloaded in the background while the app was open (see the service worker script)
  const[updateReady,setUpdateReady]=useState(()=>!!window.__icUpdateReady);
  useEffect(()=>{const f=()=>setUpdateReady(true);window.addEventListener('ic-update-ready',f);return()=>window.removeEventListener('ic-update-ready',f)},[]);

  if(dayView)return <DayView day={dayView.day} phase={dayView.phase} onBack={()=>setDayView(null)} />;

  const tabs=[
    {id:'workout',label:'Workout',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4'},
    {id:'progress',label:'Progress',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m14 0v-10a2 2 0 00-2-2h-2a2 2 0 00-2 2v10m14 0H3'},
    {id:'library',label:'Library',icon:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.347 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'},
    {id:'settings',label:'Settings',icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z'}
  ];

  return (
    <div className="app">
      {tab==='workout' && <WorkoutTab showToast={showToast} onOpenDay={(day,phase)=>setDayView({day,phase})} />}
      {tab==='progress' && <ProgressTab showToast={showToast} />}
      {tab==='library' && <LibraryTab />}
      {tab==='settings' && <SettingsTab showToast={showToast} />}
      <div className="tabs">
        {tabs.map(t=>(
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
              <path strokeLinecap="round" strokeLinejoin="round" d={t.icon} />
            </svg>
            {t.label}
          </button>
        ))}
      </div>
      {updateReady && <button className="update-pill" onClick={()=>location.reload()}>New version ready — tap to update</button>}
      {toast && <Toast msg={toast} />}
    </div>
  );
};

// If anything crashes while rendering, show a way out instead of a blank screen. Workouts stay saved on
// the phone; this screen can copy a backup and undo a restore without relying on the rest of the app.
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null,note:''}}
  static getDerivedStateFromError(err){return {err}}
  componentDidCatch(err,info){console.error('IronClad crashed',err,info)}
  render(){
    if(!this.state.err)return this.props.children;
    const copy=()=>{
      let text='';
      try{text=backupJSON()}catch(e){try{const d={};Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>{d[k]=localStorage.getItem(k)});text=JSON.stringify(d)}catch(x){}}
      (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject())
        .then(()=>this.setState({note:'Backup copied — paste it into Notes before anything else.'}),()=>this.setState({note:'Copy failed.'}));
    };
    return (
      <div style={{padding:'max(48px,var(--safe-t)) 20px 20px',color:'var(--t1)',maxWidth:500,margin:'0 auto'}}>
        <div style={{fontSize:22,fontWeight:700,marginBottom:8}}>Something went wrong</div>
        <div style={{fontSize:14,color:'var(--t2)',lineHeight:1.5,marginBottom:16}}>Your workouts are still saved on this phone. Copy a backup first, then try again.</div>
        <button className="btn btn-g" style={{width:'100%',marginBottom:8}} onClick={copy}>Copy Backup</button>
        {this.state.note&&<div style={{fontSize:12,color:'var(--t2)',marginBottom:8}}>{this.state.note}</div>}
        <button className="btn btn-s" style={{width:'100%',marginBottom:8}} onClick={()=>location.reload()}>Try Again</button>
        <div style={{fontSize:11,color:'var(--t3)',marginTop:12,wordBreak:'break-word'}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
