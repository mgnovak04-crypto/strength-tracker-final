<style>
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--sep:rgba(84,84,88,0.65);--t1:#fff;--t2:rgba(235,235,245,0.6);--t3:rgba(235,235,245,0.3);--grn:#009A44;--grn-d:rgba(0,154,68,0.15);--org:#FF8C00;--org-d:rgba(255,140,0,0.15);--red:#ff453a;--red-d:rgba(255,69,58,0.15);--blu:#0a84ff;--pur:#bf5af2;--cyn:#64d2ff;--yel:#ffd60a;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,system-ui,'SF Pro Display',sans-serif;-webkit-font-smoothing:antialiased}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;max-width:500px;margin:0 auto;position:relative}
@media (min-width:520px){.app{border-left:0.5px solid var(--sep);border-right:0.5px solid var(--sep)}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(90px + var(--safe-b)) 16px}
.hdr{padding:max(12px,var(--safe-t)) 16px 12px;background:rgba(0,0,0,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100;border-bottom:3px solid;border-image:linear-gradient(to right,var(--grn) 33%,#fff 33%,#fff 66%,var(--org) 66%) 1}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(90deg,var(--grn),#fff 60%,var(--org));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{font-size:13px;color:var(--org);margin-top:2px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(30,30,30,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:3px solid;border-image:linear-gradient(to right,var(--grn) 33%,#fff 33%,#fff 66%,var(--org) 66%) 1;padding:6px 0 calc(6px + var(--safe-b));display:flex;z-index:200}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:none;border:none;color:var(--t3);font-size:10px;font-family:inherit;cursor:pointer;transition:color .2s}
.tab.on{color:var(--grn)}
.tab svg{width:22px;height:22px}
.card{background:var(--c1);border-radius:14px;margin-bottom:12px;overflow:hidden;border-left:3px solid var(--grn)}

.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}

.sht-bar{width:36px;height:5px;background:var(--c3);border-radius:3px;margin:8px auto}
.sht-h{padding:12px 16px;border-bottom:0.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between}
.sht-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;top:max(60px,calc(var(--safe-t) + 50px));left:50%;transform:translateX(-50%);background:var(--c1);border:1px solid var(--sep);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:10px;z-index:3000;animation:toastIn .3s ease-out;font-size:14px;font-weight:500}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--c1);border-radius:12px;padding:14px}
.stat-card .val{font-size:24px;font-weight:700}
.stat-card .lbl{font-size:12px;color:var(--t2);margin-top:2px}
.hist-item{background:var(--c1);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.phase-sel{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:2px 0}
.phase-btn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--c3);background:none;color:var(--t2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}

.section-t{font-size:20px;font-weight:700;margin:20px 0 12px;letter-spacing:-0.3px;color:var(--grn)}
.focus-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:6px}
.rest-overlay{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px)}
.rest-ring{position:relative;width:200px;height:200px}
.rest-ring svg{transform:rotate(-90deg)}
.rest-ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest-ring .time .big{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.rest-ring .time .small{font-size:14px;color:var(--t2);margin-top:4px}
.rest-btns{display:flex;gap:12px;margin-top:32px}
.rest-btn{padding:12px 24px;border-radius:12px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.wt-chart{background:var(--c1);border-radius:12px;padding:16px;margin-bottom:12px}
.wt-spark{display:flex;align-items:flex-end;gap:3px;height:60px}
.wt-bar{flex:1;border-radius:3px 3px 0 0;min-width:6px;transition:height .3s}
.session-timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--org)}
.complete-overlay{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0}}
.complete-card{text-align:center;padding:32px;animation:scaleIn .5s ease-out}
@keyframes scaleIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.complete-stat{display:inline-flex;flex-direction:column;align-items:center;padding:12px 16px;margin:6px;background:var(--c1);border-radius:12px;min-width:80px}
.cd-timer{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.cal-label{font-size:10px;color:var(--t3);text-align:center;padding-bottom:2px}
.pain-row{display:flex;gap:4px;align-items:center}
.pain-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .2s}
.rpe-row{display:flex;gap:4px;margin:8px 0}
.rpe-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--c3);background:none;color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.rpe-btn.on{border-color:var(--org);background:var(--org-d);color:var(--org)}
.mini-chart{display:flex;align-items:flex-end;gap:2px;height:40px}
.mini-bar{flex:1;border-radius:2px 2px 0 0;min-width:4px;transition:height .3s}
.goal-bar{height:12px;background:var(--c2);border-radius:6px;overflow:hidden;position:relative}
.goal-fill{height:100%;border-radius:6px;transition:width .5s}
.goal-marker{position:absolute;top:-2px;width:2px;height:16px;background:var(--t1);border-radius:1px}
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filter-pill{padding:6px 12px;border-radius:8px;border:1.5px solid var(--c3);background:none;color:var(--t2);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.filter-pill.on{border-color:var(--grn);background:var(--grn-d);color:var(--grn)}
.vol-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vol-bar-label{font-size:12px;color:var(--t2);width:80px;text-align:right}
.vol-bar-track{flex:1;height:8px;background:var(--c2);border-radius:4px;overflow:hidden}
.vol-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.vol-bar-val{font-size:12px;color:var(--t2);width:40px}
.acwr-gauge{position:relative;height:24px;background:var(--c2);border-radius:12px;overflow:visible;margin:12px 0}
.acwr-fill{height:100%;border-radius:12px;transition:width .3s}
.acwr-marker{position:absolute;top:-4px;width:3px;height:32px;background:var(--t1);border-radius:2px;transition:left .3s}
</style>

<body>
<div id="root"></div>
<script>
(function(){
  var VER='19.5.0';
  var stored=localStorage.getItem('ic17_appVersion');
  if(stored && stored!==VER){
    if('caches' in window)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});
    if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});
    localStorage.setItem('ic17_appVersion',VER);
    location.reload(true);
    return;
  }
  localStorage.setItem('ic17_appVersion',VER);
})();
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='ironclad-v19.5';
    const ASSETS=['/'];
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
    self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{if(r.ok){const rc=r.clone();caches.open(CACHE).then(c=>c.put(e.request,rc))}return r}).catch(()=>caches.match(e.request)));
    });
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// === UTILITIES ===
const P='ic17_';
const ld=(k,d)=>{try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>localStorage.setItem(P+k,JSON.stringify(v));
const rm=(k)=>localStorage.removeItem(P+k);
const vb=()=>{try{navigator.vibrate?.(10)}catch{}};
const fmtDate=(d)=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=(s)=>{const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec.toString().padStart(2,'0')}`};
const today=()=>new Date().toISOString().slice(0,10);

// === DATA MIGRATION ===
(()=>{
  try{
    if(localStorage.getItem('ic17_migrated'))return;
    const oldPrefixes=['ic13_','ic14_','ic15_','ic16_'];
    const unprefixed=['history','prs','bodyweight','weightLog','exHistory','phase','restTime','restEnabled'];
    oldPrefixes.forEach(op=>{
      Object.keys(localStorage).filter(k=>k.startsWith(op)).forEach(k=>{
        const newKey='ic17_'+k.replace(op,'');
        if(!localStorage.getItem(newKey))localStorage.setItem(newKey,localStorage.getItem(k));
      });
    });
    unprefixed.forEach(k=>{
      const v=localStorage.getItem(k);
      if(v&&!localStorage.getItem('ic17_'+k))localStorage.setItem('ic17_'+k,v);
    });
    Object.keys(localStorage).filter(k=>k.startsWith('pr_')).forEach(k=>{
      const newKey='ic17_'+k;
      if(!localStorage.getItem(newKey))localStorage.setItem(newKey,localStorage.getItem(k));
    });
    localStorage.setItem('ic17_migrated','1');
  }catch(e){}
})();

// === CALORIE ESTIMATE ===
const estCalories=(duration,volume,bodyweight)=>{
  const bw=bodyweight||80;
  const baseMET=5;
  const durationMin=(duration||0)/60;
  const baseCalories=baseMET*bw/60*durationMin;
  const volumeBonus=volume>0?volume/500:0;
  return Math.round(baseCalories+volumeBonus);
};

// === est1RM ===
const est1RM=(w,r)=>{if(!w||!r||r<1)return 0;if(r===1)return w;return Math.round(w*(1+r/30))};
const estRunCal=(distKm,bw)=>Math.round((bw||80)*distKm*1.036);
// Progressive overload: parse a rep range like "8-10" -> [8,10]; smaller weight jumps for isolation/DB
const parseRepRange=(reps)=>{const m=String(reps).match(/^(\d+)\s*-\s*(\d+)/);return m?[parseInt(m[1]),parseInt(m[2])]:null};
const weightStep=(eq)=>['Barbell','Machine'].includes(eq)?2.5:2;
// Given last session's completed sets + target range, suggest the next target (add weight vs push reps)
const suggestTarget=(lastSets,range,eq)=>{
  if(!range||!lastSets)return null;
  const done=lastSets.filter(s=>parseFloat(s.w)>0&&parseInt(s.r)>0);
  if(!done.length)return null;
  const w=Math.max(...done.map(s=>parseFloat(s.w)));
  const repsAtW=Math.min(...done.filter(s=>parseFloat(s.w)===w).map(s=>parseInt(s.r)));
  const[lo,hi]=range;
  if(repsAtW>=hi){const nw=Math.round((w+weightStep(eq))*2)/2;return{w:nw,r:lo,add:true};}
  return{w,r:Math.min(repsAtW+1,hi),add:false};
};
// Least-squares slope: pts=[{x,y}] -> dy/dx
const linSlope=(pts)=>{
  const n=pts.length;if(n<2)return 0;
  const sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0),sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const d=n*sxx-sx*sx;return d===0?0:(n*sxy-sx*sy)/d;
};
// Daily readiness / auto-regulation from recent check-ins, RPE, rest, ACWR
const computeReadiness=(history,acwr)=>{
  if(!history.length)return null;
  const last=history[0];
  const daysSince=Math.round((new Date()-new Date(last.date))/86400000);
  let score=100;const f=[];
  const kp=last.kneePre,cp=last.calfPre;
  if(kp!==undefined||cp!==undefined){
    const pen=Math.round((((kp||0)+(cp||0))/2)*8);
    if(pen>0){score-=pen;f.push({t:`Knee ${kp||0}/5 · Calf ${cp||0}/5`,d:-pen});}
  }
  const ck=history.filter(h=>h.kneePre!==undefined);
  if(ck.length>=4){
    const avg=a=>a.reduce((s,h)=>s+((h.kneePre||0)+(h.calfPre||0)),0)/a.length;
    if(avg(ck.slice(0,3))>avg(ck.slice(3,6))+1){score-=8;f.push({t:'Pain trending up',d:-8});}
  }
  if(last.rpe){
    const pen=Math.max(0,Math.round((last.rpe-7)*5));
    if(pen>0){score-=pen;f.push({t:`Last session hard (RPE ${last.rpe})`,d:-pen});}
  }
  if(daysSince<=0){score-=12;f.push({t:'Back-to-back training day',d:-12});}
  else if(daysSince===1)score-=4;
  else if(daysSince>=8){score-=5;f.push({t:`${daysSince} days since last session`,d:-5});}
  const a=parseFloat(acwr)||0;
  if(a>1.5){score-=15;f.push({t:`Training-load spike (ACWR ${a})`,d:-15});}
  else if(a>1.3){score-=8;f.push({t:`Load climbing (ACWR ${a})`,d:-8});}
  score=Math.max(0,Math.min(100,Math.round(score)));
  let label,color;
  if(score>=80){label='Go heavy — push your progression targets';color='var(--grn)';}
  else if(score>=60){label='Train as planned';color='var(--grn)';}
  else if(score>=40){label='Lighten load ~10–20%, focus on technique';color='var(--org)';}
  else{label='Active recovery / mobility only — protect the knee';color='var(--red)';}
  return{score,label,color,factors:f,daysSince};
};

// === EXERCISE DATABASE ===
const EXDB=[
{id:'trapbar',n:'Trapbar Deadlift',m:'Legs',t:'w',eq:'Barbell',tags:['k','t'],note:'Hip hinge focus, keep back neutral'},
{id:'foamquad',n:'Foam Rolling Quads',m:'Recovery',t:'d',eq:'Foam Roller',tags:['k','t'],note:'90s per quad, focus on tight spots'},

// === TOAST COMPONENT ===
const Toast=({msg,onDone})=>{
  useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t)},[onDone]);
  return <div className="toast">{msg}</div>;
};

// === REST TIMER ===
const RestTimer=({seconds,onDone})=>{
  const[left,setLeft]=useState(seconds);
  const[base,setBase]=useState(seconds);
  const doneRef=useRef(onDone);doneRef.current=onDone;
  // Only re-arm the interval when `seconds` changes — NOT when the parent
  // re-renders (the session timer re-renders DayView every second, and a
  // fresh inline onDone used to reset this countdown each tick).
  useEffect(()=>{
    setLeft(seconds);setBase(seconds);
    const iv=setInterval(()=>setLeft(p=>{if(p<=1){clearInterval(iv);doneRef.current&&doneRef.current();return 0}return p-1}),1000);
    return()=>clearInterval(iv);
  },[seconds]);
  const pct=base>0?left/base:0;
  const r=90,c=2*Math.PI*r;
  const close=()=>doneRef.current&&doneRef.current();
  return (
    <div className="rest-overlay" onClick={close}>
      <div style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
        <div className="rest-ring">
          <svg width={200} height={200}>
            <circle cx={100} cy={100} r={r} fill="none" stroke="var(--c2)" strokeWidth={8} />
            <circle cx={100} cy={100} r={r} fill="none" stroke="var(--grn)" strokeWidth={8} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)} />
          </svg>
          <div className="time">
            <div className="big">{left}</div>
            <div className="small">REST</div>
          </div>
        </div>
        <div className="rest-btns">
          <button className="rest-btn" style={{background:'var(--c2)',color:'var(--t1)'}} onClick={()=>{setLeft(p=>p+15);setBase(b=>Math.max(b,left+15))}}>+15s</button>
          <button className="rest-btn" style={{background:'var(--grn)',color:'#000'}} onClick={close}>Skip</button>
        </div>
      </div>
    </div>
  );
};

// === SESSION TIMER HOOK ===
const useSessionTimer=()=>{
  const[elapsed,setElapsed]=useState(0);
  const[running,setRunning]=useState(false);
  const startRef=useRef(null);
  const ivRef=useRef(null);
  const start=useCallback(()=>{
    if(!startRef.current)startRef.current=Date.now();
    setRunning(true);
    ivRef.current=setInterval(()=>{setElapsed(Math.floor((Date.now()-startRef.current)/1000))},1000);
  },[]);
  const stop=useCallback(()=>{setRunning(false);clearInterval(ivRef.current)},[]);
  const reset=useCallback(()=>{stop();setElapsed(0);startRef.current=null},[stop]);
  useEffect(()=>()=>clearInterval(ivRef.current),[]);
  return{elapsed,running,start,stop,reset};
};

// === COUNTDOWN TIMER ===
const CountdownTimer=({duration})=>{
  const[left,setLeft]=useState(0);
  const[active,setActive]=useState(false);
  const ivRef=useRef(null);
  const secs=parseInt(duration)||60;
  const toggle=()=>{
    if(active){clearInterval(ivRef.current);setActive(false);setLeft(0);return}
    setLeft(secs);setActive(true);
    ivRef.current=setInterval(()=>setLeft(p=>{if(p<=1){clearInterval(ivRef.current);setActive(false);vb();return 0}return p-1}),1000);
  };
  useEffect(()=>()=>clearInterval(ivRef.current),[]);
  return (
    <div className="cd-timer" style={{background:active?'var(--org-d)':'var(--c2)',color:active?'var(--org)':'var(--t2)'}} onClick={toggle}>
      {active?fmtTime(left):'Start '+secs+'s'}
    </div>
  );
};

// === SET LOGGER ===
const SetLogger=({ex,exData,sets,onUpdate,onDone,onSetsDelta})=>{
  const info=exMap[ex.eid];
  const isDuration=info&&(info.t==='d'||info.t==='c');
  const needsWeight=info&&(info.t==='w'||['Cable','Machine','Dumbbell','Barbell','Kettlebell'].includes(info.eq));
  const exHist=ld('exHistory',{});
  const lastSession=exHist[ex.eid]||null;
  const target=(needsWeight&&!isDuration)?suggestTarget(lastSession,parseRepRange(ex.reps),info&&info.eq):null;
  const lastTopSet=(lastSession&&lastSession.length)?(()=>{const s=lastSession.find(x=>x.w||x.r);return s?((needsWeight&&s.w)?(s.w+'×'+s.r):(s.r+(isDuration?'s':' reps'))):null})():null;
  return (
    <div className="log-area">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:600,color:'var(--t2)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{info?.n||ex.eid}</div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          <span style={{fontSize:11,color:'var(--t3)'}}>sets</span>
          <button className="btn btn-s" style={{padding:'2px 9px',fontSize:13}} onClick={()=>onSetsDelta(-1)}>−</button>
          <button className="btn btn-s" style={{padding:'2px 9px',fontSize:13}} onClick={()=>onSetsDelta(1)}>+</button>
        </div>
      </div>
      {(target||lastTopSet) && (
        <div style={{display:'flex',gap:6,marginBottom:7,flexWrap:'wrap',alignItems:'center'}}>
          {target && (
            <button className="pill" style={{color:'var(--grn)',background:'var(--grn-d)'}} onClick={()=>{
              const filled=[];for(let i=0;i<sets;i++)filled.push({w:String(target.w),r:String(target.r),done:false});onUpdate(filled);
            }}>{target.add?'↑':'▲'} Target {target.w}×{target.r}</button>
          )}
          {lastTopSet && (
            <button className="pill" style={{color:'var(--blu)',background:'rgba(10,132,255,0.12)'}} onClick={()=>{
              const filled=[];lastSession.forEach((s,i)=>{if(i<sets)filled.push({w:s.w||'',r:s.r||'',done:false})});onUpdate(filled);
            }}>Last {lastTopSet}</button>
          )}
          <span style={{fontSize:10,color:'var(--t3)'}}>tap to fill</span>
        </div>
      )}
      {isDuration && <div style={{marginBottom:8}}><CountdownTimer duration={ex.reps} /></div>}
      {Array.from({length:sets}).map((_,i)=>{
        const s=exData[i]||{w:'',r:'',done:false};
        return (
          <div key={i} className="set-row">
            <div className="set-num" style={s.done?{background:'var(--grn)',color:'#000'}:{}}>{s.done?'✓':i+1}</div>
            {needsWeight && !isDuration && (
              <input className={'inp'+(s.done?' done':'')} type="number" inputMode="decimal" placeholder="kg" value={s.w}
                onChange={e=>{const d=[...exData];d[i]={...s,w:e.target.value};onUpdate(d)}} />
            )}
            <input className={'inp'+(s.done?' done':'')} type="number" inputMode="numeric"
              placeholder={isDuration?'sec':'reps'} value={s.r}
              onChange={e=>{const d=[...exData];d[i]={...s,r:e.target.value};onUpdate(d)}} />
            {!s.done ? (
              <button className="logbtn" style={{background:'var(--grn)',color:'#000'}} onClick={()=>{
                const d=[...exData];d[i]={...s,done:true};onUpdate(d);vb();onDone(ex,d[i],d);
              }}>Log</button>
            ) : (
              <button className="logbtn" style={{background:'var(--c2)',color:'var(--t3)',fontSize:12}} onClick={()=>{
                const d=[...exData];d[i]={...s,done:false};onUpdate(d);vb();
              }}>Undo</button>
            )}
          </div>
        );
      })}
      {needsWeight&&!isDuration&&exData.some(s=>s.done&&s.w&&s.r)&&(
        <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>
          Est 1RM: {est1RM(parseFloat(exData.find(s=>s.done&&s.w)?.w||0),parseInt(exData.find(s=>s.done&&s.w)?.r||0))} kg
        </div>
      )}
    </div>
  );
};

// === EXERCISE CARD (with swap) ===
const ExCard=({ex,exData,sets,open,onToggle,rowId,onUpdate,onDone,onSwap,onSetsDelta})=>{
  const[showSwap,setShowSwap]=useState(false);
  const info=exMap[ex.eid];
  if(!info)return null;
  const doneList=(exData||[]).filter(s=>s.done);
  const doneSets=doneList.length;
  const pct=sets>0?Math.round(doneSets/sets*100):0;
  const isDone=pct===100;
  const isDur=info.t==='d'||info.t==='c';
  const needW=info.t==='w'||['Cable','Machine','Dumbbell','Barbell','Kettlebell'].includes(info.eq);
  const summary=doneList.map(s=>(needW&&s.w)?(s.w+'×'+s.r):(s.r+(isDur?'s':''))).join(' · ');
  const swapOptions=EXDB.filter(e=>e.m===info.m&&e.id!==ex.eid);
  const swapByEq={};
  swapOptions.forEach(s=>{if(!swapByEq[s.eq])swapByEq[s.eq]=[];swapByEq[s.eq].push(s)});
  return (
    <div id={'row-'+rowId} style={{marginBottom:2}}>
      <div className="ex-row" onClick={onToggle} style={{cursor:'pointer',padding:'8px 0'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span className="ex-name" style={{fontSize:14}}>{info.n}</span>
            {isDone && <span className="badge badge-g" style={{fontSize:10,padding:'1px 6px'}}>✓</span>}
            {pct>0&&!isDone && <span className="badge badge-o" style={{fontSize:10,padding:'1px 6px'}}>{pct}%</span>}
          </div>
          {(!open&&doneSets>0&&summary)
            ? <div className="ex-info" style={{fontSize:12,color:'var(--grn)',fontWeight:600}}>{summary}</div>
            : <div className="ex-info" style={{fontSize:12}}>{ex.sets}×{ex.reps}{ex.note?' · '+ex.note:''}</div>}
        </div>
        <span style={{fontSize:14,color:'var(--t3)',flexShrink:0,paddingLeft:8}}>{open?'▾':'▸'}</span>
      </div>
      {open && (
        <div>
          <div style={{padding:'4px 16px',display:'flex',gap:6}}>
            <button className="btn btn-s" style={{fontSize:11,padding:'4px 10px'}} onClick={e=>{e.stopPropagation();setShowSwap(!showSwap)}}>
              {showSwap?'Cancel':'Swap'}
            </button>
          </div>
          {showSwap && (
            <div style={{padding:'8px 16px',background:'var(--c2)',borderRadius:8,margin:'4px 16px',maxHeight:200,overflowY:'auto'}}>
              {Object.entries(swapByEq).map(([eq,exs])=>(
                <div key={eq}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--org)',padding:'6px 0 2px'}}>{eq}</div>
                  {exs.map(s=>(
                    <div key={s.id} style={{padding:'5px 0',borderBottom:'0.5px solid var(--sep)',cursor:'pointer',fontSize:13}}
                      onClick={()=>{onSwap(ex.eid,s.id);setShowSwap(false)}}>{s.n}</div>
                  ))}
                </div>
              ))}
              {swapOptions.length===0 && <div style={{fontSize:12,color:'var(--t3)',padding:8}}>No alternatives</div>}
            </div>
          )}
          <SetLogger ex={ex} exData={exData||[]} sets={sets} onUpdate={onUpdate} onDone={(exx,sd,all)=>onDone(exx,sd,all,rowId)} onSetsDelta={onSetsDelta} />
        </div>
      )}
    </div>
  );
};

const DayView=({day,phase,onBack})=>{
  const[logData,setLogData]=useState(ld('dayLog_'+day.name.replace(/\s/g,'')+'_p'+phase,{}));
  const[setsOverride,setSetsOverride]=useState(ld('setsOverride_'+day.name.replace(/\s/g,'')+'_p'+phase,{}));
  const[pain,setPain]=useState(0);
  const[rpe,setRpe]=useState(null);
  const[notes,setNotes]=useState('');
  const[showComplete,setShowComplete]=useState(null);
  const[restSecs,setRestSecs]=useState(null);
  const[restKey,setRestKey]=useState(0);
  const[openRow,setOpenRow]=useState(null);
  const[swaps,setSwaps]=useState(ld('swaps',{}));
  const dayKeyCI=day.name.replace(/\s/g,'')+'_p'+phase;
  const[kneePre,setKneePre]=useState(()=>{const c=ld('dayCheckin_'+dayKeyCI,{});return c.knee||0});
  const[calfPre,setCalfPre]=useState(()=>{const c=ld('dayCheckin_'+dayKeyCI,{});return c.calf||0});
  const restTime=ld('restTime',45);
  const restEnabled=ld('restEnabled',true);
  const timer=useSessionTimer();
  const bw=ld('bodyweight',80);
  const dayKey=day.name.replace(/\s/g,'')+'_p'+phase;

  useEffect(()=>{if(!timer.running)timer.start()},[]);
  useEffect(()=>{sv('dayLog_'+dayKey,logData)},[logData,dayKey]);
  useEffect(()=>{sv('setsOverride_'+dayKey,setsOverride)},[setsOverride,dayKey]);
  useEffect(()=>{sv('dayCheckin_'+dayKeyCI,{knee:kneePre,calf:calfPre})},[kneePre,calfPre,dayKeyCI]);

  const handleSwap=(oldId,newId)=>{const s={...swaps,[oldId]:newId};setSwaps(s);sv('swaps',s)};
  const getEid=(eid)=>swaps[eid]||eid;

  const allExercises=day.supersets.flatMap(ss=>ss.exercises);
  const totalSets=allExercises.reduce((a,ex)=>(setsOverride[ex.eid]||ex.sets)+a,0);
  const doneSets=allExercises.reduce((a,ex)=>{const d=logData[getEid(ex.eid)]||[];return a+d.filter(s=>s.done).length},0);
  const pct=totalSets>0?Math.round(doneSets/totalSets*100):0;

  const totalVolume=allExercises.reduce((a,ex)=>{
    const d=logData[getEid(ex.eid)]||[];
    return a+d.filter(s=>s.done&&!s.warmup).reduce((v,s)=>(parseFloat(s.w)||0)*(parseInt(s.r)||0)+v,0);
  },0);

  const handleSetDone=(ex,setData,allData,rowId)=>{
    const info=exMap[getEid(ex.eid)];
    if(info&&info.t==='w'&&setData.w&&setData.r&&!setData.warmup){
      const prs=ld('prs',{});
      const key=getEid(ex.eid);
      const e1rm=est1RM(parseFloat(setData.w),parseInt(setData.r));
      if(!prs[key]||e1rm>prs[key].e1rm){
        prs[key]={w:parseFloat(setData.w),r:parseInt(setData.r),e1rm,date:today()};
        sv('prs',prs);
      }
      const e1rmHist=ld('e1rmLog',{});
      if(!e1rmHist[key])e1rmHist[key]=[];
      const last=e1rmHist[key][e1rmHist[key].length-1];
      if(last&&last.date===today()){
        if(e1rm>last.e1rm){last.e1rm=e1rm;last.w=parseFloat(setData.w);last.r=parseInt(setData.r)}
      }else{
        e1rmHist[key].push({date:today(),e1rm,w:parseFloat(setData.w),r:parseInt(setData.r)});
      }
      if(e1rmHist[key].length>30)e1rmHist[key]=e1rmHist[key].slice(-30);
      sv('e1rmLog',e1rmHist);
    }
    const hist=ld('exHistory',{});
    const eid=getEid(ex.eid);
    hist[eid]=(allData||[]).filter(s=>s.done);
    sv('exHistory',hist);
    // Block-aware rest: use this superset's rest; skip for warm-up/mobility (rest:0)
    const restSec=ex.rest;
    if(restEnabled && restSec>0){setRestSecs(restSec);setRestKey(k=>k+1)}
    // Auto-advance: if this exercise is now fully done, open + scroll the next unfinished one
    const targetSets=setsOverride[eid]||ex.sets;
    const doneN=(allData||[]).filter(s=>s.done).length;
    if(doneN>=targetSets){
      const rows=[];
      day.supersets.forEach((ss,si)=>ss.exercises.forEach((e,ei)=>{
        const rid=si+'_'+ei;const eeid=getEid(e.eid);const tset=setsOverride[eeid]||e.sets;
        const dc=(rid===rowId)?doneN:((logData[eeid]||[]).filter(s=>s.done).length);
        rows.push({rid,complete:dc>=tset});
      }));
      const ci=rows.findIndex(r=>r.rid===rowId);
      const next=rows.slice(ci+1).find(r=>!r.complete)||rows.find(r=>!r.complete&&r.rid!==rowId);
      if(next){setOpenRow(next.rid);setTimeout(()=>{const el=document.getElementById('row-'+next.rid);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},300)}
      else setOpenRow(null);
    }
  };

  const finishWorkout=()=>{
    timer.stop();
    const exDone=allExercises.filter(ex=>{const d=logData[getEid(ex.eid)]||[];return d.some(s=>s.done)}).length;
    const kcal=estCalories(timer.elapsed,totalVolume,bw);
    const prs=ld('prs',{});
    let newPRs=0;
    allExercises.forEach(ex=>{
      const pr=prs[getEid(ex.eid)];
      if(pr&&pr.date===today())newPRs++;
    });
    const record={day:day.name,phase,date:today(),duration:timer.elapsed,pain,rpe,notes,pct,exercises:exDone,
      totalExercises:allExercises.length,volume:totalVolume,calories:kcal,newPRs,kneePre,calfPre};
    const history=ld('history',[]);
    history.unshift(record);
    sv('history',history);
    const wk=ld('weekDone',{});
    wk[day.name]=today();
    sv('weekDone',wk);
    setShowComplete({pct,exercises:exDone,duration:timer.elapsed,kcal,newPRs});
  };

  return (
    <div className="app">
      <div className="hdr">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button className="btn btn-s" style={{padding:'6px 10px',fontSize:13}} onClick={()=>{timer.stop();onBack()}}>Back</button>
              <h1 style={{fontSize:20}}>{day.name}</h1>
            </div>
            <div style={{display:'flex',gap:8,marginTop:4}}>
              {day.focus.map(f=><span key={f} className="focus-tag" style={{background:'var(--c2)'}}>{f}</span>)}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
            <div className="session-timer">{fmtTime(timer.elapsed)}</div>
            <button className="btn btn-s" style={{padding:'2px 8px',fontSize:10}}
              onClick={()=>{const v=!ld('restEnabled',true);sv('restEnabled',v);window.location.reload()}}>{restEnabled?'Rest: ON':'Rest: OFF'}</button>
          </div>
        </div>
        <div className="prg"><div className="prg-f" style={{width:pct+'%'}} /></div>
      </div>
      <div className="scroll">
        <div className="card" style={{padding:16,borderLeft:'3px solid var(--cyn)'}}>
          <div style={{fontSize:14,fontWeight:600,marginBottom:10}}>Pre-Workout Check-In</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:13,color:'var(--t2)',marginBottom:6}}>Knee pain (0=none, 5=severe)</div>
            <div className="pain-row">
              {[0,1,2,3,4,5].map(v=>{
                const c=['var(--grn)','#7bc67e','var(--yel)','var(--org)','var(--red)','#cc2020'][v];
                return <div key={v} className="pain-dot" style={{background:kneePre===v?c:'var(--c2)',borderColor:kneePre===v?c:'var(--c3)',color:kneePre===v?'#000':'var(--t2)'}}
                  onClick={()=>{vb();setKneePre(v)}}>{v}</div>;
              })}
            </div>
          </div>
          <div>
            <div style={{fontSize:13,color:'var(--t2)',marginBottom:6}}>Calf tightness (0=none, 5=very tight)</div>
            <div className="pain-row">
              {[0,1,2,3,4,5].map(v=>{
                const c=['var(--grn)','#7bc67e','var(--yel)','var(--org)','var(--red)','#cc2020'][v];
                return <div key={v} className="pain-dot" style={{background:calfPre===v?c:'var(--c2)',borderColor:calfPre===v?c:'var(--c3)',color:calfPre===v?'#000':'var(--t2)'}}
                  onClick={()=>{vb();setCalfPre(v)}}>{v}</div>;
              })}
            </div>
          </div>
        </div>
        {day.supersets.map((ss,si)=>{
          const isFinisher=ss.label.includes('Finisher');
          return (
            <div key={si} className="card">
              <div className="ss-h" style={{padding:'12px 16px'}}>
                <span className="ss-label">{ss.label}</span>
                <span className="ss-type" style={{background:isFinisher?'var(--red-d)':'var(--blu)',color:isFinisher?'var(--red)':'#fff'}}>
                  {isFinisher?ss.type:ss.type||'Strength'}
                </span>
                <span style={{fontSize:11,color:'var(--t3)',marginLeft:'auto'}}>Rest: {ss.rest}s</span>
              </div>
              {ss.exercises.map((ex,ei)=>{
                const eid=getEid(ex.eid);
                const sets=setsOverride[eid]||ex.sets;
                const rowId=si+'_'+ei;
                return <ExCard key={eid+ei} ex={{...ex,eid,rest:ss.rest}} exData={logData[eid]||[]} sets={sets}
                  rowId={rowId} open={openRow===rowId} onToggle={()=>setOpenRow(openRow===rowId?null:rowId)}
                  onUpdate={d=>{const l={...logData};l[eid]=d;setLogData(l)}}
                  onDone={handleSetDone}
                  onSwap={handleSwap}
                  onSetsDelta={delta=>{
                    const cur=setsOverride[eid]||ex.sets;
                    const next=Math.max(1,cur+delta);
                    setSetsOverride(p=>({...p,[eid]:next}));
                  }} />;
              })}
            </div>
          );
        })}
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:17,fontWeight:600,marginBottom:12}}>Finish Workout</div>
          <PainScale value={pain} onChange={setPain} />
          <div style={{height:12}} />
          <RPESelector value={rpe} onChange={setRpe} />
          <textarea style={{width:'100%',height:60,background:'var(--c2)',border:'1.5px solid var(--c3)',borderRadius:10,padding:10,color:'var(--t1)',fontFamily:'inherit',fontSize:14,resize:'none',marginTop:8}}
            placeholder="Notes..." value={notes} onChange={e=>setNotes(e.target.value)} />
          <button className="btn btn-g" style={{width:'100%',marginTop:12}} onClick={finishWorkout}>
            Save Workout ({fmtTime(timer.elapsed)})
          </button>
        </div>
      </div>
      {restSecs && <RestTimer key={restKey} seconds={restSecs} onDone={()=>setRestSecs(null)} />}
      {showComplete && <CompletionSummary stats={showComplete} onClose={()=>{setShowComplete(null);onBack()}} />}
    </div>
  );
};

// === SESSION LENGTH ===
// Trim a full day into a shorter session while protecting the priorities:
// compound lifts, calf rebuild, one knee-rehab move, and (for 45m) a short finisher.
const SESSION_MODES=[
  {id:'m35',label:'35 min',mins:'~35m'},
  {id:'m45',label:'45 min',mins:'~45m'},
  {id:'full',label:'Full',mins:'~60m'}
];
const trimDay=(day,mode)=>{
  if(!mode||mode==='full')return day;
  const q=mode==='m35';
  const cfg=q
    ?{warmKeep:2,s1Keep:2,s2Keep:2,capSets:3,rehabKeep:0,finisher:true}
    :{warmKeep:2,s1Keep:3,s2Keep:2,capSets:3,rehabKeep:1,finisher:true};
  const cap=ex=>({...ex,sets:Math.min(ex.sets,cfg.capSets)});
  const out=[];
  day.supersets.forEach(ss=>{
    const L=ss.label;
    // Superset 3 is always the rehab/core block (its type says "Trainer Rehab" / "Core + Knee Rehab")
    if(L==='Warm-Up')out.push({...ss,exercises:ss.exercises.slice(0,cfg.warmKeep)});
    else if(L.includes('Finisher')){if(cfg.finisher)out.push({...ss,exercises:ss.exercises.slice(0,1)})}
    else if(L==='Superset 1')out.push({...ss,exercises:ss.exercises.slice(0,cfg.s1Keep).map(cap)});
    else if(L==='Superset 2')out.push({...ss,exercises:ss.exercises.slice(0,cfg.s2Keep).map(cap)});
    else if(L==='Superset 3'){if(cfg.rehabKeep>0)out.push({...ss,exercises:ss.exercises.slice(0,cfg.rehabKeep).map(cap)})}
    else out.push({...ss,exercises:ss.exercises.map(cap)});
  });
  return {...day,supersets:out};
};
// Rough session-time estimate in minutes (work + rest + transitions)
const estDayMinutes=(day)=>{
  let sec=0;
  day.supersets.forEach(ss=>{
    sec+=35; // block setup/transition
    ss.exercises.forEach(ex=>{
      const info=exMap[ex.eid];const reps=String(ex.reps);
      let per;
      if(/min/.test(reps))per=(parseInt(reps)||5)*60;
      else if(info&&(info.t==='d'||info.t==='c'))per=(parseInt(reps)||40)+15+(ss.rest||20);
      else per=50+(ss.rest||30); // ~50s work incl. unrack/re-rack, + block rest
      sec+=(ex.sets||1)*per+15; // +15s per-exercise setup
    });
  });
  return Math.round(sec/60);
};

const WorkoutTab=({onOpenDay})=>{
  const[phase,setPhase]=useState(ld('phase',1));

  const weekNum=Math.floor(daysSinceStart/7)+1;
  const days=getProgramDays(phase).map(d=>trimDay(d,sessionLen));

  const changePhase=(p)=>{setPhase(p);sv('phase',p);if(p!==phase){sv('phaseStart',today());sv('weekDone',{})}};
  const changeLen=(m)=>{setSessionLen(m);sv('sessionLen',m)};
  const newWeek=()=>{
    if(!confirm('Start a new week?\n\nThis clears this week\'s logged sets, set changes and check-ins for all days in this phase so you get a fresh board. Your saved workouts, PRs and progress are kept.'))return;

    rm('dayLog_'+ck);rm('setsOverride_'+ck);rm('dayCheckin_'+ck);

  };

  const dayPct=(day,ph=phase)=>{
    const logData=ld('dayLog_'+day.name.replace(/\s/g,'')+'_p'+ph,{});
    const setsOvr=ld('setsOverride_'+day.name.replace(/\s/g,'')+'_p'+ph,{});
    const allEx=day.supersets.flatMap(s=>s.exercises);
    const total=allEx.reduce((a,ex)=>(setsOvr[ex.eid]||ex.sets)+a,0);
    const done=allEx.reduce((a,ex)=>{const d=logData[ex.eid]||[];return a+d.filter(s=>s.done).length},0);
    return total>0?Math.round(done/total*100):0;
  };
  const coreDay=getCoreDay();

  return (
    <>
      <div className="hdr">
        <h1>Workout</h1>
        <p>v19.5 · Calf Rebuild + Knee-Safe · Full Body Split</p>
      </div>
      <div className="scroll">
        <TodayCard days={days} weekDone={weekDone} phase={phase} onOpenDay={onOpenDay} />
        <div className="phase-sel">
          {[1,2,3,4].map(p=>(
            <button key={p} className={'phase-btn'+(phase===p?' on':'')} onClick={()=>changePhase(p)}>

            </button>
          ))}
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'var(--t3)',marginBottom:6,textTransform:'uppercase',letterSpacing:0.5}}>Session length</div>
          <div style={{display:'flex',gap:8}}>
            {SESSION_MODES.map(m=>(
              <button key={m.id} className={'phase-btn'+(sessionLen===m.id?' on':'')} style={{flex:1,textAlign:'center'}} onClick={()=>changeLen(m.id)}>
                {m.label}<div style={{fontSize:10,color:'var(--t3)',fontWeight:400}}>{m.mins}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontSize:14,color:'var(--t2)'}}>Week {weekNum}</div>
          <button className="btn btn-s" style={{fontSize:12,padding:'6px 12px'}} onClick={newWeek}>New Week</button>
        </div>
        {days.map((day,i)=>{
          const p=dayPct(day);
          const isDone=weekDone[day.name];
          return (
            <div key={i} className="card" onClick={()=>onOpenDay(day,phase)} style={{cursor:'pointer'}}>
              <div className="card-h">
                <div>
                  <h3>{day.name}</h3>
                  <div className="sub">{day.focus.join(' + ')} · ~{estDayMinutes(day)}m</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {isDone && <span className="badge badge-g">Done</span>}
                  {p>0&&!isDone && <span className="badge badge-o">{p}%</span>}
                  <span style={{fontSize:20,color:'var(--t3)'}}>{'>'}</span>
                </div>
              </div>
              <div style={{padding:'0 16px 12px'}}>
                <div className="prg"><div className="prg-f" style={{width:p+'%'}} /></div>
              </div>
            </div>
          );
        })}
        {(()=>{
          const cp=dayPct(coreDay,CORE_PHASE);
          const cDone=weekDone[coreDay.name];
          return (
            <>
              <div style={{fontSize:11,color:'var(--t3)',margin:'8px 0 6px',textTransform:'uppercase',letterSpacing:0.5}}>Optional add-on</div>
              <div className="card" onClick={()=>onOpenDay(coreDay,CORE_PHASE)} style={{cursor:'pointer',borderLeft:'3px solid var(--cyn)'}}>
                <div className="card-h">
                  <div>
                    <h3>{coreDay.name}</h3>
                    <div className="sub">{coreDay.focus.join(' + ')} · ~{estDayMinutes(coreDay)}m</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {cDone && <span className="badge badge-g">Done</span>}
                    {cp>0&&!cDone && <span className="badge" style={{background:'rgba(100,210,255,0.15)',color:'var(--cyn)'}}>{cp}%</span>}
                    <span style={{fontSize:20,color:'var(--t3)'}}>{'>'}</span>
                  </div>
                </div>
                <div style={{padding:'0 16px 4px',fontSize:12,color:'var(--t2)'}}>Standalone core day — add it any time, doesn't replace your workouts.</div>
                <div style={{padding:'6px 16px 12px'}}>
                  <div className="prg"><div className="prg-f" style={{width:cp+'%',background:'var(--cyn)'}} /></div>
                </div>
              </div>
            </>
          );
        })()}
      </div>
    </>
  );
};

// === RUNNING LOG ===
const RunningLog=({showToast})=>{
  const[dist,setDist]=useState('');
  const[dur,setDur]=useState('');
  const[runType,setRunType]=useState('easy');
  const[runs,setRuns]=useState(()=>ld('runLog',[]));
  const bw=ld('bodyweight',80);

  const saveRun=()=>{
    const d=parseFloat(dist);const m=parseInt(dur);
    if(!d||d<=0)return;
    const cal=estRunCal(d,bw);
    const pace=m>0?Math.round(m/d*100)/100:0;
    const entry={date:today(),dist:d,dur:m||0,pace,type:runType,cal};
    const log=[entry,...runs];
    sv('runLog',log);setRuns(log);
    setDist('');setDur('');setRunType('easy');
    if(showToast)showToast('Run logged: '+d+'km · '+cal+' kcal');
  };

  const deleteRun=(i)=>{
    if(!confirm('Delete this run?'))return;
    const log=[...runs];log.splice(i,1);sv('runLog',log);setRuns(log);
  };

  const weekRuns=runs.filter(r=>(new Date()-new Date(r.date))/86400000<7);
  const weekKm=weekRuns.reduce((a,r)=>a+r.dist,0);
  const weekCal=weekRuns.reduce((a,r)=>a+(r.cal||0),0);

  return (
    <>
      <div className="section-t">Running Log</div>
      <div className="card" style={{padding:16}}>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input className="inp" style={{flex:1}} type="number" inputMode="decimal" placeholder="km" value={dist} onChange={e=>setDist(e.target.value)} />
          <input className="inp" style={{flex:1}} type="number" inputMode="numeric" placeholder="min" value={dur} onChange={e=>setDur(e.target.value)} />
        </div>
        <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
          {['easy','tempo','interval','long'].map(t=>(
            <button key={t} className={'btn'+(runType===t?' btn-g':' btn-s')} style={{padding:'6px 12px',fontSize:13,textTransform:'capitalize'}} onClick={()=>setRunType(t)}>{t}</button>
          ))}
        </div>
        <button className="btn btn-g" style={{width:'100%'}} onClick={saveRun}>Log Run</button>
      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="val">{weekKm.toFixed(1)}</div><div className="lbl">km this week</div></div>
        <div className="stat-card"><div className="val">{weekCal}</div><div className="lbl">run kcal this week</div></div>
      </div>
      {runs.slice(0,10).map((r,i)=>(
        <div key={i} className="hist-item">
          <div>
            <div style={{fontWeight:600,fontSize:15}}>{r.dist}km &middot; {r.type}</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>{fmtDate(r.date)}{r.dur>0?' · '+r.dur+'min':''}{r.pace>0?' · '+r.pace.toFixed(1)+' min/km':''} &middot; {r.cal} kcal</div>
          </div>
          <button style={{background:'none',border:'none',color:'var(--red)',fontSize:16,cursor:'pointer',padding:4}} onClick={()=>deleteRun(i)}>X</button>
        </div>
      ))}
    </>
  );
};

// === PROTEIN TRACKER ===
const ProteinTracker=()=>{
  const bw=ld('bodyweight',80);
  const target=Math.round(bw*2);
  const todayKey=today();
  const[todayGrams,setTodayGrams]=useState(()=>{const log=ld('proteinLog',{});return log[todayKey]||0});

  const addProtein=(g)=>{
    const log=ld('proteinLog',{});
    const newVal=(log[todayKey]||0)+g;
    log[todayKey]=newVal;
    sv('proteinLog',log);
    setTodayGrams(newVal);
  };

  const resetToday=()=>{
    const log=ld('proteinLog',{});
    log[todayKey]=0;
    sv('proteinLog',log);
    setTodayGrams(0);
  };

  const pct=target>0?Math.min(100,Math.round(todayGrams/target*100)):0;
  const proteinLog=ld('proteinLog',{});
  const days7=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days7.push(d.toISOString().slice(0,10))}
  const compDays=days7.filter(k=>(proteinLog[k]||0)>=target).length;

  return (
    <>
      <div className="section-t">Protein Tracker</div>
      <div className="card" style={{padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
          <div style={{fontSize:24,fontWeight:700}}>{todayGrams}g</div>
          <div style={{fontSize:13,color:'var(--t2)'}}>/ {target}g target</div>
        </div>
        <div className="prg" style={{height:10,marginBottom:12}}>
          <div className="prg-f" style={{width:pct+'%',background:pct>=100?'var(--grn)':'var(--org)'}} />
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          {[20,30,40,50].map(g=>(
            <button key={g} className="btn btn-s" style={{flex:1,padding:'10px 0',fontSize:14}} onClick={()=>addProtein(g)}>+{g}g</button>
          ))}
        </div>
        <button className="btn btn-s" style={{width:'100%',fontSize:13,padding:8}} onClick={resetToday}>Reset Today</button>
        <div style={{fontSize:12,color:'var(--t2)',marginTop:10}}>{compDays}/7 days hit target this week</div>
      </div>
    </>
  );
};

// === PROGRESS TAB ===
const ProgressTab=({showToast})=>{
  const history=ld('history',[]);
  const weightLog=ld('weightLog',[]);
  const prs=ld('prs',{});
  const bw=ld('bodyweight',80);
  const runLog=ld('runLog',[]);
  const proteinLog=ld('proteinLog',{});

  const totalWorkouts=history.length;
  const thisWeek=history.filter(h=>{const d=new Date(h.date);const now=new Date();const diff=(now-d)/86400000;return diff<7}).length;
  const totalKcal=history.reduce((a,h)=>a+(h.calories||0),0);

  let streak=0;
  const sortedDates=[...new Set(history.map(h=>h.date))].sort().reverse();
  if(sortedDates.length>0){
    let cur=new Date();cur.setHours(0,0,0,0);
    for(let i=0;i<sortedDates.length;i++){
      const d=new Date(sortedDates[i]);d.setHours(0,0,0,0);
      const diff=Math.round((cur-d)/86400000);
      if(diff<=1){streak++;cur=d}else break;
    }
  }

  const calDays=[];
  const now=new Date();
  for(let i=55;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const count=history.filter(h=>h.date===ds).length;
    calDays.push({date:ds,count,day:d.getDay()});
  }

  const lastWeek=history.filter(h=>{const d=(new Date()-new Date(h.date))/86400000;return d>=7&&d<14}).length;

  const acuteLoad=history.filter(h=>(new Date()-new Date(h.date))/86400000<7).reduce((a,h)=>a+(h.volume||0),0);
  const chronicLoad=history.filter(h=>(new Date()-new Date(h.date))/86400000<28).reduce((a,h)=>a+(h.volume||0),0)/4;
  const acwr=chronicLoad>0?(acuteLoad/chronicLoad).toFixed(2):0;
  const acwrPct=Math.min(100,Math.max(0,(parseFloat(acwr)/2)*100));

  const recentHist=history.filter(h=>(new Date()-new Date(h.date))/86400000<7);
  const muscleVol={};
  recentHist.forEach(h=>{
    const dayData=getProgramDays(h.phase||1).find(d=>d.name===h.day);
    if(dayData){
      dayData.supersets.flatMap(s=>s.exercises).forEach(ex=>{
        const info=exMap[ex.eid];
        if(info){muscleVol[info.m]=(muscleVol[info.m]||0)+ex.sets}
      });
    }
  });
  const maxVol=Math.max(1,...Object.values(muscleVol));

  const prList=Object.entries(prs).map(([eid,data])=>({eid,name:exMap[eid]?.n||eid,...data})).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const e1rmLog=ld('e1rmLog',{});
  const e1rmExercises=Object.entries(e1rmLog).filter(([,data])=>data.length>=2).sort((a,b)=>b[1].length-a[1].length).slice(0,8);

  const checkinHistory=history.filter(h=>h.kneePre!==undefined).slice(0,20);

  const strengthData={};
  history.slice(0,20).reverse().forEach(h=>{
    if(h.day&&h.date){
      if(!strengthData[h.day])strengthData[h.day]=[];
      strengthData[h.day].push({date:h.date,vol:h.volume||0});
    }
  });

  const deleteHist=(idx)=>{const h=[...history];h.splice(idx,1);sv('history',h);window.location.reload()};

  const weekWorkoutKcal=recentHist.reduce((a,h)=>a+(h.calories||0),0);
  const weekRunsP=runLog.filter(r=>(new Date()-new Date(r.date))/86400000<7);
  const weekRunKm=weekRunsP.reduce((a,r)=>a+r.dist,0);
  const weekRunKcal=weekRunsP.reduce((a,r)=>a+(r.cal||0),0);
  const weekTotalKcal=weekWorkoutKcal+weekRunKcal;
  const proteinTarget=Math.round(bw*2);
  const proteinDays7=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);proteinDays7.push(d.toISOString().slice(0,10))}
  const proteinCompDays=proteinDays7.filter(k=>(proteinLog[k]||0)>=proteinTarget).length;
  // --- Weight-loss regression forecast (least-squares over last 28d) ---
  const goalW=ld('weightGoal',75);
  const curW=weightLog.length?weightLog[weightLog.length-1].kg:bw;
  let weeklyWeightRate=0,pctPerWk=0,wlFlag=null,etaWeeks=null,etaDate=null,wlSpanDays=0;
  if(weightLog.length>=2){
    const sortedW=[...weightLog].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const t0=new Date(sortedW[0].date);
    const allPts=sortedW.map(w=>({x:(new Date(w.date)-t0)/86400000,y:w.kg}));
    const maxX=allPts[allPts.length-1].x;
    const pts=allPts.filter(p=>p.x>=maxX-28);
    const use=pts.length>=2?pts:allPts;
    wlSpanDays=use[use.length-1].x-use[0].x;
    weeklyWeightRate=Math.round(linSlope(use)*7*100)/100;
    pctPerWk=curW>0?Math.round(weeklyWeightRate/curW*1000)/10:0;
    if(wlSpanDays>=7){
      if(pctPerWk<=-1)wlFlag={c:'var(--red)',bg:'var(--red-d)',t:'Losing >1%/wk — too fast. A deficit this steep burns muscle and stalls your lifts. Ease it back ~200–300 kcal/day.'};
      else if(pctPerWk<=-0.5)wlFlag={c:'var(--grn)',bg:'var(--grn-d)',t:'Ideal rate (0.5–1%/wk) — fast enough to progress, slow enough to keep muscle while you rebuild.'};
      else if(pctPerWk<0)wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Slow, conservative loss. Fine if you feel strong; nudge the deficit for faster results.'};
      else if(pctPerWk<0.15)wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Plateaued 2+ weeks. If loss is the goal, tighten intake or add a run/finisher.'};
      else wlFlag={c:'var(--org)',bg:'var(--org-d)',t:'Trending up — expected during a strength push; watch it if fat loss is the priority.'};
    }
    if(weeklyWeightRate<0&&curW>goalW){
      etaWeeks=Math.ceil((curW-goalW)/(-weeklyWeightRate));
      if(etaWeeks>0&&etaWeeks<520){const dd=new Date();dd.setDate(dd.getDate()+etaWeeks*7);etaDate=dd.toISOString().slice(0,10);}
    }
  }

  const readiness=computeReadiness(history,acwr);

  // --- Relative strength: e1RM ÷ bodyweight per lift ---
  const bwAtDate=(date)=>{if(!weightLog.length)return bw;let best=weightLog[0],bd=Infinity;weightLog.forEach(w=>{const dd=Math.abs(new Date(w.date)-new Date(date));if(dd<bd){bd=dd;best=w}});return best.kg||bw;};
  const relStrength=e1rmExercises.map(([eid,data])=>{
    const latest=data[data.length-1],first=data[0];
    const rNow=latest.e1rm/bwAtDate(latest.date);
    const rThen=first.e1rm/bwAtDate(first.date);
    const pct=rThen>0?Math.round((rNow-rThen)/rThen*100):0;
    return{eid,name:exMap[eid]?.n||eid,rNow:Math.round(rNow*100)/100,pct,rawKg:Math.round((latest.e1rm-first.e1rm)*10)/10};
  }).filter(x=>x.rNow>0);

  // --- Stall detection: no e1RM improvement in last 3 sessions ---
  const stalledLifts=[];let progressingCount=0;
  Object.entries(e1rmLog).forEach(([eid,data])=>{
    if(data.length<3)return;
    if(data[data.length-1].e1rm<=data[data.length-3].e1rm)stalledLifts.push({name:exMap[eid]?.n||eid,e1rm:data[data.length-1].e1rm});
    else progressingCount++;
  });

  // --- Weekly volume vs growth landmarks (~10-20 sets/wk primary muscles) ---
  const PRIMARY=['Chest','Back','Quads','Hamstrings','Glutes','Calves','Shoulders','Triceps','Biceps','Legs'];
  const volStatus=(m,v)=>{if(!PRIMARY.includes(m))return null;if(v<8)return{c:'var(--org)',l:'low'};if(v>22)return{c:'var(--red)',l:'high'};return{c:'var(--grn)',l:'ok'};};

  return (
    <>
      <div className="hdr"><h1>Progress</h1></div>
      <div className="scroll">
        <div className="stat-grid">
          <div className="stat-card"><div className="val">{totalWorkouts}</div><div className="lbl">Total Workouts</div></div>
          <div className="stat-card"><div className="val">{thisWeek}</div><div className="lbl">This Week</div></div>
          <div className="stat-card"><div className="val">{streak}</div><div className="lbl">Day Streak</div></div>
          <div className="stat-card"><div className="val">{totalKcal.toLocaleString()}</div><div className="lbl">Total kcal</div></div>
        </div>

        {readiness ? (
          <div className="card" style={{padding:16,marginBottom:4}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:14,fontWeight:700}}>Readiness</div>
              <div style={{fontSize:11,color:'var(--t3)'}}>from recent check-ins · RPE · load</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:64,height:64,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:'conic-gradient('+readiness.color+' '+(readiness.score*3.6)+'deg,var(--c2) 0)'}}>
                <div style={{width:50,height:50,borderRadius:'50%',background:'var(--c1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,fontWeight:700}}>{readiness.score}</div>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,color:readiness.color}}>{readiness.label}</div>
                {readiness.factors.length>0 && (
                  <div style={{fontSize:11,color:'var(--t2)',marginTop:4,lineHeight:1.5}}>
                    {readiness.factors.map((f,i)=><div key={i}>· {f.t} <span style={{color:'var(--t3)'}}>({f.d})</span></div>)}
                  </div>
                )}
                {readiness.factors.length===0 && <div style={{fontSize:11,color:'var(--t2)',marginTop:4}}>No fatigue or pain flags — you're fresh.</div>}
              </div>

  const alts=EXDB.filter(e=>e.m===ex.m&&e.id!==ex.id);
  const altsByEq={};
  alts.forEach(a=>{if(!altsByEq[a.eq])altsByEq[a.eq]=[];altsByEq[a.eq].push(a)});
  return (
    <div className="card" style={{padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:600}}>{ex.n}</div>
          <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{ex.m} · {ex.eq}</div>
        </div>
        <div style={{display:'flex',gap:3,flexShrink:0}}>
          {ex.tags.map(t=><span key={t} className={'ex-tag tag-'+t}>{tagLabels[t]||t}</span>)}
        </div>
      </div>
      {ex.note && <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>{ex.note}</div>}

        <button className="btn btn-s" style={{width:'100%',marginTop:8,fontSize:11,padding:'6px 0'}}

      {showAlts && (
        <div style={{marginTop:8,borderTop:'0.5px solid var(--sep)',paddingTop:8}}>
          {Object.entries(altsByEq).map(([eq,exs])=>(
            <div key={eq} style={{marginBottom:6}}>

// === LIBRARY TAB ===
const LibraryTab=()=>{
  const[search,setSearch]=useState('');
  const[muscle,setMuscle]=useState('');
  const[equip,setEquip]=useState('');
  const[kneeSafe,setKneeSafe]=useState(false);
  const muscles=[...new Set(EXDB.map(e=>e.m))].sort();
  const equips=[...new Set(EXDB.map(e=>e.eq))].sort();
  const filtered=EXDB.filter(e=>{
    if(search&&!e.n.toLowerCase().includes(search.toLowerCase())&&!e.m.toLowerCase().includes(search.toLowerCase()))return false;
    if(muscle&&e.m!==muscle)return false;
    if(equip&&e.eq!==equip)return false;
    if(kneeSafe&&!e.tags.includes('k'))return false;
    return true;
  });
  return (
    <>
      <div className="hdr"><h1>Library</h1></div>
      <div className="scroll">
        <input className="inp" style={{width:'100%',marginBottom:12,textAlign:'left',paddingLeft:16}}
          placeholder="Search exercises..." value={search} onChange={e=>setSearch(e.target.value)} />
        <div className="filter-pills">
          <button className={'filter-pill'+(kneeSafe?' on':'')} onClick={()=>setKneeSafe(!kneeSafe)}>Knee-Safe</button>
          {muscles.map(m=>(
            <button key={m} className={'filter-pill'+(muscle===m?' on':'')} onClick={()=>setMuscle(muscle===m?'':m)}>{m}</button>
          ))}
        </div>
        <div className="filter-pills">
          {equips.map(eq=>(
            <button key={eq} className={'filter-pill'+(equip===eq?' on':'')} onClick={()=>setEquip(equip===eq?'':eq)}>{eq}</button>
          ))}
        </div>
        <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>{filtered.length} exercises</div>
        {filtered.map(ex=><LibraryCard key={ex.id} ex={ex} />)}
      </div>
    </>
  );
};

// === SETTINGS TAB ===
const SettingsTab=({showToast})=>{
  const[bw,setBw]=useState(ld('bodyweight',80));
  const[bwInput,setBwInput]=useState(String(bw));
  const[goal,setGoal]=useState(ld('weightGoal',75));
  const[goalInput,setGoalInput]=useState(String(ld('weightGoal',75)));
  const[waist,setWaist]=useState(ld('measurements',{}).waist||'');
  const[chest,setChest]=useState(ld('measurements',{}).chest||'');
  const[thigh,setThigh]=useState(ld('measurements',{}).thigh||'');
  const[restTime,setRestTime]=useState(ld('restTime',45));
  const[restEnabled,setRestEnabled]=useState(ld('restEnabled',true));
  const weightLog=ld('weightLog',[]);
  const lastWeighIn=weightLog.length>0?weightLog[weightLog.length-1]:null;
  const daysSinceWeighIn=lastWeighIn?Math.floor((new Date()-new Date(lastWeighIn.date))/86400000):999;

  const saveBw=()=>{
    const w=parseFloat(bwInput);
    if(!w)return;
    sv('bodyweight',w);setBw(w);
    const wl=ld('weightLog',[]);
    wl.push({kg:w,date:today()});
    sv('weightLog',wl);
    showToast('Weight saved: '+w+'kg');
  };

  const saveMeasurements=()=>{
    sv('measurements',{waist,chest,thigh,date:today()});
    showToast('Measurements saved');
  };

  const saveGoal=()=>{const g=parseFloat(goalInput);if(g){sv('weightGoal',g);setGoal(g);showToast('Goal set: '+g+'kg')}};

  const exportData=()=>{
    const data={};
    Object.keys(localStorage).filter(k=>k.startsWith('ic17_')).forEach(k=>{data[k]=localStorage.getItem(k)});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ironclad-backup-'+today()+'.json';a.click();
    showToast('Backup exported');
  };

  const importData=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
        showToast('Data imported - reloading...');
        setTimeout(()=>window.location.reload(),1000);
      }catch{showToast('Import failed - invalid file')}
    };
    reader.readAsText(file);
  };

  const clearAll=()=>{
    if(confirm('Delete ALL data? This cannot be undone.')){
      Object.keys(localStorage).filter(k=>k.startsWith('ic17_')).forEach(k=>localStorage.removeItem(k));
      showToast('All data cleared');
      setTimeout(()=>window.location.reload(),1000);
    }
  };

  const startWeight=weightLog.length>0?weightLog[0].kg:bw;
  const totalChange=Math.abs(startWeight-goal);
  const currentChange=Math.abs(startWeight-bw);
  const goalPct=totalChange>0?Math.min(100,Math.round(currentChange/totalChange*100)):0;

  return (
    <>
      <div className="hdr"><h1>Settings</h1></div>
      <div className="scroll">
        {daysSinceWeighIn>7 && (
          <div className="card" style={{padding:16,borderLeft:'3px solid var(--org)'}}>
            <div style={{fontSize:14,fontWeight:600,color:'var(--org)'}}>Time to weigh in!</div>
            <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>{daysSinceWeighIn===999?'No weigh-ins yet':'Last weigh-in: '+daysSinceWeighIn+' days ago'}</div>
          </div>
        )}

        <div className="section-t">Body Weight</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:'flex',gap:8}}>
            <input className="inp" style={{flex:1}} type="number" inputMode="decimal" placeholder="kg" value={bwInput} onChange={e=>setBwInput(e.target.value)} />
            <button className="btn btn-g" onClick={saveBw}>Save</button>
          </div>
          {lastWeighIn && <div style={{fontSize:12,color:'var(--t2)',marginTop:8}}>Last: {lastWeighIn.kg}kg on {fmtDate(lastWeighIn.date)}</div>}
        </div>

        <ProteinTracker />

        <div className="section-t">Weight Goal</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            <input className="inp" style={{flex:1}} type="number" inputMode="decimal" placeholder="Target kg" value={goalInput} onChange={e=>setGoalInput(e.target.value)} />
            <button className="btn btn-g" onClick={saveGoal}>Set</button>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--t2)',marginBottom:4}}>
            <span>Start: {startWeight}kg</span>
            <span>Current: {bw}kg</span>
            <span>Goal: {goal}kg</span>
          </div>
          <div className="goal-bar">
            <div className="goal-fill" style={{width:goalPct+'%',background:'var(--grn)'}} />
          </div>
          <div style={{fontSize:11,color:'var(--t3)',marginTop:4,textAlign:'center'}}>{goalPct}% to goal</div>
        </div>

        <div className="section-t">Body Measurements</div>
        <div className="card" style={{padding:16}}>
          {['Waist','Chest','Thigh'].map((label,i)=>{
            const val=[waist,chest,thigh][i];
            const setter=[setWaist,setChest,setThigh][i];
            return (
              <div key={label} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                <label style={{width:50,fontSize:13,color:'var(--t2)'}}>{label}</label>
                <input className="inp" style={{flex:1}} type="number" inputMode="decimal" placeholder="cm" value={val} onChange={e=>setter(e.target.value)} />
              </div>
            );
          })}
          <button className="btn btn-g" style={{width:'100%',marginTop:4}} onClick={saveMeasurements}>Save Measurements</button>
        </div>

        <div className="section-t">Rest Timer</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <span style={{fontSize:14}}>Auto Rest Timer</span>
            <button className={'btn '+(restEnabled?'btn-g':'btn-s')} style={{padding:'6px 16px'}}
              onClick={()=>{const v=!restEnabled;setRestEnabled(v);sv('restEnabled',v)}}>{restEnabled?'ON':'OFF'}</button>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[30,45,60,90].map(t=>(
              <button key={t} className={'btn'+(restTime===t?' btn-g':' btn-s')} style={{padding:'8px 16px'}}
                onClick={()=>{setRestTime(t);sv('restTime',t)}}>{t}s</button>
            ))}
          </div>
          <div style={{display:'flex',gap:8,marginTop:8,alignItems:'center'}}>
            <span style={{fontSize:13,color:'var(--t2)'}}>Custom:</span>
            <input className="inp" style={{width:80}} type="number" inputMode="numeric" value={restTime}
              onChange={e=>{const v=parseInt(e.target.value)||45;setRestTime(v);sv('restTime',v)}} />
          </div>
        </div>

        <div className="section-t">Data</div>
        <div className="card" style={{padding:16}}>
          <button className="btn btn-s" style={{width:'100%',marginBottom:8}} onClick={exportData}>Export JSON Backup</button>
          <label className="btn btn-s" style={{display:'block',textAlign:'center',width:'100%',marginBottom:8,cursor:'pointer'}}>
            Import Backup
            <input type="file" accept=".json" style={{display:'none'}} onChange={importData} />
          </label>
          <button className="btn btn-d" style={{width:'100%'}} onClick={clearAll}>Clear All Data</button>
        </div>

        <div className="section-t">Program Info</div>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>IronClad Pro v18 - Full Body Split</div>
          <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.5}}>
            3-day full-body split with 4 progressive phases. Each session: Warm-Up (low-impact cardio + ankle mobility + glute activation) &rarr; Compound Lifts &rarr; Cable/Machine + Calf Interleave &rarr; Trainer Rehab/Core &rarr; Conditioning Finisher. Calf rebuild: gastrocnemius (standing raises) + soleus (seated raises) each 2x/wk with 3s eccentric tempo. Knee-safe: all loaded knee work in shallow, pain-free ranges. Phase 1: Foundation (3x10-12), Phase 2: Build (4x8-10), Phase 3: Strength &amp; Power (4x5-8), Phase 4: Maintain &amp; Perform (3x6-10).
          </div>
          <div style={{fontSize:11,color:'var(--org)',lineHeight:1.5,marginTop:8,padding:'8px 10px',background:'var(--org-d)',borderRadius:8}}>
            &#9888; Pain-free ranges and loads should be confirmed with your physio / fysikalsk medisin assessment. Your physio&apos;s recommendations override any range or load prescribed here.
          </div>
        </div>
        <div style={{textAlign:'center',padding:'16px 0',fontSize:12,color:'var(--t3)'}}>v19.5 IronClad Pro</div>
      </div>
    </>
  );
};

// === MAIN APP ===
const App=()=>{
  const[tab,setTab]=useState('workout');
  const[dayView,setDayView]=useState(null);
  const[toast,setToast]=useState(null);

  const showToast=(msg)=>{setToast(msg)};

  if(dayView)return <DayView day={dayView.day} phase={dayView.phase} onBack={()=>setDayView(null)} />;

  const tabs=[
    {id:'workout',label:'Workout',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4'},
    {id:'progress',label:'Progress',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m14 0v-10a2 2 0 00-2-2h-2a2 2 0 00-2 2v10m14 0H3'},
    {id:'library',label:'Library',icon:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.347 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'},
    {id:'settings',label:'Settings',icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z'}
  ];

  return (
    <div className="app">
      {tab==='workout' && <WorkoutTab onOpenDay={(day,phase)=>setDayView({day,phase})} />}
      {tab==='progress' && <ProgressTab showToast={showToast} />}
      {tab==='library' && <LibraryTab />}
      {tab==='settings' && <SettingsTab showToast={showToast} />}
      <div className="tabs">
        {tabs.map(t=>(
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
              <path strokeLinecap="round" strokeLinejoin="round" d={t.icon} />
            </svg>
            {t.label}
          </button>
        ))}
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
